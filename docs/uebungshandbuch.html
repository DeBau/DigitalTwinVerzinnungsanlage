 das Programm hält den Zustand für „nicht in Ordnung“. Der Fehler zeigt sich also auf der sicheren Seite.</p><p>Eine Meldeleuchte soll dagegen auf den <b>Fehlerzustand</b> aufmerksam machen. −PF3 „Füllhöhe unterschritten“ leuchtet deshalb, wenn der Sensor <i>nicht</i> meldet. Die Negation gehört ins Programm, nicht in die Verdrahtung: Würde man den Sensor als Öffner umverdrahten, ginge die Drahtbruchsicherheit verloren. Bei der Farbe von Leuchtmeldern orientiert sich die Praxis an DIN EN 60204-1 (z. B. gelb für einen anormalen Zustand, grün für normal).</p>"},{"t":"−KF2 in der Freigabe – das Programm meldet nur","h":"<p>Not-Halt und Lichtvorhang schalten über das Sicherheitsrelais −KF2 hart ab, ganz unabhängig vom SPS-Programm. Der Eingang −KF2 ist nur eine Rückmeldung an die Standard-SPS. Trotzdem gehört er in die Freigabe: Ohne ihn würde das Programm nach einem Not-Halt so tun, als sei alles bereit, Anzeigen würden falsch leuchten, und gespeicherte Zustände könnten nach dem Quittieren unerwartet weiterwirken. Die Freigabe im Programm ersetzt die Sicherheitstechnik nicht, sie hält das Programm mit ihr im Einklang.</p>"},{"t":"FC, Ausgangsparameter und Gliederung","h":"<p>Ein FC hat kein Gedächtnis: Seine temporären Daten sind bei jedem Aufruf neu. Für eine reine Verknüpfung ohne Speicher ist das richtig – deshalb hier ein FC und kein FB. Wichtig: Jeder Ausgangsparameter eines FC muss bei <b>jedem</b> Aufruf beschrieben werden, sonst ist sein Wert undefiniert.</p><p>Gliedern Sie den Baustein in Netzwerke mit je einer Aufgabe (Grundstellung, Startfreigabe, Meldeleuchten) und benennen Sie sie. Der Siemens-Programmierleitfaden verlangt einen Bausteinkopf mit Beschreibung und symbolische statt absoluter Adressen – damit ein Kollege den Baustein versteht, ohne die Verdrahtung zu kennen.</p>"},{"t":"Funktionstabelle mit vielen Eingängen","h":"<p>Mit n Eingängen hat eine vollständige Funktionstabelle 2ⁿ Zeilen – bei sieben Bedingungen wären das 128. Für eine reine UND-Verknüpfung genügt eine verkürzte Tabelle: eine Zeile „alle Bedingungen 1“ und je eine Zeile, in der genau eine Bedingung 0 ist, die übrigen beliebig (Kennzeichen „x“). Diese Tabelle ist zugleich Ihr Testplan: Jede Zeile ist ein Prüfschritt am Zwilling.</p>"}]},"L08":{"beschr":"<p>Zum ersten Mal bewegt Ihr Programm die Anlage. Der Zwilling läuft mit <i>Verzinnen: Portal = SPS</i>: Die Ventile −MB1 bis −MB8 schaltet jetzt allein Ihre CPU. Bedient wird über das Tableau Handbetrieb an der linken Schaltschranktür – Wahlschalter −SA3 (1 = HAND), Leuchte −PF7 und je ein Taster pro Bewegung. Ziel ist ein Handbetrieb, mit dem ein Inbetriebnehmer jede Bewegung einzeln prüfen kann: Schaltet das richtige Ventil? Kommt die richtige Endlage? Stimmt die Fahrzeit?</p><p>Soll-Verhalten Schritt für Schritt:</p><ol><li>Ein FB <code>Manual</code> mit Instanz-DB wirkt nur, solange −SA3 auf HAND steht. −PF7 zeigt den Handbetrieb an. Steht −SA3 auf AUTO, sind alle Handtaster wirkungslos.</li><li>−MM1 bis −MM4 (5/2-Wegeventile bistabil) fahren im Tippbetrieb: Die Spule ist nur angesteuert, solange der Taster gedrückt ist.</li><li>Der Anschlag −MM5 hat ein monostabiles Ventil −MB9. −SF19 öffnet, −SF20 schließt; die gewünschte Stellung merkt sich der FB in <code>#statStopperOpen</code>. Tippen genügt hier nicht – warum, begründen Sie in Leitfrage 1. Umgekehrt fährt ein nur angetippter bistabiler Zylinder trotzdem bis in die Endlage; was das für den Handbetrieb bedeutet, klären Sie in Leitfrage 3.</li><li>Gegentaster: Drückt jemand beide Taster einer Bewegung zugleich, wird keine Spule dieser Bewegung angesteuert.</li><li>Jeder Ausgang wird an genau einer Stelle im Programm geschrieben. In L11 wird daraus die Befehlsausgabe.</li></ol><p>Randfälle, die Sie bewusst prüfen: Taster gedrückt halten und dabei −SA3 auf AUTO drehen; −SF19 betätigen und anschließend −SF20; beide Gegentaster drücken und einen davon loslassen.</p><p>Zur Einstellung des Zwillings: Warum steht hier auch <i>Band, Anschlag, Vereinzeler</i> auf SPS? Nur so schaltet allein Ihr Programm den Anschlag −MM5 über −MB9 – im Übungsumfang „automatisch“ würde das Bandmodul ihn selbst öffnen und schließen, und Ihr Ausgang bliebe ohne Wirkung. Zugleich steht das Band still, solange Ihr Programm es nicht einschaltet: Während Sie von Hand fahren, kann kein neuer Korb unerwartet an den Übergabeplatz laufen.</p><p>Zum Schluss fahren Sie ganz bewusst eine gefährliche Kombination, zum Beispiel −MM3 bei abgesenktem Korb. Beobachten Sie die 3D-Ansicht und die Ereignisliste. Ihr Handbetrieb hat noch keine Verriegelungen – genau das ist der Auftrag für L09. Sammeln Sie dafür alle Lagen, in denen eine Bewegung nicht gefahren werden darf.</p><p>Abzugeben sind:</p><ul><li>der FB <code>Manual</code> mit Bausteinkopf, statischen Variablen statt Merkern und kommentierten Netzwerken,</li><li>die Tabelle Taster – Ventil – Endlage, selbst am Zwilling überprüft,</li><li>eine Liste der beobachteten gefährlichen Kombinationen als Vorarbeit für L09.</li></ul><p>Erfolgreich ist die Übung, wenn alle Prüfpunkte erfüllt sind, die Querverweisliste für jeden Ausgang genau eine Schreibstelle zeigt und Sie das unterschiedliche Verhalten der bistabilen und des monostabilen Ventils erklären können.</p>","wissen":[{"t":"Bistabile und monostabile Wegeventile","h":"<p>Ein <b>bistabiles</b> 5/2-Wegeventil (Impulsventil) hat zwei Spulen und keine Feder. Ein kurzer Impuls auf eine Spule schaltet den Schieber um, und er bleibt dort, auch wenn die Spule wieder stromlos ist. Der Zylinder fährt deshalb bis in die Endlage weiter, selbst wenn der Taster schon losgelassen ist. Auch nach einem Spannungsausfall bleibt die Stellung erhalten.</p><p>Ein <b>monostabiles</b> Ventil hat eine Spule und eine Rückstellfeder. Nur solange die Spule Strom hat, steht es in Schaltstellung; ohne Signal drückt die Feder es in die Ruhestellung. Beim Anschlag −MM5 bedeutet das: −MB9 = 0 heißt „Anschlag schließt“. Ein monostabiles Ventil braucht also ein <b>Dauersignal</b>, solange die Schaltstellung gewollt ist – und das Programm muss diesen Wunsch speichern.</p>"},{"t":"Tippbetrieb – was er kann und was nicht","h":"<p>Tippbetrieb heißt: Der Befehl steht nur so lange an, wie der Bediener den Taster betätigt. Der Bediener steht dabei am Tableau, sieht die Anlage und gibt bewusst jeden einzelnen Befehl. Es gibt keinen gespeicherten Fahrbefehl, der später unerwartet wirksam wird – etwa wenn eine Verriegelung wegfällt oder die Betriebsart wechselt.</p><p>Wichtig für die Praxis: Mit einem bistabilen 5/2-Ventil lässt sich ein Zylinder durch Loslassen <b>nicht</b> mitten im Hub anhalten – das Ventil bleibt geschaltet. Wer Zylinder im Handbetrieb anhalten können muss, braucht 5/3-Ventile mit Mittelstellung. Tippen verhindert hier also nicht die Weiterfahrt, sondern einen dauerhaft anstehenden Befehl.</p>"},{"t":"Gegentaster und Ansteuerung beider Spulen","h":"<p>Liegen an einem bistabilen Ventil beide Spulen gleichzeitig an, ist das Ergebnis nicht festgelegt: Je nach Bauart bleibt der Schieber in seiner alten Lage, oder die zuerst angesteuerte Spule setzt sich durch. Ein Programm darf sich auf so ein Verhalten nie verlassen. Deshalb gilt: Werden beide Taster einer Bewegung gedrückt, wird keine Spule angesteuert. Das ist eine gegenseitige Verriegelung der Befehle, vergleichbar mit der Verriegelung eines Wendeschützes – nur in Software statt mechanisch.</p>"},{"t":"Kennzeichen nach DIN EN 81346-2 lesen","h":"<p>Die Betriebsmittelkennzeichen sagen, welche Aufgabe ein Gerät hat: <b>−SF</b> ist ein handbetätigtes Signalgerät (Taster), <b>−SA</b> ein Wahlschalter, <b>−MB</b> eine Ventilspule (Antrieb durch Magnet), <b>−MM</b> ein Zylinder, <b>−BG</b> ein Sensor für eine Lage, <b>−PF</b> eine Meldeleuchte. Wer die Tabelle Taster – Ventil – Endlage aufstellt, prüft damit den Weg vom Bedienelement über das Programm bis zur Rückmeldung. Prüfen Sie dabei auch die Richtung: Zu „Senken“ gehört die Endlage „unten“, nicht „oben“. Vertauschte Zuordnungen sind einer der häufigsten Inbetriebnahmefehler.</p>"},{"t":"Zustände im FB statt in Merkern","h":"<p>Die gespeicherte Stellung des Anschlags gehört als statische Variable <code>#statStopperOpen</code> in den Instanz-DB des FB, nicht in einen globalen Merker. Der Grund: Ein Merker kann von jeder Stelle des Programms beschrieben werden, man sieht ihm nicht an, wem er gehört, und bei mehreren Instanzen kommen sich die Aufrufe in die Quere. Eine statische Variable gehört genau einem Baustein, wird mit ihm zusammen getestet und lässt sich als Instanz vervielfältigen. So empfiehlt es der Siemens-Programmierleitfaden für S7-1200/1500.</p>"},{"t":"Warum ein Handbetrieb ohne Verriegelung gefährlich ist","h":"<p>Der Handbetrieb gibt dem Bediener die volle Gewalt über jeden Antrieb – auch über Kombinationen, die die Automatik nie fahren würde. Ein Verschiebezylinder, der einen abgesenkten Korb durch das Bad oder gegen eine Kante zieht, beschädigt Mechanik und Werkstück. Diese Übung zeigt das bewusst, damit Sie in L09 die Verriegelungen aus beobachteten Gefahren ableiten und nicht aus der Vermutung. Personenschutz ist davon getrennt: Er läuft über Not-Halt, Lichtvorhang und das Sicherheitsrelais −KF2.</p>"}]},"L09":{"beschr":"<p>Ausgangslage: Nach einer Störung hängt der Korb über dem Zinnbad. Der Instandhalter schaltet −SA3 auf HAND und will das Portal Zylinder für Zylinder in die Grundstellung bringen. Ihr Handbetrieb aus L08 erlaubt aber jede Bewegung in jeder Lage – ein falscher Tastendruck, und der Korb wird seitlich durch das Bad gezogen oder die Abdeckung fährt gegen den Korb. In dieser Übung machen Sie den Handbetrieb kollisionsfrei.</p><p>Vorgehen und Soll-Verhalten:</p><ol><li><b>Gefährdungsmatrix:</b> Stellen Sie für jede Bewegung von −MM1 bis −MM5 zusammen, in welchen Lagen sie nicht gefahren werden darf und warum. Ausgangspunkt sind Ihre Beobachtungen aus L08 und die Mindest-Verriegelungen des Betreibers in der Tabelle. Prüfen Sie jede Zeile am Zwilling, bevor Sie programmieren.</li><li><b>Baustein <code>Interlock</code>:</b> Für jede Bewegung bilden Sie eine eigene Freigabe, z. B. <code>#releaseToBath</code>. Der Baustein ist vom Handbetrieb getrennt, denn in L11 sollen dieselben Freigaben auch für die Automatik gelten.</li><li><b>Handbetrieb anpassen:</b> Eine Spule wird nur angesteuert, wenn Taster UND Freigabe anstehen. Drückt der Bediener einen Taster, dessen Freigabe fehlt, passiert nichts – und −PF7 blinkt (Taktgeber aus L04), damit er merkt, dass die Sperre gewollt ist und kein Defekt vorliegt.</li><li><b>Lücken schließen:</b> Die Tabelle des Betreibers ist bewusst unvollständig. Ergänzen Sie die Verriegelungen für den Anschlag −MM5 und für Anheben bzw. Absenken am Übergabeplatz. Begründen Sie jede Ergänzung mit einer konkreten Kollision.</li></ol><p>Randfälle: Ein Zylinder ist unterwegs und meldet keine Endlage. Ein Sensor fällt aus (forcen Sie ihn auf 0). Ein Taster wird gedrückt gehalten, während die Freigabe erst kommt – überlegen Sie, ob die Bewegung dann starten darf, und halten Sie Ihre Entscheidung fest.</p><p>Zur Einstellung des Zwillings: Warum steht hier auch <i>Band, Anschlag, Vereinzeler</i> auf SPS? Nur so schaltet allein Ihr Programm den Anschlag −MM5 über −MB9 – im Übungsumfang „automatisch“ würde das Bandmodul ihn selbst öffnen und schließen, und Ihr Ausgang bliebe ohne Wirkung. Zugleich steht das Band still, solange Ihr Programm es nicht einschaltet: Während Sie von Hand fahren, kann kein neuer Korb unerwartet an den Übergabeplatz laufen. Der Anschlag gehört deshalb in Ihre Gefährdungsmatrix.</p><p>Was Sie nicht programmieren: Verriegelungen gegen Personengefährdung. Die übernimmt die Sicherheitstechnik mit −KF2. Ihre Verriegelungen schützen Maschine und Werkstück.</p><p>Abzugeben sind:</p><ul><li>die Gefährdungsmatrix, von der Lehrkraft abgezeichnet,</li><li>der Baustein <code>Interlock</code> mit einer kommentierten Freigabe je Bewegung und der angepasste FB <code>Manual</code>,</li><li>ein Prüfprotokoll: je Verriegelung die Ausgangslage, der betätigte Taster, die erwartete und die beobachtete Reaktion.</li></ul><p>Erfolgreich ist die Übung, wenn jede Verriegelung einzeln nachgewiesen ist, ein auf 0 geforcter Freigabesensor die zugehörige Bewegung sperrt und Sie zu jeder Freigabe sagen können, welche Kollision sie verhindert.</p>","wissen":[{"t":"Verriegelung und Freigabe","h":"<p>Eine <b>Verriegelung</b> verhindert, dass eine Bewegung in einer Lage ausgeführt wird, in der sie Schaden anrichtet. Programmtechnisch ist sie eine <b>Freigabe</b> je Bewegung: eine Bedingung, die 1 sein muss, damit der Befehl das Ventil erreicht. Eine eigene Variable je Bewegung (statt einer langen Verknüpfung direkt am Ausgang) hat drei Vorteile: Man sieht im Beobachten sofort, welche Freigabe fehlt, man kann sie auf dem HMI anzeigen, und man kann sie in L11 für die Automatik wiederverwenden.</p>"},{"t":"Verriegeln auf Endlagen, nicht auf Befehle","h":"<p>Ein Befehl sagt nur, was das Programm will. Ob der Zylinder dort angekommen ist, weiß man erst durch den Endlagensensor. Zwischen beidem liegen Fahrzeit, Druckschwankungen, eine zugedrehte Drossel, ein verklemmter Korb. Wer auf den Befehl „anheben“ verriegelt, gibt das Verschieben frei, obwohl der Korb noch unten hängt.</p><pre class=\"code\"><code>// unsicher: Befehl\n#releaseToBath := #statCmdRaise;\n// richtig: gemeldete Endlage\n#releaseToBath := \"BG3_MM2_oben\";</code></pre><p>Nebeneffekt: Während der Bewegung meldet keine Endlage, also ist auch keine darauf aufbauende Freigabe da. Das ist gewollt.</p>"},{"t":"Sensorausfall liegt auf der sicheren Seite","h":"<p>Weil Freigaben an Sensorsignalen = 1 hängen, sperrt ein Drahtbruch oder ein defekter Sensor die Bewegung, statt sie zu erlauben. Genau das prüfen Sie, wenn Sie einen Freigabesensor auf 0 forcen. Würde eine Freigabe dagegen auf „Sensor meldet nicht“ (Negation) aufbauen, gäbe ein Drahtbruch die Bewegung frei. Formulieren Sie Freigaben deshalb möglichst positiv: „erlaubt, wenn … gemeldet ist“.</p>"},{"t":"Gefährdungsmatrix – systematisch statt aus dem Gedächtnis","h":"<p>In der Matrix stehen die Bewegungen in den Zeilen und die relevanten Lagen (Korb oben oder unten, über Band oder Bad, Abdeckung offen oder zu, Anschlag offen oder zu) in den Spalten. Jedes Feld beantwortet: Darf die Bewegung hier fahren – ja oder nein, und warum? So fällt auf, was man beim Nachdenken leicht übersieht, etwa Bewegungen am Übergabeplatz, an dem Korb, Haken und Anschlag eng zusammenspielen. Die Matrix ist gleichzeitig Testplan und Dokumentation für den Betreiber.</p>"},{"t":"Maschinenschutz ist keine Sicherheitsfunktion","h":"<p>Verriegelungen in der Standard-SPS schützen Maschine und Werkstück. Sie sind keine Sicherheitsfunktion im Sinne der DIN EN ISO 13849-1, denn Standard-SPS, Sensoren und Programm sind nicht dafür ausgelegt und nicht so geprüft. Personen werden über Not-Halt, Lichtvorhang −BG20 und das Sicherheitsrelais −KF2 geschützt, die hart abschalten. Verwechseln Sie beides nicht: Eine Programmverriegelung darf nie als Begründung dienen, eine Schutzeinrichtung wegzulassen.</p>"},{"t":"Rückmeldung an den Bediener","h":"<p>Eine Sperre, die der Bediener nicht erkennt, sieht aus wie ein Defekt: Er drückt den Taster, nichts passiert, er sucht den Fehler am Ventil. Deshalb blinkt −PF7, sobald ein Taster ohne Freigabe betätigt wird. Das Blinken unterscheidet sich vom Dauerlicht „Handbetrieb aktiv“ und braucht keine zusätzliche Leuchte. Den Takt liefert Ihr Baustein <code>Clock</code> aus L04 – kein Taktmerker der CPU.</p>"}]},"L10":{"beschr":"<p>Bisher kennt Ihr Programm nur den Handbetrieb (L08) mit Verriegelungen (L09). Ab L12 kommt eine Automatik dazu. Bevor der erste Automatikschritt entsteht, legen Sie fest, <b>wer</b> die Anlage wann führt. Dafür bekommt die Anlage einen Betriebsartenteil: den FB <code>ModeSelect</code>. Er liest den Wahlschalter −SA3 an der Schaltschranktür (1 = HAND, 0 = AUTO) und die Rückmeldung des Sicherheitsrelais −KF2 und liefert die beiden Zustände <code>#statModeManual</code> und <code>#statModeAuto</code>. Alle anderen Bausteine fragen nur noch diese Zustände ab, nicht mehr den Schalter selbst.</p><p>Soll-Verhalten:</p><ul><li>Es ist höchstens eine Betriebsart aktiv, nie beide. Das sichern Sie im Programm ab und machen es im Test sichtbar.</li><li>Bei −KF2 = 0 (Not-Halt, Schutzfeld verletzt) sind beide Betriebsarten 0. Nach dem Quittieren wird die gewählte Betriebsart wieder aktiv – aber nichts bewegt sich von selbst.</li><li>HAND: −PF7 leuchtet, die Handtaster wirken über die Verriegelungen aus L09.</li><li>AUTO: Handtaster wirkungslos. Ohne Grundstellung (<code>#homePosition</code> aus L07) ist AUTO nicht startbereit, −PF1 blinkt mit 1 Hz (Baustein <code>Clock</code> aus L04).</li><li>Der Wechsel zwischen HAND und AUTO löst selbst keine Bewegung aus.</li></ul><p>Der schwierigste Randfall ist der Anschlag −MM5. Im Handbetrieb haben Sie seine Stellung in <code>#statStopperOpen</code> gespeichert, und sein monostabiles Ventil −MB9 braucht ein Dauersignal. Was passiert, wenn beim Wechsel nach AUTO die Handstellung abfällt? Der Anschlag schließt – eine Bewegung, die niemand befohlen hat, womöglich mitten in einen Korb hinein. Entscheiden Sie, wie Ihr Programm damit umgeht, und begründen Sie die Entscheidung schriftlich. Es gibt mehr als eine vertretbare Lösung; entscheidend ist, dass das Verhalten festgelegt, dokumentiert und geprüft ist.</p><p>Zur Einstellung des Zwillings: Warum steht hier auch <i>Band, Anschlag, Vereinzeler</i> auf SPS? Nur so schaltet allein Ihr Programm den Anschlag −MM5 über −MB9 – im Übungsumfang „automatisch“ würde das Bandmodul ihn selbst öffnen und schließen, und Ihr Ausgang bliebe ohne Wirkung. Zugleich steht das Band still, solange Ihr Programm es nicht einschaltet: Beim Umschalten, kann kein neuer Korb unerwartet an den Übergabeplatz laufen.</p><p>Weitere Randfälle zum Prüfen: Umschalten, während ein Handtaster gedrückt ist; Not-Halt in HAND und in AUTO; −SA3 umschalten, während −KF2 = 0 ist, und danach quittieren.</p><p>Abzugeben sind:</p><ul><li>der FB <code>ModeSelect</code> mit Bausteinkopf und kommentierten Netzwerken,</li><li>ein Zustandsdiagramm der Betriebsarten (Zustände HAND, AUTO, keine) mit allen Übergängen und ihren Bedingungen,</li><li>Ihre schriftliche Entscheidung zum Anschlag −MM5 beim Betriebsartenwechsel,</li><li>ein Testprotokoll zu allen Prüfpunkten.</li></ul><p>Erfolgreich ist die Übung, wenn Zustandsdiagramm und Programm übereinstimmen, in keiner Lage eine unbefohlene Bewegung auftritt und Sie die Leitfragen begründet beantworten können.</p>","wissen":[{"t":"Betriebsart und Betriebsartenteil","h":"<p>Eine <b>Betriebsart</b> legt fest, wer die Anlage führt und welche Befehle wirken: im Handbetrieb der Bediener mit Einzelbefehlen, in der Automatik die Schrittkette. Der <b>Betriebsartenteil</b> ist der Programmteil, der die Betriebsart bildet und an alle anderen Teile weitergibt. Eine klassische Ablaufsteuerung gliedert sich in Betriebsartenteil, Ablaufteil und Befehlsausgabe (L11). Der Vorteil: Die Regeln für das Umschalten stehen an einer einzigen Stelle. Fragt jeder Baustein den Wahlschalter selbst ab, entstehen widersprüchliche Sonderregeln, die niemand mehr überblickt.</p>"},{"t":"Gegenseitiger Ausschluss – warum nie beide","h":"<p>Sind HAND und AUTO gleichzeitig aktiv, haben zwei Befehlsquellen Zugriff auf dieselben Ventile. Der Bediener tippt „anheben“, während die Schrittkette „senken“ ausgibt – im besten Fall reagiert nichts, im schlechtesten fährt der Zylinder unvorhersehbar. Außerdem rechnet die Kette mit Lagen, die sie selbst herbeigeführt hat; greift der Bediener dazwischen, stimmen ihre Annahmen nicht mehr. Ein Wahlschalter mit einem Eingang schließt beides zwar elektrisch aus, aber das Programm muss es trotzdem sicherstellen: etwa bei −KF2 = 0, bei späteren Erweiterungen (HMI-Umschaltung) oder bei einem Programmierfehler. Eine Prüfung „nie beide 1“ in einer Beobachtungstabelle macht das sichtbar.</p>"},{"t":"Stoßfreies Umschalten","h":"<p>Stoßfrei heißt: Der Wechsel der Betriebsart erzeugt weder einen neuen Befehl noch lässt er einen anstehenden so wegfallen, dass sich etwas bewegt. Bei bistabilen Ventilen ist das einfach – fällt das Signal weg, bleibt das Ventil, wo es ist. Bei monostabilen Ventilen ist der <b>Wegfall</b> des Signals selbst eine Bewegung, weil die Feder umschaltet. Deshalb muss man bei jedem federrückgestellten Antrieb festlegen, wer das Dauersignal nach dem Wechsel weiter hält oder ob die Federstellung in diesem Moment ungefährlich ist. Ebenso gilt: Ein Taster, der beim Umschalten schon gedrückt ist, darf in der neuen Betriebsart nicht plötzlich als neuer Befehl wirken.</p>"},{"t":"Not-Halt, Quittieren und kein selbsttätiger Wiederanlauf","h":"<p>Der Not-Halt schaltet über −KF2 hart ab; das Programm erfährt davon über den Eingang −KF2. Es setzt dann beide Betriebsarten und alle gespeicherten Befehle zurück. Nach DIN EN ISO 13850 darf das Rücksetzen des Not-Halts allein keinen Wiederanlauf auslösen, und DIN EN 60204-1 verlangt, dass ein Wiederanlauf nur durch eine bewusste Bedienhandlung erfolgt. Für Ihr Programm heißt das: Nach dem Quittieren steht die Betriebsart wieder bereit, aber jede Bewegung braucht einen neuen Befehl – einen neuen Tastendruck in HAND oder ein neues START in AUTO.</p>"},{"t":"Grundstellung als Bedingung für AUTO, nicht für HAND","h":"<p>Die Automatik setzt voraus, dass sie eine bekannte Lage vorfindet – sonst passen ihre Weiterschaltbedingungen nicht. Deshalb ist AUTO ohne Grundstellung nicht startbereit, und −PF1 blinkt als Aufforderung, sie herzustellen. Der Handbetrieb ist dagegen genau das Werkzeug, mit dem man eine Anlage <b>aus</b> einer beliebigen Lage in die Grundstellung bringt. Würde HAND eine Grundstellung verlangen, könnte man nach einer Störung nie wieder herauskommen.</p>"},{"t":"Wahlschalter an der Schaltschranktür, Zustandsdiagramm","h":"<p>Der Handbetrieb hebt die Automatik auf und ist für Einrichter und Instandhalter gedacht, nicht für den Produktionsbediener am Pult. DIN EN 60204-1 verlangt, dass die Wahl der Betriebsart gegen unbefugte Benutzung gesichert werden kann, etwa durch einen Schlüsselschalter oder einen Ort, den nur befugtes Personal erreicht. Das <b>Zustandsdiagramm</b> zeigt jede Betriebsart als Zustand und jeden Wechsel als Pfeil mit Bedingung. Fehlt zu einem Zustand ein Ausgang (z. B. von „keine“ zurück), hat auch das Programm diese Lücke – das Diagramm ist deshalb zugleich Entwurf und Prüfmittel.</p>"}]},"L11":{"beschr":"<p>Ihr Programm hat jetzt einen Handbetrieb (L08), Verriegelungen (L09) und einen Betriebsartenteil (L10). Noch schreibt der Handbetrieb die Ventile −MB1 bis −MB9 selbst. Ab L12 kommt die Schrittkette dazu, und sie braucht dieselben Ventile. Würde sie diese ebenfalls direkt schreiben, hätte jeder Ausgang zwei Schreibstellen – und nur die letzte im Zyklus wirkt. Bevor das passiert, bauen Sie die Struktur um: Hand und Automatik liefern künftig nur noch <b>Befehle</b>, und eine einzige Befehlsausgabe, der FB <code>CommandOutput</code>, schreibt die Ventile.</p><p>Vorgehen und Soll-Verhalten:</p><ol><li><b>Bestandsaufnahme:</b> Öffnen Sie in TIA die Querverweisliste der Ausgänge %Q0.0 bis %Q2.2 und notieren Sie zu jedem Ausgang jede Stelle, an der er geschrieben wird – Baustein, Netzwerk, Art des Zugriffs.</li><li><b>Handbetrieb umbauen:</b> <code>Manual</code> liefert nur noch Handbefehle je Bewegung (z. B. <code>#manLower</code>) und schreibt keinen Ausgang mehr.</li><li><b>Befehlsausgabe:</b> Je Ventil genau eine Zuweisung nach dem Muster der Aufgabenstellung: Handbefehl in HAND oder Auto-Befehl in AUTO, jeweils nur mit Freigabe.</li><li><b>Verriegelungen:</b> Verknüpfen Sie die Freigaben aus <code>Interlock</code> (L09) in der Befehlsausgabe statt im Handbetrieb. Damit gelten sie in HAND und AUTO.</li><li><b>Bistabile Ventile:</b> Stehen Befehle für beide Spulen zugleich an, wird keine Spule angesteuert – egal, aus welcher Quelle die Befehle kommen.</li><li><b>Auto-Seite testen:</b> Die Schrittkette gibt es noch nicht. Setzen Sie die Auto-Befehle in einer Beobachtungstabelle und prüfen Sie, dass sie nur in AUTO und nur mit Freigabe wirken.</li></ol><p>Beachten Sie den Anschlag −MM5: Seine gespeicherte Handstellung und Ihre Entscheidung aus L10 zum Betriebsartenwechsel müssen auch nach dem Umbau gelten.</p><p>Zur Einstellung des Zwillings: Warum steht hier auch <i>Band, Anschlag, Vereinzeler</i> auf SPS? Nur so schaltet allein Ihr Programm den Anschlag −MM5 über −MB9 – im Übungsumfang „automatisch“ würde das Bandmodul ihn selbst öffnen und schließen, und Ihr Ausgang bliebe ohne Wirkung. Zugleich steht das Band still, solange Ihr Programm es nicht einschaltet: Während Sie von Hand fahren, kann kein neuer Korb unerwartet an den Übergabeplatz laufen.</p><p>Randfälle: Betriebsartenwechsel bei anstehendem Befehl; Not-Halt (beide Betriebsarten 0 – kein Ventil darf angesteuert bleiben, das nicht ausdrücklich so festgelegt ist); Freigabe fällt während einer Bewegung weg.</p><p>Abzugeben sind:</p><ul><li>die Querverweisliste <b>vor</b> und <b>nach</b> dem Umbau (Ausdruck oder Bildschirmfoto) mit Ihren Anmerkungen,</li><li>der FB <code>CommandOutput</code> und der geänderte FB <code>Manual</code>, beide mit Bausteinkopf und kommentierten Netzwerken,</li><li>eine Skizze der Programmstruktur: welcher Baustein liefert welches Signal an welchen,</li><li>ein Testprotokoll zu allen Prüfpunkten, einschließlich der Beobachtungstabelle für die Auto-Befehle.</li></ul><p>Erfolgreich ist die Übung, wenn die Querverweisliste für jedes Ventil −MB1 bis −MB9 genau eine Schreibstelle zeigt, alle Prüfpunkte erfüllt sind und Sie erklären können, warum diese Struktur die Grundlage für L12 und alle folgenden Übungen ist.</p>","wissen":[{"t":"Zyklische Bearbeitung und Prozessabbild","h":"<p>Eine SPS arbeitet ihr Programm nicht ereignisgesteuert ab, sondern im <b>Zyklus</b>: Zu Beginn liest das Betriebssystem alle Eingänge in das <b>Prozessabbild der Eingänge</b> (PAE). Dann wird der OB 1 mit allen aufgerufenen Bausteinen von oben nach unten durchlaufen. Jede Zuweisung an einen Ausgang ändert dabei nur das <b>Prozessabbild der Ausgänge</b> (PAA) – einen Speicherbereich in der CPU, noch nicht die Klemme. Erst am Zyklusende überträgt das Betriebssystem das PAA an die Ausgangsbaugruppe, danach beginnt der nächste Zyklus.</p><p>Die Folge: Was ein Ausgang zwischendurch im Programm war, sieht das Ventil nie. Es sieht nur den Wert, der am <b>Ende</b> des Zyklus im PAA steht. Ein S7-1500-Zyklus dauert typischerweise wenige Millisekunden; die Klemme ändert sich also ständig nur in diesem Takt.</p>"},{"t":"Warum Doppelzuweisungen entstehen – die letzte Zuweisung gewinnt","h":"<p>Eine Doppelzuweisung entsteht fast nie absichtlich, sondern beim Erweitern: Der Handbetrieb schreibt das Ventil schon, dann kommt die Schrittkette dazu, und dort ist es am bequemsten, dasselbe Ventil noch einmal zuzuweisen.</p><pre class=\"code\"><code>// Netzwerk 3, Handbetrieb\n\"MB5_Zinnbad\" := #manToBath;\n// Netzwerk 12, Schrittkette\n\"MB5_Zinnbad\" := #statStep4;</code></pre><p>Beide Zeilen werden in jedem Zyklus bearbeitet. Netzwerk 12 überschreibt das PAA, also gewinnt immer die Kette. Drückt der Bediener in HAND den Taster, setzt Netzwerk 3 das Ventil auf 1, Netzwerk 12 setzt es im selben Zyklus wieder auf 0 – das Ventil bekommt nie ein Signal. Mit Setzen und Rücksetzen an verschiedenen Stellen ist es noch tückischer: Dann wirkt mal die eine, mal die andere Stelle, je nachdem, welche Bedingung gerade erfüllt ist, und der Fehler tritt nur in bestimmten Lagen auf.</p><p>Warum so schwer zu finden? Der Compiler meldet nichts, denn mehrfaches Schreiben ist erlaubt. Beim Beobachten zeigt Netzwerk 3 ein sauberes VKE 1 – das Programm sieht an dieser Stelle richtig aus. Man muss wissen, dass weiter hinten jemand anders denselben Ausgang schreibt.</p>"},{"t":"Doppelzuweisungen mit der Querverweisliste finden","h":"<p>Die <b>Querverweisliste</b> in TIA Portal zeigt für einen Operanden jede Verwendungsstelle im Programm: Baustein, Netzwerk und Zugriffsart (lesend oder schreibend). Sie erreichen sie über das Kontextmenü einer Variable oder eines Bausteins bzw. über das Menü Extras; im Inspektorfenster steht sie für die markierte Variable unter Info. Gehen Sie systematisch vor:</p><ul><li>Liste auf die Ausgänge filtern bzw. sortieren.</li><li>Für jeden Ausgang die schreibenden Zugriffe zählen. Ziel ist genau einer, und der liegt in <code>CommandOutput</code>.</li><li>Auch indirekte Schreibstellen beachten: einen Bausteinausgang, der direkt mit einem %Q-Operanden verschaltet ist, Setzen/Rücksetzen-Befehle und Zugriffe von HMI oder Beobachtungstabellen, die Ausgänge statt Befehlsvariablen steuern.</li></ul><p>Machen Sie die Prüfung zur Gewohnheit: nach jeder Übung ab L12 einmal die Querverweise der Ausgänge ansehen.</p>"},{"t":"Befehle statt Ausgänge – Gliederung der Ablaufsteuerung","h":"<p>Liefern Handbetrieb und Schrittkette nur Befehle, ist die Zuständigkeit klar getrennt: <code>Manual</code> entscheidet, was der Bediener will, <code>Tinning</code> (ab L12), was der Ablauf will, <code>ModeSelect</code>, wer gerade gilt, <code>Interlock</code>, was erlaubt ist – und <code>CommandOutput</code> setzt das in genau einer Zeile je Ventil um. Das hat handfeste Vorteile:</p><ul><li><b>Diagnose:</b> Bewegt sich ein Zylinder nicht, schaut man in genau eine Zeile und sieht, ob der Befehl, die Betriebsart oder die Freigabe fehlt.</li><li><b>Erweiterung:</b> Eine neue Befehlsquelle (HMI, Einzelzyklus, Störungsrückfahrt) bekommt einen eigenen Befehlspfad, ohne bestehende Bausteine anzufassen.</li><li><b>Test:</b> Befehle lassen sich in einer Beobachtungstabelle setzen, bevor die Kette existiert, und die Kette lässt sich prüfen, ohne dass sie gleich Ventile schaltet.</li></ul><p>Das entspricht dem Grundsatz des Siemens-Programmierleitfadens: jeder Ausgang genau eine Schreibstelle.</p>"},{"t":"Warum die Verriegelungen in die Befehlsausgabe gehören","h":"<p>Die Befehlsausgabe ist die letzte Stelle vor dem Ventil. Was hier gesperrt ist, kommt aus keiner Quelle durch – weder vom Handtaster noch von der Kette, einer späteren HMI-Schaltfläche oder einer Beobachtungstabelle. Stünden die Verriegelungen im Handbetrieb, wäre die Automatik ungeschützt. Stünden sie in der Schrittkette, müsste man sie in jedem Schritt wiederholen und bei jeder Änderung an mehreren Stellen pflegen – und der erste vergessene Schritt ist eine Kollision.</p><p>Die Weiterschaltbedingungen der Kette ersetzen keine Verriegelung: Sie legen fest, wann der Ablauf weitergeht, prüfen aber nicht, ob die Bewegung in der aktuellen Lage zulässig ist, etwa nach einem Eingriff im Handbetrieb oder einem Sensorfehler. Auch hier gilt: Verriegelt wird auf gemeldete Endlagen, und Personenschutz bleibt Aufgabe von −KF2.</p>"},{"t":"Bistabile Ventile in der Befehlsausgabe","h":"<p>Bei einem bistabilen Ventil sind beide Spulen zwei getrennte Ausgänge, aber ein gemeinsamer Schieber. Kommen die Befehle für beide Spulen gleichzeitig – etwa ein Handbefehl und ein noch anstehender Auto-Befehl, oder zwei Schritte, die sich überlappen –, ist das Verhalten des Ventils nicht festgelegt. Weil in der Befehlsausgabe alle Quellen zusammenlaufen, ist sie der einzige Ort, an dem dieser Konflikt sicher erkannt und abgefangen werden kann. In L08 haben Sie dasselbe Prinzip schon für die Gegentaster angewendet; jetzt gilt es für alle Befehle.</p>"}]},"L12":{"beschr":"<p><b>Ausgangslage:</b> Bis L11 haben Sie das Gerüst der Ablaufsteuerung gebaut: den Handbetrieb <code>Manual</code> (L08), die Freigaben <code>Interlock</code> (L09), den Betriebsartenteil <code>ModeSelect</code> (L10) und die Befehlsausgabe <code>CommandOutput</code> (L11), die als einzige Stelle die Ventile −MB1 bis −MB8 schreibt. Ihre Auto-Befehle haben Sie bisher von Hand in einer Beobachtungstabelle gesetzt. Jetzt kommt der Ablaufteil dazu: Ein Korb liegt am Anschlag (−BG40), und das Portal soll ihn auf START einmal vollständig verzinnen – einhängen, über das Bad fahren, tauchen, abtropfen, zurückfahren, absetzen, lösen. Band, Anschlag und Vereinzeler laufen in dieser Übung automatisch.</p><p><b>Soll-Verhalten:</b> Die Tabelle gibt zehn Schritte mit Aktion, Ventil und Weiterschaltbedingung vor. Daraus entsteht zuerst ein GRAFCET, dann das Programm im FB <code>Tinning</code>.</p><ol><li>Initialschritt 1: Die Kette wartet. Sie verlässt ihn nur in AUTO, bei startbereiter Anlage und auf START. Was „startbereit“ genau umfasst (z. B. <code>#readyToStart</code> aus L07, Korb an −BG40), legen Sie fest und schreiben es an die Transition.</li><li>Jeder Bewegungsschritt setzt nur den Auto-Befehl seiner Bewegung. Weitergeschaltet wird auf die gemeldete Endlage, nie auf eine geschätzte Zeit.</li><li>Schritt 2 wartet zusätzlich auf den offenen Anschlag −BG15, bevor angehoben wird.</li><li>In den Schritten 6 und 7 läuft die Tauch- bzw. Abtropfzeit erst ab Erreichen der Endlage. Die Sollwerte kommen aus Variablen, nicht als feste Konstante im <code>TON</code>; im Zwilling stellen Sie sie unter <i>Prozess</i> zwischen 2 und 30 s ein.</li><li>Schritt 8 enthält zwei Aktionen zugleich (abdecken und zurückfahren). Weiter geht es erst, wenn beide Endlagen gemeldet sind.</li><li>Nach Schritt 10 kehrt die Kette in den Initialschritt zurück. Dauer- und Einzelzyklus folgen in L13; hier genügt ein Zyklus je START.</li></ol><p><b>Rand- und Fehlerfälle:</b> Bleibt eine Endlage aus (Prüfpunkt: −BG7 auf 0 forcen), muss die Kette im aktuellen Schritt stehen bleiben, und es darf keine nachfolgende Bewegung beginnen. Eine Störmeldung mit Überwachungszeit kommt erst in L17. Überlegen Sie außerdem, was bei einem Wechsel nach HAND oder bei Not-Halt mitten im Zyklus mit der Kette geschieht. Sie darf danach nicht von selbst weiterlaufen. Wie sie zurückgesetzt wird, entscheiden Sie und dokumentieren es.</p><p><b>Vorgaben:</b> Die Kette läuft nur bei <code>#statModeAuto</code>. Sie liefert ausschließlich Auto-Befehle an <code>CommandOutput</code>; kein Schritt schreibt einen Ausgang. Wählen Sie Variante A (statische Bool-Variable je Schritt, Setzen/Rücksetzen in FUP) oder Variante B (<code>CASE #statStep OF</code> in SCL, mit ELSE-Zweig).</p><p><b>Abgabe:</b> GRAFCET als Skizze, kommentiertes Programm mit Bausteinkopf, Bildschirmfoto des Weg-Zeit-Diagramms eines vollständigen Zyklus und die Querverweisliste der Ausgänge %Q0.0 bis %Q0.7. <b>Erfolg</b> bedeutet: Alle Prüfpunkte sind erfüllt, und die Ereignisliste meldet keinen „Korb mangelhaft“.</p>","wissen":[{"t":"GRAFCET: Schritt, Transition, Aktion","h":"<p>GRAFCET nach DIN EN 60848 ist eine herstellerneutrale Sprache, mit der man Ablaufsteuerungen beschreibt. Ein <b>Schritt</b> ist ein Zustand, in dem die Anlage verweilt (Rechteck mit Nummer, der Initialschritt ist doppelt umrandet). Eine <b>Transition</b> ist der waagrechte Strich zwischen zwei Schritten. An ihr steht die Bedingung, unter der weitergeschaltet wird, z. B. „−BG3“. Eine <b>Aktion</b> steht im Kästchen rechts neben dem Schritt und beschreibt, was die Steuerung in diesem Schritt tut.</p><p>Die Regel ist streng: Eine Transition schaltet nur, wenn der Schritt davor aktiv <b>und</b> ihre Bedingung erfüllt ist. Dann wird der Vorgänger inaktiv und der Nachfolger aktiv. Deshalb lässt sich jeder Stillstand eindeutig erklären („Schritt 5 aktiv, Transition wartet auf −BG7“). Zuerst entwerfen, dann programmieren: Der GRAFCET ist zugleich Pflichtenheft, Prüfgrundlage und Dokumentation für die Instandhaltung.</p>"},{"t":"Kontinuierliche Aktionen und bistabile Ventile","h":"<p>Eine <b>kontinuierlich wirkende Aktion</b> ist nur so lange 1, wie ihr Schritt aktiv ist. Für die bistabilen 5/2-Wegeventile −MB1 bis −MB8 reicht das: Das Ventil bleibt in seiner Schaltstellung, auch wenn die Spule später abfällt. Die Kette muss also nichts speichern. Sie gibt den Befehl, bis die Endlage kommt.</p><p>Dieselbe Bewegung kommt in mehreren Schritten vor (Anheben in Schritt 3 und 7, Senken in Schritt 6 und 9). Daraus wird <b>ein</b> Auto-Befehl, den Sie aus den beteiligten Schritten mit ODER bilden:</p><pre class=\"code\"><code>// Prinzip: ein Befehl, mehrere Schritte\n#autoCmdX := (#statStep = 3) OR (#statStep = 7);</code></pre><p>Würden Sie stattdessen in jedem Schritt einzeln setzen und rücksetzen, entstehen Doppelzuweisungen (L11), und ein vergessenes Rücksetzen lässt einen Befehl über den Schritt hinaus stehen.</p>"},{"t":"Weiterschalten auf Endlagen statt auf Zeiten","h":"<p>Fahrzeiten schwanken mit Druck, Last, Drosseleinstellung und Verschleiß. Eine Kette, die nach „1,5 s ist −MM2 oben“ weiterschaltet, fährt irgendwann mit halb angehobenem Korb gegen den Badrand. Die Endlage dagegen meldet, dass die Bewegung <b>tatsächlich</b> abgeschlossen ist. Deshalb steht in jeder Bewegungstransition ein Sensor. Bleibt er aus, bleibt die Kette sicher stehen. Genau das prüfen Sie mit −BG7 = 0.</p><p>Bei Schritt 8 gilt das für beide Bewegungen: Würde schon die erste Endlage weiterschalten, könnte −MM2 absenken, bevor −MM3 über dem Band ist.</p>"},{"t":"Prozesszeiten ab Endlage, Sollwerte als Variable","h":"<p>Tauch- und Abtropfzeit sind Prozessgrößen: Gemeint ist die Zeit, die der Korb wirklich im Zinn hängt bzw. über dem Bad abtropft. Startet der Timer schon beim Schrittwechsel, frisst die Fahrzeit des Zylinders einen Teil davon auf. Je langsamer die Drossel, desto kürzer wird die wirksame Tauchzeit. Der Zwilling misst jeden Korb gegen den eingestellten Sollwert und meldet ab 0,5 s Unterschreitung „Korb mangelhaft“. Deshalb gilt: <code>TON</code> als Multiinstanz, Eingang = Schritt aktiv UND Endlage.</p><p>Der Sollwert gehört in eine Variable vom Typ <code>Time</code> (z. B. am Bausteineingang oder in einem Rezept-DB). Wenn er fest im Programm steht, verlangt jede Rezeptänderung einen Programmeingriff. Das ist fehleranfällig und im Betrieb nicht zulässig.</p>"},{"t":"Umsetzung: Schritt-Bits oder CASE","h":"<p><b>Variante A</b> bildet jeden Schritt als statische Bool-Variable: Setzen durch Vorgängerschritt UND Transition, Rücksetzen durch den Nachfolgerschritt (und bei Abbruch). Das liest sich wie der GRAFCET, birgt aber eine Gefahr. Bei einem Fehler können zwei Schritte gleichzeitig aktiv sein oder keiner.</p><p><b>Variante B</b> hält den aktiven Schritt in einer einzigen Int-Variablen <code>#statStep</code>. Es kann also immer nur ein Schritt aktiv sein. Der Styleguide verlangt zu jedem CASE einen ELSE-Zweig. Er fängt unerwartete Werte ab, z. B. nach einer Programmänderung, statt die Kette stumm hängen zu lassen:</p><pre class=\"code\"><code>CASE #statStep OF\n  1: ;  // Initialschritt\n  ELSE  // unbekannter Schritt: melden, definiert zurück\n    #statStep := 1;\nEND_CASE;</code></pre>"},{"t":"Warum die Kette nur Befehle liefert","h":"<p>Die Gliederung aus L11 trennt <b>was</b> geschehen soll (Ablaufteil) von <b>ob</b> es geschehen darf (Verriegelung) und <b>wer</b> gerade führt (Betriebsart). Schreibt die Kette die Ventile selbst, umgeht sie die Verriegelungen, und im Handbetrieb überschreibt sie die Handbefehle. Liefert sie nur Auto-Befehle, gelten alle Freigaben aus L09 auch in der Automatik. Die Querverweisliste beweist das mit genau einer Schreibstelle je Ventil.</p>"}]},"L13":{"beschr":"<p><b>Ausgangslage:</b> Die Schrittkette <code>Tinning</code> aus L12 fährt auf START genau einen Zyklus und bleibt dann im Initialschritt stehen. Für den Produktionsbetrieb reicht das nicht: Der Betreiber will in AUTO zwei Ablaufarten, die er mit dem Wahlschalter −SA1 am Bedienpult wählt (1 = Dauerbetrieb, 0 = Einzelzyklus). Die Erweiterung gehört in den Betriebsartenteil <code>ModeSelect</code> aus L10. Die Kette selbst bekommt nur eine geänderte Transition 1 → 2.</p><p><b>Soll-Verhalten:</b></p><ol><li><b>Dauerbetrieb:</b> Eine positive Flanke an START −SF1 setzt die statische Variable <code>#statContinuous</code>. Solange sie 1 ist, startet die Kette nach Schritt 10 sofort den nächsten Zyklus, sobald die übrigen Startbedingungen (AUTO, startbereit) erfüllt sind. Fehlt z. B. der nächste Korb an −BG40, wartet sie im Initialschritt und läuft weiter, sobald er da ist.</li><li><b>STOP:</b> −SF2 (Öffner) setzt <code>#statContinuous</code> zurück. Der laufende Korb wird fertig verzinnt, die Kette hält danach in Schritt 1.</li><li><b>Einzelzyklus:</b> Jede positive Flanke an START löst genau einen Zyklus aus. Wer START gedrückt hält, bekommt trotzdem nur einen Zyklus.</li><li>Rücksetzen von <code>#statContinuous</code> außerdem bei Wechsel auf Einzelzyklus, Wechsel auf HAND und bei Not-Halt (−KF2 = 0). Rücksetzen hat Vorrang vor Setzen.</li><li>−PF1 zeigt <code>#statContinuous</code>.</li></ol><p><b>Randfälle, die Sie bewusst prüfen und im Protokoll beschreiben:</b> Umschalten von Dauerbetrieb auf Einzelzyklus mitten im Zyklus (Leitfrage 2). START, während die Kette schon läuft. START und STOP gleichzeitig. Not-Halt während AUTO, dann quittieren: Die Anlage darf nicht von selbst wieder anlaufen, auch nicht, wenn START noch gedrückt ist. Klären Sie außerdem, wie sich das Dauerlicht von −PF1 mit dem 1-Hz-Blinken „AUTO, aber keine Grundstellung“ aus L10 verträgt. Beide Anzeigen nutzen dieselbe Leuchte, also braucht es eine eindeutige Rangfolge.</p><p><b>Vorgaben:</b> Flankenauswertung mit <code>R_TRIG</code> als Multiinstanz (keine Flankenmerker). STOP wird als Öffner ausgewertet. Die Kette liefert weiter nur Auto-Befehle an <code>CommandOutput</code>.</p><p><b>Abgabe:</b> geändertes Programm (<code>ModeSelect</code> und Transition 1 → 2), ergänztes Zustandsdiagramm aus L10 mit den Zuständen Dauerbetrieb/Einzelzyklus und ein kurzes Prüfprotokoll zu den vier Prüfpunkten. <b>Erfolg:</b> Alle Prüfpunkte sind am Zwilling nachgewiesen, die Leitfragen sind schriftlich beantwortet.</p>","wissen":[{"t":"Flankenauswertung: warum START kein Dauersignal sein darf","h":"<p>Ein Taster liefert 1, solange er gedrückt ist. Bei einer CPU-Zykluszeit von wenigen Millisekunden sieht das Programm diese 1 in Hunderten Zyklen hintereinander. Wertet die Transition den Pegel aus, startet ein gehaltener START-Taster nach Schritt 10 sofort den nächsten Zyklus. Aus dem Einzelzyklus wird ein Dauerbetrieb, den niemand gewählt hat. Eine <b>positive Flanke</b> ist dagegen nur in dem einen Zyklus 1, in dem das Signal von 0 auf 1 wechselt. Jeder Tastendruck zählt also genau einmal.</p><pre class=\"code\"><code>#instStartEdge(CLK := #startButton);\n// #instStartEdge.Q ist genau einen Zyklus lang 1</code></pre><p>Der Styleguide legt <code>R_TRIG</code> als Multiinstanz im FB an, nicht als Flankenmerker. Ein Merker ist global, jeder Baustein kann ihn versehentlich mitbenutzen, und schon wertet eine zweite Stelle dieselbe Flanke aus und verpasst sie.</p>"},{"t":"Dauerbetrieb und Einzelzyklus","h":"<p>Im <b>Dauerbetrieb</b> gibt der Bediener einmal den Auftrag „produzieren“, und die Anlage arbeitet Korb für Korb ab. Im <b>Einzelzyklus</b> löst jeder START genau einen Zyklus aus. Das braucht man beim Einfahren nach einer Umstellung, bei Musterteilen oder nach einer Störung, wenn jeder Korb einzeln begutachtet werden soll. −SA1 ist ein rastender Wahlschalter, also ein Dauersignal. Er wählt nur die Ablaufart, gestartet wird immer mit −SF1.</p><p>Der Unterschied liegt nur in der Bedingung der Transition 1 → 2. Deshalb bleibt die Kette unverändert, und die Ablaufart wird im Betriebsartenteil gebildet.</p>"},{"t":"Zyklusende abwarten: warum STOP nicht sofort anhält","h":"<p>STOP ist ein <b>betriebsmäßiges Anhalten</b>, kein Not-Halt. Würde die Kette sofort stehen bleiben, hinge der Korb womöglich im Zinn oder über dem offenen Bad. Die Teile wären über- oder unterverzinnt, also Ausschuss, und der nächste Start müsste aus einer undefinierten Lage erfolgen. „Zyklusende abwarten“ heißt: Der laufende Korb wird regulär fertig, und die Anlage steht danach in Grundstellung. Von dort kann sie jederzeit wieder starten.</p><p>Gefahren wehrt dagegen der Not-Halt ab. Er schaltet hart über −KF2 ab (Stopp-Kategorie nach DIN EN 60204-1), unabhängig vom Programm.</p>"},{"t":"STOP als Öffner und rücksetzdominanter Speicher","h":"<p>−SF2 ist drahtbruchsicher als Öffner verdrahtet: unbetätigt = 1. Reißt eine Leitung, liest die SPS 0, und das wirkt wie ein gedrückter STOP. Die Anlage beendet den Dauerbetrieb, statt unkontrolliert weiterzulaufen. Ein Schließer würde bei Drahtbruch einfach nie mehr anhalten.</p><p><code>#statContinuous</code> ist ein Speicher mit mehreren Rücksetzbedingungen. Er muss <b>rücksetzdominant</b> sein: Liegen Setzen (START) und Rücksetzen (STOP, Not-Halt …) gleichzeitig an, gewinnt das Rücksetzen. Im SCL-Programm erreichen Sie das, indem die Rücksetzabfrage nach der Setzabfrage steht.</p>"},{"t":"Kein Wiederanlauf nach Not-Halt","h":"<p>DIN EN 60204-1 fordert: Das Rücksetzen eines Not-Halts darf die Maschine nicht wieder in Gang setzen. Nach dem Quittieren an −SF4 gibt −KF2 wieder frei. Wäre <code>#statContinuous</code> dann noch 1, würde die Kette sofort losfahren, vielleicht während jemand noch an der Anlage steht. Deshalb wird der Dauerbetrieb bei −KF2 = 0 gelöscht, und nach dem Quittieren braucht es eine neue, bewusste START-Flanke.</p><p>Aus demselben Grund darf ein schon vor dem Quittieren gedrückter START nicht zählen. Die Flanke muss also nach der Freigabe kommen.</p>"}]},"L14":{"beschr":"<p><b>Ausgangslage:</b> Die Anlage hat fünf Not-Halt-Taster: −SF0 am Bedienpult, −SF8 an der Vor-Ort-Steuerstelle −S10 (Band 1), −SF9 an −S20 (Band 2), −SF10 an −S30 (Rollenkurve) und −SF33 an −S40 (Prüfstation). Alle wirken über das Sicherheitsrelais −KF2. Es schaltet Ventile, Schütze und Heizung hart ab, unabhängig davon, was Ihr Programm tut. Die SPS erfährt nur über −KF2 (1 = Freigabe), <b>dass</b> abgeschaltet ist, nicht <b>warum</b>. Für die Diagnose hat jeder Not-Halt-Taster zusätzlich einen Meldekontakt auf einem normalen Eingang (−SF0 … −SF33, Öffner, 1 = entriegelt). Jede Steuerstelle hat außerdem einen eigenen Quittiertaster mit Leuchtmelder: −SF4/−PF5 am Pult, −SF41/−PF12 bis −SF44/−PF15 an −S10 bis −S40. Auch der Lichtvorhang −BG20 schaltet über −KF2 ab.</p><p><b>Soll-Verhalten:</b></p><ol><li>Der <b>erste</b> ausgelöste Not-Halt wird in <code>#statFirstEStop</code> (Int, 0 = keiner, 1 bis 5 je Taster, Zuordnung legen Sie fest) gespeichert. Weitere Taster, die danach gedrückt werden, überschreiben ihn nicht.</li><li>Wird über −KF2 abgeschaltet, ohne dass ein Not-Halt-Meldekontakt gefallen ist, und war das Schutzfeld −BG20 unterbrochen, entsteht eine eigene Meldung „Lichtvorhang“. Bedenken Sie: −BG20 meldet nach dem Durchgriff sofort wieder frei, −KF2 bleibt aber bis zum Quittieren abgeschaltet.</li><li>Beim Wiederanlauf von −KF2 (positive Flanke) ermittelt das Programm, an welcher Steuerstelle quittiert wurde, und meldet z. B. „quittiert an −S30“.</li><li>Alle fünf Quittier-Leuchttaster blinken mit 2 Hz, solange −KF2 nicht freigibt.</li><li>Erstwert und Quittierort erscheinen als Meldetext auf dem HMI. Wann der Erstwert gelöscht wird (z. B. erst beim nächsten Not-Halt), legen Sie fest und begründen es.</li></ol><p><b>Rand- und Fehlerfälle:</b> zwei Taster innerhalb weniger Millisekunden (gleicher CPU-Zyklus), ein Not-Halt während das Schutzfeld unterbrochen ist, ein Quittierversuch bei noch gedrücktem Not-Halt. Prüfen Sie auch einen Drahtbruch am Meldekontakt (Eingang auf 0 forcen). Was zeigt Ihre Diagnose dann an, und was tut −KF2?</p><p><b>Vorgaben:</b> Ein eigener FB (z. B. <code>EStopDiag</code>) mit Multiinstanzen für Flanken und Blinktakt. Keine Merker, auch keine Taktmerker. Die Meldekontakte werden <b>nur gemeldet</b>, sie schalten nichts ab.</p><p><b>Abgabe:</b> Programm, eine Tabelle Taster – Steuerstelle – Eingang – Erstwert-Nummer, HMI-Meldetexte und ein Prüfprotokoll zu den vier Prüfpunkten. <b>Erfolg:</b> Erstwert und Quittierort stimmen in jedem geprüften Fall, der Lichtvorhang wird nicht als Not-Halt gemeldet, und die Leuchttaster blinken nur dann, wenn tatsächlich quittiert werden muss.</p>","wissen":[{"t":"Sicherheitsfunktion und Diagnose trennen","h":"<p>Der Not-Halt ist eine Sicherheitsfunktion. Seine Zuverlässigkeit wird nach DIN EN ISO 13849-1 mit einem Performance Level (PL) bewertet. Eine Standard-SPS erreicht diese Anforderungen nicht: Ein Programmfehler, ein Forcen oder eine CPU im STOP dürften die Abschaltung nie verhindern. Deshalb schaltet −KF2 die Energie hart ab, die SPS bekommt nur Rückmeldungen. Die Meldekontakte sind <b>Diagnose</b>. Sie helfen, den Grund schnell zu finden, und dürfen nichts sicherheitsrelevant beeinflussen. Würde man sie zum Abschalten nutzen, hinge die Sicherheit an nicht bewerteter Hardware und Software.</p><p>Nach DIN EN ISO 13850 rastet ein Not-Halt beim Betätigen ein. Das Entriegeln des Tasters gibt die Anlage noch nicht frei, erst ein bewusstes Rücksetzen (Quittieren) tut das.</p>"},{"t":"Erstwertmeldung","h":"<p>Fällt etwas aus, folgen oft weitere Meldungen. Drückt z. B. ein Werker −SF9 und ein zweiter danach erschrocken −SF0, stehen am Ende zwei gedrückte Taster da. Für die Ursachenforschung zählt aber nur der <b>erste</b>, der Erstwert. Das Prinzip stammt aus der Störmeldetechnik: Erfasst wird, solange noch kein Erstwert gespeichert ist; danach ist der Speicher „gesperrt“, bis er bewusst gelöscht wird.</p><p>Fallen zwei Eingänge im selben CPU-Zyklus, kann die SPS die Reihenfolge nicht mehr unterscheiden. Dann entscheidet die Reihenfolge der Abfrage im Programm. Dokumentieren Sie diese Grenze, statt eine Genauigkeit vorzutäuschen, die es nicht gibt.</p>"},{"t":"Meldekontakte als Öffner","h":"<p>Die Meldekontakte sind Öffner: entriegelt = 1. Das ist dieselbe Drahtbruchsicherheit wie bei STOP (L13). Eine unterbrochene Leitung meldet „betätigt“ und fällt damit auf. Ein Schließer würde einen Drahtbruch verschweigen, und im Ernstfall zeigte die Diagnose nichts an. Die Kehrseite: Ein Drahtbruch erzeugt eine Not-Halt-Meldung, obwohl −KF2 freigibt. Das Programm kann diesen Widerspruch erkennen und als „Meldekontakt gestört“ unterscheiden.</p>"},{"t":"Lichtvorhang und Quittierort erkennen","h":"<p>Beim Lichtvorhang −BG20 ist die Ursache nur kurz sichtbar. Nach dem Durchgriff meldet das Schutzfeld sofort wieder frei, −KF2 bleibt aber abgeschaltet. Wer erst später nachsieht, findet keinen Grund mehr. Die Ursache muss deshalb in dem Moment festgehalten werden, in dem −KF2 abfällt.</p><p>Ähnliches gilt beim Quittieren. Die fünf Quittiertaster liegen parallel am Reset-Eingang von −KF2, haben aber je einen eigenen SPS-Eingang. Sicherheitsrelais mit <b>überwachtem Start</b> geben oft erst beim <i>Loslassen</i> des Tasters frei. Wenn −KF2 wieder 1 meldet, ist der Taster dann möglicherweise schon wieder 0. Überlegen Sie, welche Information Sie sich vorher merken müssen.</p>"},{"t":"Blinkmelder ohne Taktmerker","h":"<p>Ein blinkender Leuchttaster fordert zu einer Handlung auf. DIN EN 60204-1 sieht Blinklicht vor, um Aufmerksamkeit zu erregen. 2 Hz bedeuten 250 ms an, 250 ms aus. Weil das schneller ist als die 1 Hz für „AUTO ohne Grundstellung“ aus L10, sind beide gut zu unterscheiden.</p><p>Der Styleguide verbietet Taktmerker. Ihre Frequenz hängt von der CPU-Konfiguration ab, sie sind global und machen einen Baustein unbrauchbar, sobald er in ein anderes Projekt ohne denselben Taktmerker wandert. Bilden Sie den Takt im FB selbst, z. B. mit einer <code>TON</code>-Multiinstanz, die sich nach Ablauf neu startet und dabei eine statische Bool-Variable umschaltet.</p>"}]},"L15":{"beschr":"<p><b>Ausgangslage:</b> Band 1 wird vom Getriebemotor −MA1 angetrieben. In dieser Übung läuft er am Netz über die Wendeschützkombination −QA1 (Rechtslauf = Förderrichtung) und −QA2 (Linkslauf). Beide Schütze sind mechanisch gegeneinander verriegelt. Der Motorschutzschalter −FA1 meldet über seinen Hilfskontakt (1 = OK). Für Reinigung und Wartung soll das Band direkt an der Vor-Ort-Steuerstelle −S10 hinten am Bandanfang gefahren werden. Dort sitzen Schlüsselschalter −SA2, die Taster Rechts −SF5, Links −SF6 und Halt −SF7 (Öffner), die Leuchte −PF6 und der Not-Halt −SF8. Das Portal läuft automatisch, die übrige Förderstrecke steht. Ihr Programm schaltet nur −QA1, −QA2 und −PF6.</p><p><b>Soll-Verhalten:</b></p><ol><li>Mit −SA2 = 1 hat die Vor-Ort-Steuerstelle Vorrang, −PF6 leuchtet. Mit −SA2 = 0 sind −SF5 und −SF6 wirkungslos. Ob ein laufendes Band beim Abziehen des Schlüssels stehen bleibt, entscheiden und begründen Sie (vergleiche den stoßfreien Wechsel in L10).</li><li>Ein kurzer Druck auf Rechts startet den Rechtslauf, das Band läuft nach dem Loslassen weiter (Selbsthaltung). Für Links gilt dasselbe.</li><li>Halt −SF7, ein ausgelöster Motorschutz −FA1 oder ein Not-Halt (−KF2 = 0) löschen beide Richtungen. Nach Beheben der Ursache läuft das Band <b>nicht</b> von selbst wieder an.</li><li>Gegenseitige Verriegelung: Läuft das Band rechts, ist Links wirkungslos und umgekehrt. Die Richtung wechselt nur über Halt.</li><li>Ein ausgelöster Motorschutz wird gemeldet (HMI-Meldung oder Meldeleuchte, nach Ihrer Wahl).</li></ol><p><b>Rand- und Fehlerfälle:</b> beide Richtungstaster gleichzeitig, Halt und Richtung gleichzeitig, Drahtbruch an −SF7 (Eingang auf 0 forcen), −FA1 fällt während der Fahrt, Schlüssel wird während der Fahrt umgeschaltet.</p><p><b>Vorgehen und Vorgaben:</b> Zeichnen Sie <b>zuerst</b> den Stromlaufplan der Wendeschützschaltung in konventioneller Schütztechnik (Hauptstromkreis und Steuerstromkreis mit Selbsthaltung, Verriegelung, Halt und Motorschutz). Übertragen Sie ihn dann in KOP in einen eigenen FB (z. B. <code>ConveyorLocal</code>). Die Selbsthaltung liegt als statische Variable im FB, und −QA1/−QA2 werden an genau einer Stelle geschrieben, wie die Ventile in L11. Wie die Freigaben aus L09 ist auch hier die Verriegelung im Programm Pflicht, obwohl die Schütze mechanisch verriegelt sind (Leitfrage 1).</p><p><b>Abgabe:</b> Stromlaufplan (Skizze), KOP-Programm mit Bausteinkopf, Gegenüberstellung „Bauteil im Stromlaufplan → Element im KOP“ und Prüfprotokoll. <b>Erfolg:</b> Alle vier Prüfpunkte sind erfüllt. Nach Motorschutz, Halt oder Not-Halt ist ein neuer Tastendruck nötig.</p>","wissen":[{"t":"Wendeschützschaltung und Verriegelungsarten","h":"<p>Ein Drehstrommotor kehrt seine Drehrichtung um, wenn zwei Außenleiter getauscht werden. Das übernehmen zwei Schütze: −QA1 legt L1-L2-L3 an, −QA2 vertauscht zwei Phasen. Ziehen beide gleichzeitig an, entsteht ein <b>Kurzschluss zwischen zwei Außenleitern</b>. Deshalb gibt es mehrere Verriegelungsebenen:</p><ul><li><b>mechanisch</b> (Verriegelungsbaustein zwischen den Schützen): Beide können nie zugleich schließen.</li><li><b>Schützverriegelung</b>: Ein Öffner des einen Schützes liegt im Spulenkreis des anderen. Die Richtung wechselt nur über Halt.</li><li><b>Tasterverriegelung</b>: Der Gegentaster öffnet den Kreis. Damit ist eine direkte Umkehr möglich, aber hart für Getriebe und Last.</li></ul><p>An einem Förderband mit Getriebe und Korb ist „Richtungswechsel nur über Halt“ die schonende Wahl. Ein Gegenstrom-Umschalten erzeugt hohe Ströme und Drehmomentstöße.</p>"},{"t":"Warum zusätzlich im Programm verriegeln","h":"<p>Die mechanische Verriegelung verhindert das gleichzeitige Schließen der Hauptkontakte, aber nicht, dass beide Spulen angesteuert werden. Je nach Spulenausführung belastet das die Spule, deren Anker blockiert ist. Außerdem kann ein verschweißter Kontakt oder ein Schütztausch ohne Verriegelungsbaustein die mechanische Ebene unwirksam machen. Die Programmverriegelung sorgt dafür, dass ein Fehlbefehl gar nicht erst entsteht. Sie ist zugleich nachvollziehbar dokumentiert und prüfbar. Mehrere unabhängige Ebenen sind in der Praxis die Regel.</p>"},{"t":"Selbsthaltung und Wiederanlaufschutz","h":"<p>In der Schütztechnik hält sich ein Schütz über seinen eigenen Hilfsschließer parallel zum Starttaster. Fällt die Spannung aus, fällt das Schütz ab und bleibt aus. Das ist ein eingebauter <b>Wiederanlaufschutz</b>, wie ihn DIN EN 60204-1 verlangt. In der SPS übernimmt eine statische Variable diese Rolle. Sie fällt aber <i>nicht</i> von selbst ab, wenn −KF2 die Schütze spannungslos macht. Deshalb muss das Programm die Selbsthaltung bei Not-Halt, Motorschutz und Halt ausdrücklich löschen. Sonst zieht das Schütz nach dem Quittieren sofort wieder an.</p><p>Die Selbsthaltung ist <b>ausschaltdominant</b> (rücksetzdominant): Werden Halt und Rechts gleichzeitig gedrückt, bleibt das Band stehen.</p>"},{"t":"Öffner im Stromlaufplan und im KOP","h":"<p>−SF7 ist ein Öffner, unbetätigt liegt also 1 am Eingang. Bei Drahtbruch sieht die SPS 0, und das wirkt wie Halt: Das Band bleibt stehen. Ein Schließer würde bei Drahtbruch das Anhalten unmöglich machen.</p><p>Beim Übertragen in KOP stolpern viele: Im Stromlaufplan zeichnen Sie für Halt ein Öffnersymbol. Im KOP fragen Sie dagegen den <b>Signalzustand</b> ab. „Halt nicht betätigt“ heißt Eingang = 1, also steht dort ein <b>Schließerkontakt</b> (−| |−). Ein Öffnerkontakt (−|/|−) im KOP würde die Logik umkehren: Das Band liefe nur, solange Halt gedrückt ist. Dieselbe Überlegung gilt für den Hilfskontakt von −FA1 (1 = OK).</p>"},{"t":"Motorschutzschalter","h":"<p>−FA1 ist ein Motorschutzschalter (3RV2). Er löst thermisch bei länger anhaltender Überlast aus, etwa bei blockiertem Band oder schwergängigem Lager, und magnetisch bei Kurzschluss. Er trennt den Motor selbst. Die SPS sieht über den Hilfskontakt nur, dass er ausgelöst hat. Zurückgesetzt wird er am Gerät, nach dem Abkühlen und nach Klärung der Ursache. Dass das Programm die Richtung danach löscht und eine Meldung ausgibt, hat zwei Gründe: Das Band soll nach dem Einschalten des Schalters nicht unerwartet anlaufen, und der Instandhalter soll sofort sehen, warum es steht.</p>"},{"t":"Steuerstellen und Schlüsselschalter","h":"<p>Ist eine Maschine von mehreren Stellen aus bedienbar, muss eindeutig feststehen, welche gerade führt. Sonst startet jemand am Pult ein Band, an dem hinten gerade gereinigt wird. Der Schlüsselschalter −SA2 vergibt den Vorrang an −S10. Den Schlüssel hat nur, wer dazu befugt ist. Die Leuchte −PF6 zeigt allen, dass vor Ort gefahren wird. Der Not-Halt −SF8 an derselben Stelle wirkt immer, unabhängig vom Schlüssel, weil er über −KF2 geht.</p>"}]},"L16":{"beschr":"<p><b>Ausgangslage:</b> Jetzt dreht sich die Rolle um. Das Portal fährt automatisch (Übungsumfang <i>Stufe 0</i>), Ihr Programm steuert Band 1 und den Übergabeplatz. Körbe kommen in beliebigen Abständen über den Bandanfang (−BG12) auf Band 1. Vor dem Übergabeplatz staut der Vereinzeler −MM6 sie und gibt sie einzeln frei. Am Übergabeplatz hält der Anschlag −MM5 den Korb fest. −BG11 meldet „Korb kommt“ schon 55 mm vor dem Anschlag, −BG40 in der Anschlagleiste „Korb liegt an“. Das automatische Portal hängt ein, sobald ein Korb an −BG40 anliegt. Es hebt und senkt am Übergabeplatz aber nur bei offenem Anschlag (−BG15). Beide Teilsysteme arbeiten unabhängig voneinander und verständigen sich nur über Signale.</p><p><b>Soll-Verhalten:</b> Die Pflichtreihenfolge in der Liste ist verbindlich. Ihr Programm setzt sie als eigene Schrittkette für den Übergabeplatz um, im Aufbau wie in L12 (eigener FB, z. B. <code>TransferStation</code>, CASE mit ELSE oder Schritt-Bits). Es gilt:</p><ul><li>Weitergeschaltet wird auf Rückmeldungen: Korb an −BG40, Anschlag offen −BG15 bzw. zu −BG14, Vereinzeler zu −BG16 bzw. offen −BG17, Haken gelöst −BG2, Übergabeplatz frei −BG11. Nirgends wird eine Wartezeit geschätzt.</li><li>Solange der Haken im Korb ist, steht das Band (−QA1 aus).</li><li>Der Vereinzeler öffnet nur bei geschlossenem Anschlag.</li><li><b>Einlaufüberwachung:</b> Meldet −BG11 einen ankommenden Korb, muss −BG40 innerhalb von 3 s folgen. Sonst gibt es die Meldung „Korb klemmt“, das Band geht aus und die Kette hält bis zum Quittieren.</li></ul><p><b>Rand- und Fehlerfälle:</b> Was geschieht nach einem Not-Halt mitten im Ablauf, wenn −KF2 die Ventile spannungslos macht? −MB9 und −MB10 sind monostabil. Prüfen Sie, in welche Stellung Anschlag und Vereinzeler dann fallen, und ob Ihre Kette nach dem Quittieren damit zurechtkommt. Untersuchen Sie außerdem einen Korb, der zwischen −BG11 und −BG40 hängen bleibt, und ein leeres Band ohne Nachschub.</p><p>Leitfrage 2 verlangt ausdrücklich einen Versuch am Zwilling: Was geschieht mechanisch, wenn bei geschlossenem Anschlag angehoben wird? Beschreiben Sie es mit eigenen Worten. Der abgerissene Anschlag bleibt bis <i>Anlage zurücksetzen</i> ohne Funktion.</p><p><b>Vorgaben:</b> Band über −QA1 (Förderrichtung), Anschlag über −MB9 (1 = öffnen), Vereinzeler über −MB10 (1 = sperren). Jeder Ausgang hat genau eine Schreibstelle. Keine Merker.</p><p><b>Abgabe:</b> GRAFCET der Übergabeplatz-Kette, Programm, eine Signal-Zeit-Skizze des Ablaufs Korb einlaufen → Portal holt → Korb zurück → nächster Korb sowie das Prüfprotokoll. <b>Erfolg:</b> zehn Körbe ohne Eintrag in der Ereignisliste, richtige Reaktion auf −BG40 = 0, kein abgerissener Anschlag, kein schief abgesetzter Korb.</p>","wissen":[{"t":"Anschlag und Vereinzeler: zwei Stopper, zwei Aufgaben","h":"<p>Der <b>Anschlag</b> −MM5 legt die Position fest, an der das Portal den Korb greift. Der <b>Vereinzeler</b> −MM6 trennt den Stau dahinter, damit immer nur ein Korb auf den Übergabeplatz läuft. Ohne Vereinzeler drückt der nachfolgende Korb gegen den ersten, und das Portal hebt womöglich mit einem eingeklemmten Nachbarn an. Beide sind Schwenkhebel, die von der Seite über die Seitenführung greifen. Sie schwenken um 90° nach oben auf, weil die Stoßpuffer am Korbboden bei geschlossenem Hebel unter diesem liegen. Erst ein ganz geöffneter Anschlag gibt den Weg nach oben frei. Daraus folgt die Reihenfolge „erst −BG15, dann anheben“.</p>"},{"t":"Positionssensor statt Wartezeit","h":"<p>−BG11 meldet einen Korb schon 55 mm vor dem Anschlag. Wer nach −BG11 eine feste Zeit wartet und dann annimmt, der Korb liege an, verlässt sich auf eine konstante Bandgeschwindigkeit. Am Netz sind das rund 100 mm/s. Am Umrichter (spätere Übungen) ist die Geschwindigkeit aber frei einstellbar. Bei halber Drehzahl ist die Zeit zu kurz, das Portal greift ins Leere oder trifft die Korbkante. Auch Schlupf auf dem Gurt oder ein leicht verkanteter Korb verschieben die Zeit. −BG40 meldet dagegen direkt den Zustand, auf den es ankommt: Korb liegt an, unabhängig von Geschwindigkeit und Ursache einer Verzögerung.</p>"},{"t":"Einlaufüberwachung: woher die 3 s kommen","h":"<p>Die 55 mm zwischen −BG11 und Anschlag dauern bei 100 mm/s rund 0,55 s. Die vorgegebenen 3 s lassen also viel Reserve, etwa für langsamere Bandgeschwindigkeiten oder einen Korb, der kurz an der Seitenführung hängt. Bleibt −BG40 trotzdem aus, liegt sicher eine Störung vor: Der Korb klemmt, ist verkantet, oder der Sensor ist defekt. Ohne Überwachung liefe das Band weiter unter dem stehenden Korb. Der Gurt verschleißt, nachfolgende Körbe stauen sich auf, und niemand erfährt, warum nichts mehr ankommt. Dasselbe Prinzip, eine erwartete Rückmeldung in einer begründeten Zeit, wenden Sie in L17 auf alle Zylinder an.</p>"},{"t":"Monostabile Ventile und Federrückstellung","h":"<p>−MB9 und −MB10 sind 5/2-Wegeventile mit Federrückstellung. Ohne Signal geht das Ventil in seine Ruhestellung. Bei −MB9 schließt die Feder den Anschlag, bei −MB10 <b>öffnet</b> sie den Vereinzeler, denn −MB10 = 1 bedeutet „sperren“. Ein Ausgang = 0, etwa bei Not-Halt über −KF2, CPU im STOP oder einem vergessenen Befehl, ist also selbst ein Stellbefehl. Anders als beim bistabilen Ventil (L12) muss der Befehl über die ganze Dauer anstehen, in der die Stellung gebraucht wird. Überlegen Sie deshalb für jeden Zustand der Kette, was beim Wegfall aller Ausgänge passiert. Die Ruhestellung eines monostabilen Ventils ist eine bewusste Konstruktionsentscheidung, und das Programm muss sie berücksichtigen.</p>"},{"t":"Koordination über Signale (Handshake)","h":"<p>Portal und Band haben jeweils eine eigene Steuerung. Keine kennt den inneren Zustand der anderen, sie sehen nur Signale. Eine sichere Übergabe entsteht, wenn jede Seite auf die <b>Rückmeldung</b> der anderen wartet, nicht auf ihren eigenen Befehl. Das Band gibt den Anschlag erst frei, wenn der Korb anliegt. Das Portal hebt erst bei −BG15, das Band läuft erst nach −BG2 und freiem Übergabeplatz wieder.</p><p>Wichtig für die Fehlersuche: −BG14 und −BG15 tasten den Schwenkantrieb ab, nicht den Hebel. Ein abgerissener Hebel meldet deshalb weiterhin „zu“. Die Sensorik kann diesen Schaden nicht erkennen, also muss die Reihenfolge im Programm ihn verhindern.</p>"}]},"L17":{"beschr":"<p><b>Ausgangslage:</b> Ihre Schrittkette aus L12 schaltet zuverlässig auf Endlagen weiter. Bleibt eine Endlage aus, bleibt die Kette stehen, und genau das ist jetzt das Problem: Klemmt ein Zylinder, ist eine Drossel zugedreht oder ein Sensor defekt, steht die Anlage ohne jede Meldung. Der Bediener sieht nur, dass nichts passiert, und muss mit dem Programmiergerät suchen. Künftig soll jede Bewegung des Portals −MM1 bis −MM4 überwacht werden, und zwar mit Zeiten, die Sie an der Anlage gemessen und schriftlich begründet haben, nicht mit geschätzten.</p><p><b>Vorgehen und Soll-Verhalten:</b></p><ol><li><b>Messen:</b> Stellen Sie im Weg-Zeit-Diagramm („Groß öffnen“) alle Drosseln auf 50 % und lassen Sie mehrere Zyklen laufen. Messen Sie mit den Messlinien die Fahrzeit jedes Zylinders in beiden Richtungen, also 8 Werte. Verwenden Sie je Bewegung den größten Wert aus mehreren Messungen.</li><li><b>Auslegen:</b> Leiten Sie aus jeder Fahrzeit eine Überwachungszeit ab (Fahrzeit × Faktor, Vorschlag 1,5 bis 2). Begründen Sie den gewählten Faktor schriftlich je Bewegung, besonders bei sehr kurzen Bewegungen. Die Abschnitte im Fachwissen geben Ihnen die Argumente.</li><li><b>Programmieren:</b> Jeder Bewegungsschritt bekommt eine Laufzeitüberwachung. Läuft sie ab, bevor die Endlage kommt, hält die Kette im aktuellen Schritt an. Es erscheint eine Meldung mit Zylinder, Richtung und fehlender Endlage, z. B. „−MM2 senken: Endlage −BG4 nicht erreicht“.</li><li><b>Quittieren:</b> Die Meldung wird mit einer Flanke an −SF4 quittiert. Ist die Ursache behoben, läuft die Kette im <b>selben Schritt</b> weiter, ohne Neustart des Zyklus.</li><li><b>Warten ist keine Störung:</b> Schritte, die auf einen Bediener, einen Korb oder eine Prozesszeit warten (Initialschritt, Tauch- und Abtropfzeit), dürfen keine Laufzeitstörung auslösen.</li></ol><p><b>Testfälle:</b> Drehen Sie jede der 8 Drosseln einzeln auf 0 % (der Zylinder steht), dann gibt es genau eine richtige Meldung je Fall. Zusätzlich forcen Sie −BG7 auf 0. Der Zylinder fährt dann zwar, aber die Endlage kommt nicht. Prüfen Sie auch, dass bei der Drosseleinstellung 50 % in vielen Zyklen <b>keine</b> Fehlmeldung auftritt.</p><p><b>Vorgaben:</b> Zeiten als <code>TON</code>-Multiinstanz, Überwachungszeiten als Variablen vom Typ <code>Time</code> (nicht fest im Aufruf). Die Kette liefert weiterhin nur Befehle (L11). Wer im Zusatz zu L11 einen FB <code>Cylinder</code> gebaut hat, ergänzt die Überwachung dort einmal für alle Zylinder.</p><p><b>Abgabe:</b> ausgefüllte Fahrzeitentabelle mit Faktor und Begründung, Programm, Meldetexte und Prüfprotokoll. <b>Erfolg:</b> Tabelle vollständig, jede Drossel auf 0 % erzeugt die richtige Meldung, nach Beheben und Quittieren läuft die Kette im selben Schritt weiter, im Normalbetrieb gibt es keine Fehlalarme.</p>","wissen":[{"t":"Was eine Überwachungszeit leistet","h":"<p>Eine Laufzeitüberwachung beantwortet eine einfache Frage: „Ist die Bewegung, die ich befohlen habe, in der Zeit fertig geworden, in der sie normalerweise fertig wird?“ Wenn nicht, ist etwas kaputt, auch wenn die SPS nicht weiß, was. Mögliche Ursachen: Zylinder klemmt, Drossel zugedreht, Schlauch abgerissen, Ventil hängt, Druckluft fehlt, Sensor verstellt oder defekt. Die Meldung grenzt die Suche auf einen Zylinder und eine Richtung ein. Der Instandhalter weiß sofort, wo er hinschauen muss, statt die ganze Anlage abzusuchen. Ohne Überwachung kostet derselbe Fehler oft eine halbe Stunde Suche.</p>"},{"t":"Warum Überwachungszeit = Fahrzeit × Faktor","h":"<p>Die gemessene Fahrzeit ist kein fester Wert, sondern eine Momentaufnahme. Im Betrieb schwankt sie, und zwar aus Gründen, die alle <b>normal</b> sind und keine Störung bedeuten:</p><ul><li><b>Druck:</b> Der Netzdruck schwankt. Fahren zwei Zylinder gleichzeitig (Schritt 8: −MM3 und −MM4), sinkt der Druck kurz, und beide werden langsamer.</li><li><b>Last:</b> Ein voller Korb ist schwerer als ein leerer. Beim Anheben (−MM2) wirkt die Last gegen den Zylinder, beim Senken mit ihm, deshalb sind die beiden Richtungen nie gleich schnell.</li><li><b>Temperatur und Reibung:</b> Dichtungen und Führungen laufen kalt schwerer als warm. Nach längerem Stillstand muss der Kolben erst die Haftreibung überwinden (Losbrechen), daher ist der erste Zyklus am Montagmorgen oft der langsamste.</li><li><b>Verschleiß:</b> Mit der Zeit nehmen Reibung und Leckage zu, die Fahrzeit wächst schleichend.</li><li><b>Drosseleinstellung:</b> Eine kleine Drehung an der Drosselschraube ändert die Geschwindigkeit deutlich, und nach einer Wartung steht sie selten genau wie vorher.</li><li><b>Steuerung:</b> Ventilschaltzeit, Zykluszeit der CPU und im Zwilling die Kopplung über die Bridge kommen als kleine, aber feste Verzögerung dazu.</li></ul><p>Der Faktor deckt diese Streuung ab. Er trennt „langsam, aber in Ordnung“ von „da stimmt etwas nicht“. Ein Beispiel mit angenommenen Zahlen: Gemessen werden höchstens 1,2 s. Mit Faktor 1,5 ergeben sich 1,8 s, mit Faktor 2 sind es 2,4 s. Wählen Sie den Faktor eher bei 1,5, wenn die Bewegung gleichmäßig ist (konstante Last, wenig Einfluss von außen). Eher 2 passt, wenn Last oder Gleichzeitigkeit stark schwanken oder die Bewegung selten gefahren wird.</p>"},{"t":"Kurze Bewegungen: fester Zuschlag statt nur Faktor","h":"<p>Bei sehr kurzen Bewegungen versagt der reine Faktor. −MM1 hat z. B. nur 25 mm Hub. Liegt die Fahrzeit bei einigen Zehntelsekunden, sind die festen Verzögerungen (Ventil, Druckaufbau, Zykluszeit) im Verhältnis groß und schwanken stark. Faktor 2 auf 0,3 s ergibt 0,6 s, und das reißt schon bei einem einzigen langsamen Ventilschaltvorgang. Üblich ist deshalb eine Untergrenze oder ein fester Zuschlag:</p><pre class=\"code\"><code>// Prinzip, Werte nur als Beispiel\n#monitorTime := #travelTimeMax * 1.5 + T#500ms;</code></pre><p>Der Zuschlag fängt die feste Verzögerung ab, der Faktor die prozentuale Streuung. Bei langen Bewegungen fällt der Zuschlag kaum ins Gewicht, bei kurzen verhindert er Fehlalarme.</p>"},{"t":"Zu knapp oder zu großzügig: die Folgen","h":"<p><b>Zu knapp:</b> Die Anlage meldet Störungen, die keine sind. Jede Fehlmeldung bedeutet Stillstand, Quittieren und Suchen ohne Befund. Schlimmer noch ist die Folge für das Vertrauen: Bediener gewöhnen sich an, Meldungen ungeprüft wegzuquittieren. Oder jemand erhöht die Zeit „auf Verdacht“ bzw. schaltet die Überwachung ab, und dann geht auch die echte Störung unter.</p><p><b>Zu großzügig:</b> Die Störung wird erst spät erkannt. Bis dahin können Folgeschäden entstehen. Klemmt z. B. −MM2 beim Anheben, hängt der Korb weiter im heißen Zinn, und die Teile werden Ausschuss. Außerdem bleibt schleichender Verschleiß unsichtbar, bis der Zylinder ganz steht. Eine Überwachungszeit von 30 s für eine 1-s-Bewegung ist praktisch keine Überwachung.</p><p>Die richtige Zeit ist also so knapp wie möglich und so großzügig wie nötig. Deshalb wird sie gemessen und begründet statt geschätzt.</p>"},{"t":"Richtig messen","h":"<p>Das Weg-Zeit-Diagramm misst vom <b>Verlassen</b> der einen bis zum <b>Erreichen</b> der anderen Endlage. Ihre Überwachung beginnt aber meist schon mit dem Schrittwechsel, also mit dem Befehl. Die Zeit vom Schalten des Ventils bis zum Losfahren des Kolbens fehlt in der Messung. Das ist ein weiterer Grund für Faktor und Zuschlag. Sie können die SPS auch selbst messen lassen, etwa über den Ausgang <code>ET</code> (abgelaufene Zeit) eines <code>TON</code>:</p><pre class=\"code\"><code>#instTravel(IN := #cmdActive AND NOT #endPos, PT := T#30s);\nIF #instTravel.ET > #statTravelMax THEN\n  #statTravelMax := #instTravel.ET;\nEND_IF;</code></pre><p>Messen Sie immer mehrere Zyklen und nehmen Sie den <b>größten</b> Wert, nicht den Mittelwert. Der Mittelwert liegt in der Hälfte der Fälle zu niedrig. Der Regler „Geschwindigkeit aller Zylinder“ unter <i>Prozess</i> muss dabei auf seiner Grundeinstellung stehen. Ändert später jemand die Drosseln (z. B. zur Taktzeitoptimierung), müssen die Überwachungszeiten neu geprüft werden. Notieren Sie das in der Dokumentation.</p>"},{"t":"Warten oder Störung?","h":"<p>Ein Schritt <b>wartet</b>, wenn die Weiterschaltbedingung von außen kommt und ihr Eintreten offen ist: START im Initialschritt, ein Korb, der noch nicht da ist, eine laufende Tauchzeit. Das ist Normalbetrieb, eine Zeitüberwachung wäre hier falsch. Eine <b>Störung</b> liegt vor, wenn die Kette selbst eine Bewegung befohlen hat und deren Rückmeldung ausbleibt. Nur diese Fälle werden überwacht.</p><p>Bei einer Störung hält die Kette, sie springt nicht zurück. Ein bistabiles Ventil bleibt ohnehin in seiner Stellung, der Befehl kann anstehen bleiben. Nach dem Beheben kommt die Endlage, und nach dem Quittieren über eine −SF4-Flanke (wie START in L13) schaltet die Kette ganz normal weiter. Die Überwachungszeit muss dabei neu beginnen, sonst löst sie sofort wieder aus.</p>"}]},"L18":{"beschr":"<p><b>Ausgangslage:</b> In L16 haben Sie Band 1 mit Anschlag und Vereinzeler in Betrieb genommen; dort endete Ihre Verantwortung an −BG13 am Ende von Band 1. Jetzt steuert Ihr Programm die gesamte Förderstrecke bis zur Kippmulde: Band 1 (−QA1), Rollenkurve −MA6 (−QA10), Band 2 (−QA5) und die Muldenrollen −MA7 (−QA12). Stellen Sie den Zwilling auf <i>Portal = automatisch</i> und <i>Band = SPS steuert</i>. An jeder Stoßstelle liegt der Korb gleichzeitig auf zwei Förderern und bewegt sich nur, wenn beide in Förderrichtung laufen. Läuft nur einer, bleibt der Korb hängen – nach 4 s meldet die Ereignisliste das mit Ort.</p><p><b>Soll-Verhalten:</b></p><ul><li>Ein Förderer läuft nur, wenn er einen Korb abgeben darf oder übernehmen soll. Stillstand ist der Normalzustand, kein Fehler.</li><li><b>Band 1 → Kurve:</b> Steht ein Korb an −BG13 und ist der Kurvenanfang frei, laufen Band 1 und Kurve gemeinsam, bis die Kurve den Korb sicher übernommen hat. Die Lücke von 22 bis 35 mm zwischen −BG13 und −BG35, in der kurz keiner der beiden Sensoren belegt ist, darf die Übergabe nicht abbrechen.</li><li><b>Kurve → Band 2:</b> Ein Korb an −BG36 wartet, bis −BG21 frei ist und Band 2 läuft; erst dann fördert die Kurve weiter.</li><li><b>Band 2 → Mulde:</b> Ein Korb an −BG24 wird nur übergeben, wenn der Kipper unten ist (−BG30) und die Mulde leer ist (−BG37 und −BG33 frei). Band 2 und Muldenrollen laufen gemeinsam, die Muldenrollen danach allein bis −BG33. Ist die Mulde gekippt oder belegt, hält Band 2 den Korb an −BG24.</li><li><b>Störungen:</b> Löst ein Motorschutz aus (−FA1, −FA5, −FA7, −FA8 = 0), steht dieser Förderer, und der vorgelagerte gibt keinen Korb mehr an ihn ab. Ist ein Korb 4 s nach Beginn einer Übergabe nicht übernommen, hält die Übergabe an und meldet eine Störung mit Ort (z. B. „Übergabe Kurve → Band 2: Korb nicht übernommen“). Quittiert wird mit −SF4 als Flanke.</li></ul><p><b>Vorgaben:</b> Die Schützausgänge schreibt nur die Befehlsausgabe (L11). Jede Übergabe ist ein eigener Zustandsautomat mit den Zuständen <i>frei → übergeben → übernommen</i>, gespeichert in statischen Variablen. Empfohlen ist je Förderer ein eigener FB mit einer Schnittstelle der Art „Korb bereit zur Abgabe / bereit zur Übernahme / übernommen“, aufgerufen als Multiinstanz. Die Rückwärtsrichtungen (−QA2, −QA6, −QA11, −QA13) bleiben in AUTO aus.</p><p><b>Abzugeben:</b> je Übergabe ein Zustandsdiagramm mit Übergangsbedingungen, das Programm, ein kurzer Vergleich „gespeicherter Übergabe-Zustand gegen Nachlaufzeit 1 s“ (Was haben Sie beobachtet? Wann versagt welche Lösung?) und ein Testprotokoll zu den Prüfpunkten.</p><p><b>Erfolg:</b> Zehn Körbe laufen ohne Meldung „Korb hängt an der Übergabe“ bis in die Mulde. Bei gekippter Mulde bleibt der Korb an −BG24 stehen. Mit −FA7 auf 0 geforct steht die Kurve, und Band 1 schiebt keinen Korb nach. Nach Beheben und Quittieren läuft die Strecke ohne Neustart weiter.</p>","wissen":[{"t":"Stoßstelle und Handshake","h":"<p>Eine <b>Stoßstelle</b> ist der Bereich, in dem zwei Förderer aneinandergrenzen. Der Korb ist länger als die Lücke zwischen den Förderern, also liegt er für eine kurze Strecke auf beiden. Er wird nur durch Reibung mitgenommen: Läuft nur ein Förderer, schleift der Korb auf dem stehenden und bleibt hängen, oder er wird schräg gezogen und verkantet an der Seitenführung.</p><p>Deshalb müssen sich beide Förderer abstimmen. Diese gegenseitige Abstimmung nennt man <b>Handshake</b> (Quittungsbetrieb): Der abgebende meldet „Korb bereit“, der aufnehmende meldet „bereit zur Übernahme“ und später „übernommen“. Erst dann darf der abgebende anhalten. Dasselbe Prinzip finden Sie zwischen Maschinen verschiedener Hersteller, zwischen SPS und Roboter oder an Übergaben zwischen zwei Steuerungen – dort oft als genormte Signalpaare.</p>"},{"t":"Zustandsautomat statt Einzelverknüpfung","h":"<p>Eine Übergabe ist ein Vorgang mit Vorgeschichte: Ob Band 1 laufen muss, hängt nicht nur davon ab, was die Sensoren <i>jetzt</i> melden, sondern auch davon, was vorher war. Eine reine Verknüpfung der Sensoren vergisst diese Vorgeschichte. Ein <b>Zustandsautomat</b> speichert sie in einer Zustandsvariablen und wechselt nur bei klar definierten Ereignissen.</p><p>Jeder Zustand ist eindeutig benannt (Konstanten statt Zahlen), jeder Übergang hat genau eine Bedingung, und ein unerwarteter Zustand führt über ELSE in einen definierten Fehlerzustand. So bleibt die Logik auch nach einem Not-Halt mitten in der Übergabe nachvollziehbar.</p><pre class=\"code\"><code>CASE #statHandover OF\n    #STATE_FREE: ;     // weiter nach „übergeben“, wenn …?\n    #STATE_HANDING: ;  // weiter nach „übernommen“, wenn …?\n    ELSE #statHandover := #STATE_FAULT;\nEND_CASE;</code></pre>"},{"t":"Sensorlücke: gespeicherter Zustand oder Nachlaufzeit","h":"<p>Zwischen den Lichtstrahlen einer Übergabe liegen 22 bis 35 mm. Bei rund 100 mm/s ist der Korb also etwa 0,2 bis 0,35 s lang an keinem Sensor sichtbar. Würde Band 1 nur laufen, solange −BG13 oder −BG35 belegt ist, bliebe es genau in dieser Lücke stehen.</p><p>Zwei Lösungen sind üblich:</p><ul><li><b>Nachlaufzeit:</b> Der Förderer läuft nach dem Abfallen des Sensors noch eine feste Zeit weiter. Einfach, aber an Annahmen gebunden: Geschwindigkeit (100, 110, 120 mm/s je Förderer, am Umrichter in L27 sogar veränderlich), Schlupf und ein Stillstand mitten in der Lücke verändern die nötige Zeit.</li><li><b>Gespeicherter Übergabe-Zustand:</b> Eine statische Variable wird am abgebenden Sensor gesetzt und erst am aufnehmenden zurückgesetzt. Sie beschreibt den tatsächlichen Ort des Korbs, unabhängig von Zeit und Geschwindigkeit.</li></ul><p>Beachten Sie: Ein gespeicherter Zustand muss bei Störung, Handeingriff oder Entnahme eines Korbs bewusst zurückgesetzt werden können – sonst wartet die Anlage auf einen Korb, den es nicht mehr gibt.</p>"},{"t":"Überwachung der Übergabe","h":"<p>Eine Übergabe, die nicht fertig wird, ist ohne Überwachung ein stiller Stillstand: Alles steht, keine Meldung. Die Überwachungszeit legen Sie wie in L17 aus: Förderweg geteilt durch Geschwindigkeit ergibt die Soll-Dauer, dazu ein Zuschlag für Streuung. Die Vorgabe 4 s entspricht der Zeit, nach der auch der Zwilling selbst meldet.</p><p>Die Meldung nennt den <b>Ort</b> (welche Übergabe) und möglichst die <b>Ursache</b> (z. B. „aufnehmender Förderer läuft nicht“, „Motorschutz −FA7“). Erst das macht die Meldung für den Instandhalter brauchbar. Die Überwachung startet nur, wenn die Übergabe tatsächlich begonnen hat – ein
