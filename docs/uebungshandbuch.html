deln Sie erst am Ende.</p><pre class=\"code\"><code>#tempRatio := NORM_X(MIN := 0, VALUE := #rawValue, MAX := RAW_MAX);\n#tempOut := SCALE_X(MIN := 0, VALUE := #tempRatio, MAX := OUT_MAX);</code></pre><p>Ein unruhiger Analogwert lässt den Sollwert ständig springen. Abhilfe schaffen eine kleine Totzone, eine Glättung (gleitender Mittelwert, PT1) oder ein Raster, z. B. in 1-%-Schritten. Am Umrichter selbst glättet zusätzlich der Hochlaufgeber.</p>"},{"t":"Vor-Ort-Steuerstelle mit Schlüssel und Selbsthaltung","h":"<p>Eine Vor-Ort-Steuerstelle erlaubt das Bedienen eines Anlagenteils direkt an der Maschine, mit Sicht auf das Geschehen. Der <b>Schlüsselschalter</b> −SA7 legt fest, wer die Steuerungshoheit hat; der Schlüssel verhindert, dass zwei Stellen gleichzeitig befehlen. Die Leuchte −PF16 zeigt allen Umstehenden, dass das Prüfband gerade von Hand geführt wird.</p><p>Der AUS-Taster −SF46 ist ein <b>Öffner</b>: Bei Drahtbruch fällt das Signal auf 0, und das Band bleibt stehen, statt nicht mehr abschaltbar zu sein. Die Selbsthaltung muss <b>rücksetzdominant</b> sein, damit AUS immer gewinnt. EIN wird sinnvollerweise als Flanke ausgewertet, damit ein klemmender Taster nach einem AUS nicht sofort wieder einschaltet. Beides folgt dem Grundsatz aus DIN EN 60204-1, dass Stoppbefehle Vorrang vor Startbefehlen haben.</p>"},{"t":"Laufzeit aus Weg und Geschwindigkeit","h":"<p>Zwischen Kamera und Düse liegen 200 mm. Die Zeit, die ein Teil dafür braucht, ist t = s / v. Bei 150 mm/s sind das rund 1,3 s, bei 30 % schon über 4 s. Eine fest eingetragene Zeit passt deshalb nur zu genau einer Geschwindigkeit; bei langsamerem Band käme die Düse zu früh, das n.i.O.-Teil liefe in den KLT, und ein nachfolgendes Gutteil könnte getroffen werden.</p><p><b>Soll- und Istwert</b> sind nicht dasselbe: NSOLL_A ist, was Sie anfordern, NIST_A, was der Antrieb tatsächlich fährt. Dazwischen liegen Hochlaufgeber, Last und Begrenzungen. Überlegen Sie, in welchen Situationen sich die beiden unterscheiden und welcher Wert das Teil wirklich bewegt.</p><p>Bedenken Sie auch: Je langsamer das Band, desto länger braucht ein Teil, um an der Düse vorbeizulaufen. Ob die Blasdauer daran angepasst werden muss, sollten Sie im Versuch prüfen.</p>"},{"t":"Grenzen der zeitbasierten Teileverfolgung","h":"<p>Eine Laufzeit, die beim Kamerasignal einmal berechnet wird, stimmt nur, wenn die Geschwindigkeit bis zur Düse gleich bleibt. Dreht der Werker am Poti, während Teile unterwegs sind, oder steht das Band kurz, sind die gespeicherten Ausblaszeitpunkte falsch. In der Industrie verfolgt man Teile deshalb oft über den <b>Weg</b> statt über die Zeit: Man summiert in jedem Zyklus den zurückgelegten Weg (Geschwindigkeit × Zykluszeit oder Geberimpulse) und bläst, wenn ein Teil 200 mm zurückgelegt hat. Ob Sie diesen Aufwand treiben oder eine einfachere Lösung mit klarer Einschränkung wählen, ist eine Entwurfsentscheidung – begründen Sie sie.</p><p>Und eine Selbstverständlichkeit, die trotzdem oft fehlt: Vor jeder Division durch eine Geschwindigkeit prüfen, ob sie größer als null ist. Eine Division durch null liefert in REAL kein sinnvolles Ergebnis, und das Programm rechnet mit diesem Wert unbemerkt weiter.</p>"}]},"L30":{"beschr":"<p><b>Ausgangslage:</b> Die Förderer laufen an den Umrichtern −TA2, −TA3 und −TA4, entweder über <code>TO_SpeedAxis</code> (L27) oder über Ihren eigenen Telegramm-Baustein (L28). Solange alles läuft, ist das unauffällig. Im Betrieb treten aber Störungen auf: Ein Bandmotor ist überlastet, ein anderer überhitzt, jemand drückt den Not-Halt, oder ein Instandhalter schaltet am Bedienpanel auf HAND. Bisher steht das Band dann einfach – ohne Hinweis, warum. Ihr Programm soll diese Fälle erkennen, unterscheiden, im Klartext melden und einen sicheren, bewussten Weg zurück in den Betrieb bieten.</p><p><b>Die vier Fälle:</b></p><ol><li><b>Überlast</b> (F30005, im Fenster des Umrichters auslösen): Störbit ZSW1.3, sofort quittierbar.</li><li><b>Motor überhitzt</b> (F07011): Störbit ZSW1.3, quittierbar erst nach dem Abkühlen.</li><li><b>Not-Halt</b>: −KF2 wählt STO an, der Umrichter geht in die Einschaltsperre (ZSW1.6).</li><li><b>HAND am Bedienpanel</b>: Die Führung durch die SPS fällt weg (ZSW1.9 = 0), Ihr Telegramm ist wirkungslos.</li></ol><p><b>Soll-Verhalten:</b> Jeder Fall erzeugt eine eigene Meldung mit Ort (welcher Umrichter, welcher Förderer), Ursache und Abhilfe, z. B. „Band 1 (−TA2): Motor überhitzt – abkühlen lassen, dann quittieren“. Die betroffene Förderstrecke wird gesperrt, und vorgelagerte Förderer dürfen keine Körbe mehr auf ein stehendes Band schieben. Quittiert wird bewusst mit −SF4 bzw. dem Quittiertaster der zugehörigen Vor-Ort-Steuerstelle; Ihr Programm setzt daraus <code>MC_Reset</code> bzw. eine Flanke an STW1.7 ab. Ein Quittierversuch bei noch anstehender Ursache (F07011 vor dem Abkühlen) darf nichts kaputt machen, soll aber erkennbar erfolglos bleiben – die Meldung bleibt stehen. Nach erfolgreichem Quittieren läuft <b>nichts</b> von selbst an: Erst ein neuer START-Befehl setzt den Antrieb wieder in Bewegung.</p><p><b>Vorgaben:</b> Die Auswertung gehört in den Antriebsbaustein bzw. einen eigenen Diagnosebaustein je Antrieb (Multiinstanz), nicht verstreut in die Schrittkette. Statusbits über Slices des Zustandsworts bzw. aus dem Technologieobjekt-DB lesen. Der Not-Halt wird hart über −KF2 abgeschaltet; Ihr Programm meldet und diagnostiziert nur.</p><p><b>Abgabe:</b> Programm, Meldetexttabelle (Fall, Erkennungsmerkmal, Meldetext, Quittierbarkeit, Reaktion der Anlage) und ein Testprotokoll mit allen vier Fällen an mindestens einem Umrichter.</p><p><b>Erfolg:</b> Alle vier Fälle werden unterschiedlich gemeldet, F07011 lässt sich erst nach dem Abkühlen quittieren, und nach keinem Quittieren läuft ein Band ohne neuen Startbefehl an.</p>","wissen":[{"t":"Störung und Warnung","h":"<p>Antriebe unterscheiden zwei Meldeklassen. Eine <b>Störung</b> (bei SINAMICS mit F… gekennzeichnet) führt zu einer festgelegten Reaktion, meist zum Abschalten, und bleibt gespeichert, bis sie quittiert wird; sie wird in ZSW1.3 angezeigt. Eine <b>Warnung</b> (A…, ZSW1.7) kündigt ein Problem an, ohne den Betrieb zu unterbrechen, und verschwindet von selbst, wenn die Ursache weg ist. Reale Umrichter warnen häufig vor einer Störung, z. B. bei steigender Motortemperatur – eine gute Gelegenheit, den Prozess geordnet zu beenden, bevor der Antrieb abschaltet.</p><p>Für Ihr Meldekonzept heißt das: Störungen erfordern Quittieren und sperren den Anlagenteil, Warnungen informieren nur. Wer beides gleich behandelt, erzeugt entweder unnötige Stillstände oder übersieht ernste Fehler.</p>"},{"t":"Überlast F30005 und Motorübertemperatur F07011","h":"<p>Beim realen G120 meldet <b>F30005</b> eine I²t-Überlast des Leistungsteils: Der Umrichter rechnet aus dem Stromverlauf, wie stark sich seine Halbleiter erwärmen, und schaltet ab, bevor sie Schaden nehmen. Typische Ursachen sind ein schwergängiges Band, ein verklemmter Korb oder zu steile Rampen. Nach dem Abschalten ist der Strom null, die Störung lässt sich sofort quittieren – die Ursache muss man trotzdem suchen.</p><p><b>F07011</b> meldet eine Übertemperatur des Motors, gemessen über einen Fühler in der Wicklung oder berechnet über ein thermisches Motormodell. Die Wicklungsisolierung altert bei Übertemperatur stark; ein sofortiger Wiederanlauf würde den heißen Motor weiter belasten. Deshalb ist die Störung erst quittierbar, wenn die Temperatur wieder unter die Schwelle gefallen ist. Ihr Programm sollte das dem Bediener erklären, statt ihn wiederholt vergeblich quittieren zu lassen.</p>"},{"t":"Quittieren: Flanke statt Dauersignal","h":"<p>Quittiert wird beim Telegramm mit einer <b>positiven Flanke</b> an STW1.7, beim Technologieobjekt mit einer Flanke an <code>Execute</code> von <code>MC_Reset</code>. Ein dauerhaft gesetztes Quittierbit wäre gefährlich: Jede neue Störung würde sofort wieder quittiert und damit verdeckt, der Antrieb liefe in eine Schleife aus Abschalten und Wiedereinschalten. Deshalb gilt für Quittieren dieselbe Regel wie für START – nur die Flanke zählt.</p><pre class=\"code\"><code>#instAckTrig(CLK := #ackButton);\n#statAckPulse := #instAckTrig.Q;</code></pre><p>Quittieren bedeutet: Der Mensch bestätigt, dass er die Ursache kennt und beseitigt hat. Es ist kein Startbefehl.</p>"},{"t":"STO und Einschaltsperre nach Not-Halt","h":"<p><b>STO</b> (Safe Torque Off, DIN EN 61800-5-2) sperrt die Impulse im Umrichter sicher, der Motor erzeugt kein Drehmoment mehr und trudelt aus. Das entspricht der Stoppkategorie 0 nach DIN EN 60204-1. An der Anlage wählt das Sicherheitsrelais −KF2 STO hart an; das SPS-Programm ist daran nicht beteiligt und darf es auch nicht sein, weil eine Standard-SPS die Anforderungen der DIN EN ISO 13849-1 an eine Sicherheitsfunktion nicht erfüllt.</p><p>Nach STO geht der Antrieb in die Einschaltsperre (ZSW1.6). Auch wenn −KF2 wieder freigibt, läuft er erst nach dem in L28 beschriebenen Weg durch die Zustandsmaschine an. Für die Meldung ist wichtig, die Einschaltsperre durch Not-Halt (−KF2 meldet 0) von einer Einschaltsperre aus anderem Grund zu unterscheiden – sonst sucht der Instandhalter an der falschen Stelle.</p>"},{"t":"Führung: wer befiehlt dem Antrieb?","h":"<p>Ein Umrichter kann von der SPS über PROFINET oder lokal am Bedienpanel geführt werden. Bei Inbetriebnahme und Instandhaltung schaltet man am Panel auf HAND, um den Motor unabhängig vom Programm zu drehen. Dann ignoriert der Umrichter das Telegramm, und ZSW1.9 („Führung angefordert“) fällt ab.</p><p>Erkennt das Programm das nicht, glaubt es, das Band fahre nach seinem Sollwert – Überwachungen schlagen an, Körbe stauen sich, und die Fehlersuche beginnt am falschen Ende. Eine eigene Meldung „Antrieb in Vor-Ort-Führung“ verhindert das und zeigt zugleich, dass jemand an der Maschine arbeitet.</p>"},{"t":"Kein automatischer Wiederanlauf","h":"<p>DIN EN 60204-1 verlangt, dass eine Maschine nach dem Beseitigen einer Störung, nach Not-Halt oder Spannungswiederkehr nicht selbsttätig anläuft, wenn daraus eine Gefährdung entstehen kann. Wer gerade einen verklemmten Korb vom Band gezogen und dann quittiert hat, muss sich darauf verlassen können, dass sich nichts bewegt.</p><p>Die Falle beim Technologieobjekt: Bleibt <code>MC_Power.Enable</code> gesetzt und wird <code>MC_MoveVelocity.Execute</code> zyklisch oder dauerhaft angesteuert, fährt die Achse nach <code>MC_Reset</code> sofort wieder los. Beim Telegramm entsteht derselbe Fehler, wenn das Programm nach dem Quittieren selbsttätig das Steuerwort für Betrieb schreibt. Koppeln Sie den Wiederanlauf deshalb an einen neuen, bewusst gegebenen Startbefehl und prüfen Sie genau diesen Fall im Test.</p>"}]},"L31":{"beschr":"<p>Die Übung hat zwei Teile, die beide eine Fähigkeit trainieren, die im Betrieb mehr zählt als schnelles Programmieren: Aussagen mit Beobachtungen und Messungen zu belegen, statt zu raten.</p><p><b>Teil A – Fehlersuche:</b> Ihr Programm aus den bisherigen Übungen läuft, mindestens mit Schrittkette (L12), Betriebsarten (L10) und Überwachungszeiten (L17). Die Lehrkraft löst verdeckt nacheinander Störungen aus, ohne zu sagen, welche: z. B. Motorschutz −FA1 von Band 1, eine Person im Lichtvorhang −BG20, Heizung aus (das Zinnbad kühlt ab, −BG9 fällt unter 250 °C ab), eine zugedrehte Drossel oder einen geforcten Sensor. Sie finden die Ursache. Gehen Sie dabei für jeden Fall streng nach dem Schema vor: <b>Symptom</b> beobachten und beschreiben (Was steht, was meldet die Anlage, seit wann?), <b>Vermutung</b> aufstellen, einen gezielten <b>Prüfschritt</b> wählen, der die Vermutung bestätigt oder widerlegt, erst dann <b>Ursache</b> und <b>Behebung</b> festhalten. Notieren Sie die benötigte Zeit. Eine widerlegte Vermutung ist kein Fehler, sondern gehört ins Protokoll.</p><p>Achten Sie besonders darauf, ob Ihr Programm die Störung selbst sauber meldet. Wo Sie lange suchen mussten, fehlt vermutlich eine Meldung – notieren Sie das als Verbesserungsvorschlag für Ihr Programm.</p><p><b>Teil B – Taktzeit:</b> Der Betreiber will mehr Körbe pro Stunde. Ermitteln Sie zuerst die aktuelle Taktzeit mit den Messlinien im Weg-Zeit-Diagramm, wie im Auftrag angegeben, über mehrere Zyklen. Verändern Sie dann die Drosseln so, dass die Taktzeit sinkt, ohne dass ein Zylinder hart in die Endlage schlägt oder sich Bewegungen überschneiden. Die Rezeptzeiten für Tauchen und Abtropfen sind Prozessvorgaben und bleiben unverändert. Prüfen Sie zusätzlich, welche Schritte der Schrittkette sich parallel ausführen ließen, und begründen Sie für jeden Kandidaten, warum er möglich oder unzulässig ist.</p><p><b>Abgabe:</b> das Fehlerprotokoll mit fünf vollständig ausgefüllten Störfällen; eine Messtabelle Taktzeit vorher/nachher mit allen Einzelmessungen, den geänderten Drosselwerten und der Einsparung in %; eine kurze Bewertung der Parallelisierungskandidaten; bei Programmänderungen die neu gemessenen Fahrzeiten und angepassten Überwachungszeiten.</p><p><b>Erfolg:</b> Jede Ursache ist mit einem Prüfschritt belegt, nicht nur vermutet. Die Taktzeiteinsparung ist mit Messungen nachgewiesen, die Mechanik wird nicht stärker belastet, und die Ereignisliste bleibt nach der Optimierung frei.</p>","wissen":[{"t":"Systematische Fehlersuche","h":"<p>Erfahrene Instandhalter finden Fehler nicht durch Glück, sondern durch Methode. Das Schema <b>Symptom → Hypothese → Test → Ursache</b> zwingt dazu, erst zu beobachten und dann gezielt zu prüfen, statt auf Verdacht Teile zu tauschen oder Programmcode zu ändern. Jeder Test sollte so gewählt sein, dass er möglichst viele mögliche Ursachen auf einmal ausschließt.</p><p>Bewährt ist das <b>Halbierungsprinzip</b> entlang der Signalkette Sensor → Eingang → Programm → Ausgang → Aktor: Prüfen Sie in der Mitte (z. B. „Kommt das Signal am SPS-Eingang an?“). Je nach Ergebnis liegt der Fehler vorher oder nachher, und Sie haben die Hälfte der Möglichkeiten ausgeschlossen. Wer dagegen beim ersten Verdacht hängen bleibt, sucht im schlimmsten Fall lange an der falschen Stelle.</p>"},{"t":"Werkzeuge und was sie zeigen","h":"<ul><li><b>Signalmonitor des Zwillings:</b> zeigt den Zustand jedes Signals auf der Anlagenseite – gut für die Frage, ob ein Sensor überhaupt schaltet oder ob ein Signal festgehalten wird.</li><li><b>Beobachtungstabelle / Programmstatus in TIA Portal:</b> zeigt, was die SPS sieht und was das Programm daraus macht – etwa welche Bedingung einen Schrittwechsel blockiert.</li><li><b>Weg-Zeit-Diagramm:</b> zeigt Bewegungen über der Zeit – gut für zeitliche Fehler wie zu langsame, stehende oder sich überschneidende Bewegungen.</li><li><b>Ereignisliste und Diagnosepuffer:</b> zeigen, was wann gemeldet wurde.</li></ul><p>Ein Vergleich der Ebenen grenzt besonders schnell ein: Passt der mechanische Zustand im 3D-Modell nicht zum Signal, liegt der Fehler am Sensor oder Signal; passt das Signal, aber das Programm reagiert nicht, liegt er in der Logik.</p>"},{"t":"Das Fehlerprotokoll","h":"<p>Ein Fehlerprotokoll ist mehr als Papierkram. Es macht die eigene Vorgehensweise sichtbar und überprüfbar, es dokumentiert wiederkehrende Fehler, und es ist die Grundlage für Kennzahlen wie die mittlere Instandsetzungszeit (MTTR). In vielen Betrieben ist es Teil des Instandhaltungs- oder Qualitätsmanagements.</p><p>Wichtig ist die Trennung zwischen <b>Symptom</b> (was beobachtet wurde) und <b>Ursache</b> (was nachweislich dahintersteckt). „Band steht“ ist ein Symptom, „Motorschutz −FA1 ausgelöst“ ist eine Ursache – aber erst, nachdem ein Prüfschritt sie belegt hat. Auch die widerlegten Vermutungen gehören hinein: Sie zeigen, welche Meldung gefehlt hat oder irreführend war.</p>"},{"t":"Taktzeit messen","h":"<p>Die <b>Taktzeit</b> ist die Zeit zwischen zwei gleichartigen Ereignissen aufeinanderfolgender Zyklen, z. B. von einem Schrittwechsel bis zum selben Schrittwechsel im nächsten Zyklus. Aus ihr folgt die Ausbringung: Körbe pro Stunde = 3600 s / Taktzeit. Weil einzelne Zyklen streuen, messen Sie mehrere Zyklen und geben Mittelwert und Spannweite an. Die Einsparung in Prozent bezieht sich auf den Ausgangswert.</p><p>Bevor Sie optimieren, zerlegen Sie den Zyklus in seine Anteile: Bewegungszeiten, Wartezeiten auf Bedingungen und feste Prozesszeiten. Tauch- und Abtropfzeit sind Rezeptvorgaben; werden sie unterschritten, misst der Zwilling den Korb als mangelhaft. Ein Gewinn ist also nur bei den Bewegungen und Wartezeiten möglich – rechnen Sie aus, wie groß deren Anteil überhaupt ist, bevor Sie Aufwand treiben.</p>"},{"t":"Drosseln, Endlagen und Überwachungszeiten","h":"<p>Die Drosselrückschlagventile an den Zylindern drosseln die <b>Abluft</b>. Der Kolben ist so zwischen zwei Luftpolstern eingespannt und bewegt sich gleichmäßig, auch bei wechselnder Last. Öffnet man die Drossel weiter, wird der Zylinder schneller – aber er trifft auch mit mehr Geschwindigkeit in die Endlage. Hartes Anschlagen bedeutet Stöße auf Mechanik, Last und Sensoren, Verschleiß an Dichtungen und Endlagendämpfung, im Ernstfall ein pendelnder oder abrutschender Korb. Vergleichen Sie Ihre Einstellung deshalb mit dem Richtwert im Drosselfenster und begründen Sie jede deutliche Abweichung, statt einfach alle Drosseln aufzudrehen.</p><p>Jede Drosseländerung verändert auch die Fahrzeiten, auf denen Ihre Überwachungszeiten aus L17 beruhen. Messen Sie nach der Optimierung neu und prüfen Sie, ob die Überwachungszeiten noch zu den Fahrzeiten passen.</p>"},{"t":"Parallelisieren von Schritten","h":"<p>In GRAFCET nach DIN EN 60848 werden gleichzeitig laufende Abläufe als <b>Simultanverzweigung</b> dargestellt: Nach einer gemeinsamen Transition starten mehrere Teilabläufe, die sich an einer Synchronisation wieder treffen. Zwei Bewegungen dürfen nur dann parallel laufen, wenn keine von ihnen das Ergebnis der anderen braucht, sie sich räumlich nicht in die Quere kommen können und die Prozessreihenfolge erhalten bleibt.</p><p>Gerade das Kollisionsargument ist entscheidend: Was im Normalfall zeitlich gut ausgeht, kann bei einer langsameren Bewegung oder nach einer Störung zusammenstoßen. Parallele Schritte müssen deshalb über Endlagen abgesichert sein (vgl. Verriegelungen in L09), nicht über Zeiten. Prüfen Sie für jeden Kandidaten, was passiert, wenn eine der beiden Bewegungen stehen bleibt.</p>"}]},"L32":{"beschr":"<p><b>Ausgangslage:</b> Der Übungsumfang steht auf <i>Stufe 3</i>: Das Modell fährt nichts mehr selbst. Portal, Förderstrecke, Abschrecken, Entleeren, Prüfen, Zinnbad und Kühlwasser hängen vollständig an Ihrem Programm. Ein Kunde hat die Anlage schlüsselfertig bestellt; das Lastenheft (Auszug oben) beschreibt, was er erwartet. Ihr Team liefert die komplette Steuerungssoftware und nimmt sie gemeinsam mit dem Kunden – vertreten durch die Lehrkraft – ab. Sie dürfen und sollen auf Ihre Lösungen aus allen bisherigen Übungen zurückgreifen, müssen sie aber zu einem einheitlichen, sauber strukturierten Ganzen zusammenführen.</p><p><b>Ablauf:</b></p><ol><li><b>Planen:</b> Aus dem Lastenheft entsteht Ihr Pflichtenheft: Technologieschema, GRAFCETs je Anlagenteil, E/A-Zuordnung, Meldekonzept, Programmstruktur (Bausteinübersicht mit Schnittstellen), begründete Wahl der Reglerart für Zinnbad und Kühlwasser. Das Pflichtenheft wird vor Programmierbeginn mit der Lehrkraft abgestimmt.</li><li><b>Rollen:</b> Projektleitung; Portal und Betriebsarten; Förderstrecke und Prüfstation; Regelung und Antriebe. Nach der Hälfte der Zeit wechseln die Rollen – planen Sie Übergabe und Dokumentation so, dass ein anderes Teammitglied weiterarbeiten kann.</li><li><b>Programmieren und in Betrieb nehmen:</b> Abschnitt für Abschnitt, nicht alles auf einmal. Jeder Abschnitt wird erst getestet und protokolliert, bevor der nächste hinzukommt.</li><li><b>Abnehmen:</b> Alle Prüfpunkte werden vor der Lehrkraft vorgeführt. Dazu baut die Lehrkraft drei Fehler verdeckt ein, die Sie mit Ihrer Diagnose finden müssen.</li><li><b>Präsentieren:</b> 15 Minuten Präsentation, 15 Minuten Fachgespräch.</li></ol><p><b>Randfälle, die bei der Abnahme geprüft werden:</b> Not-Halt an jeder der fünf Stellen mit richtigem Erstwert und Quittierort, Eingriff in den Lichtvorhang mit eigener Meldung, Grundstellungsfahrt aus beliebiger Lage, Umrichterstörung, Kühlwassertank mit offenem Ablasshahn, Zinnbadtemperatur über zehn Zyklen.</p><p><b>Vorgaben:</b> OB1 ruft je Anlagenteil einen FB mit Instanz-DB auf, die Betriebsarten werden zentral verwaltet, globale Daten liegen nur in einem Schnittstellen-DB. Der gesamte Code folgt dem Siemens-Programmierstyleguide und besteht den Stil-Check. Not-Halt und Lichtvorhang schaltet −KF2 hart ab; Ihr Programm meldet und diagnostiziert.</p><p><b>Abgabe:</b> Projektarchiv, Pflichtenheft, Inbetriebnahmeprotokoll mit allen Prüffällen der Stufen 1 bis 4, Präsentation.</p><p><b>Erfolg:</b> Alle Prüfpunkte sind erfüllt und belegt, die Dokumentation erlaubt einem Fremden, die Anlage zu verstehen, und im Fachgespräch können Sie jede wesentliche Entscheidung begründen – auch die, die Sie heute anders treffen würden.</p>","wissen":[{"t":"Lastenheft und Pflichtenheft","h":"<p>Das <b>Lastenheft</b> beschreibt, <i>was</i> der Auftraggeber will: Anforderungen aus seiner Sicht, ohne Lösungsweg. Das <b>Pflichtenheft</b> beschreibt, <i>wie</i> der Auftragnehmer diese Anforderungen umsetzen wird (Begriffe nach DIN 69901-5, Inhalte z. B. nach VDI/VDE 3694). Erst wenn der Kunde das Pflichtenheft bestätigt hat, ist klar, was am Ende abgenommen wird.</p><p>Der Zweck ist praktisch: Missverständnisse werden auf dem Papier entdeckt, wo sie wenig kosten, statt bei der Inbetriebnahme, wo sie teuer werden. Unklare Punkte im Lastenheft – etwa „mindestens ein Förderer am Umrichter“ – müssen im Pflichtenheft eindeutig entschieden werden: welcher, warum, mit welcher Ansteuerung.</p>"},{"t":"Technologieschema, GRAFCET und E/A-Zuordnung","h":"<p>Diese drei Dokumente sind die Grundlage, auf der alle im Team dieselbe Anlage im Kopf haben.</p><ul><li>Das <b>Technologieschema</b> zeigt Anlagenteile, Antriebe, Sensoren und Stoffflüsse mit ihren Betriebsmittelkennzeichen nach DIN EN 81346-2.</li><li>Die <b>GRAFCETs</b> nach DIN EN 60848 beschreiben das Verhalten jedes Anlagenteils herstellerunabhängig: Schritte, Aktionen, Transitionen, Verzweigungen. Sie sind Entwurf und Prüfgrundlage zugleich – getestet wird gegen den GRAFCET, nicht gegen das Gedächtnis.</li><li>Die <b>E/A-Zuordnung</b> listet jedes Signal mit Adresse, symbolischem Namen, Bedeutung und Logik (Schließer/Öffner, 1 = …). Sie verhindert, dass zwei Teammitglieder dasselbe Signal unterschiedlich deuten.</li></ul>"},{"t":"Programmstruktur und Schnittstellen-DB","h":"<p>Eine klare Struktur entscheidet darüber, ob ein Projekt mit vier Programmierern beherrschbar bleibt. Jeder Anlagenteil wird ein FB mit eigener Instanz; er arbeitet nur mit seinen Ein- und Ausgangsparametern und kennt die anderen Bausteine nicht. Der Austausch zwischen den Anlagenteilen läuft über <b>einen</b> Schnittstellen-DB mit klar benannten Variablen (z. B. Übergabesignale, Betriebsart, Sammelstörung).</p><p>Warum so streng? Greift ein Baustein direkt auf die Instanz eines anderen zu, hängen beide unsichtbar voneinander ab; eine Änderung an einer Stelle bricht dann etwas an einer ganz anderen. Zentrale Betriebsarten verhindern, dass jeder Anlagenteil seine eigene, leicht abweichende Vorstellung von HAND und AUTO hat. Und eine einheitliche Schreibweise nach Styleguide macht fremden Code lesbar – spätestens beim Rollenwechsel merken Sie, wie wichtig das ist.</p>"},{"t":"Not-Halt-Erstwert und Quittierort","h":"<p>Die Anlage hat fünf Not-Halt-Taster (−SF0, −SF8, −SF9, −SF10, −SF33), alle im Sicherheitskreis von −KF2 und je mit einem Meldekontakt auf einen SPS-Eingang. Wird ein Not-Halt ausgelöst, fallen danach oft weitere Signale ab, oder ein zweiter Taster wird gedrückt. Der <b>Erstwert</b> ist das Signal, das die Abschaltung zuerst ausgelöst hat. Ihn zu speichern, spart bei der Fehlersuche viel Zeit, weil die Folgemeldungen sonst die Ursache verdecken.</p><p>Der <b>Quittierort</b> ist die Stelle, an der quittiert wurde. Die Quittiertaster −SF4 und −SF41 bis −SF44 liegen parallel am Reset von −KF2, haben aber je einen eigenen Eingang. So kann das Programm erkennen, ob vor Ort an der Gefahrenstelle quittiert wurde, und das im Protokoll festhalten. Nach DIN EN ISO 13850 darf das Entriegeln eines Not-Halts allein keinen Wiederanlauf auslösen; dafür ist ein eigener, bewusster Startbefehl nötig.</p>"},{"t":"Abschnittsweise Inbetriebnahme und Abnahme","h":"<p>Wer alles auf einmal in Betrieb nimmt, sieht bei einem Fehler nicht, woher er kommt. Bewährt ist die Reihenfolge: E/A-Test (jedes Signal einmal geprüft), dann Handbetrieb jedes Aktors, dann Verriegelungen, dann die Abläufe der einzelnen Anlagenteile, zuletzt das Zusammenspiel. Jede Stufe wird mit Datum, Prüfer und Ergebnis im <b>Inbetriebnahmeprotokoll</b> festgehalten.</p><p>Bei der <b>Abnahme</b> bestätigt der Kunde, dass die Anlage die vereinbarten Anforderungen erfüllt. In der Industrie unterscheidet man oft die Werksabnahme beim Hersteller (FAT) und die Abnahme vor Ort (SAT). Mit dem Zwilling üben Sie im Grunde eine FAT: Alles wird simuliert vorgeführt, bevor die echte Anlage steht. Mit der Abnahme gehen Verantwortung und Gewährleistungsfristen über – deshalb wird nur abgenommen, was belegt ist.</p>"},{"t":"Präsentation und Fachgespräch","h":"<p>In der Präsentation zeigen Sie nicht jede Codezeile, sondern die Entscheidungen: Warum diese Programmstruktur, warum diese Reglerart, wie das Meldekonzept aufgebaut ist, welche Probleme bei der Inbetriebnahme auftraten und wie Sie sie gelöst haben. Ein kurzer Live-Ausschnitt am Zwilling wirkt überzeugender als viele Folien.</p><p>Im Fachgespräch prüft die Lehrkraft, ob jedes Teammitglied die Gesamtlösung versteht – auch die Teile, die andere programmiert haben. Der Rollenwechsel bereitet genau darauf vor. Eine ehrliche Antwort auf die Leitfrage, was Sie beim nächsten Projekt anders machen würden, zeigt mehr Fachkompetenz als eine makellos wirkende Darstellung.</p>"}]}};

  function trendBlatt() {

      for (let i = 1; i <= 8; i++) r += `<path d="M80 ${y0 + h - i * h / 8}H965" stroke="${G2}" stroke-width=".5"/>`;
      for (let i = 1; i <= 16; i++) r += `<path d="M${80 + i * 885 / 16} ${y0}V${y0 + h}" stroke="${G2}" stroke-width=".5"/>`;
      return r + TX(70, y0 + 10, 11, lbl, "end", "#555", 600) + TX(70, y0 + 26, 9, unit, "end");

    s += ax(40, 380, "x, w", "Einheit:") + TX(965, 440, 11, "t in s", "end", "#555", 600);

  // web/tools/uebungshandbuch/src/app/tooltip.js
  var tip = $("#tip");
  function showTip(el) {
    const t = el.dataset.tag, list = SIG[t], ex = EXTRA[t];
    if (!list && !ex) return;
    tip.innerHTML = (ex ? `<div><span class="tn">−${t}</span> ${ex}</div>` : "") + (list || []).map((s) => `<div><span class="tn">${s.n}</span> <span class="ta">${s.a}</span><br>${esc(s.k)}</div>`).join("");
    tip.classList.add("on");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left), innerWidth - w - 8), y = r.bottom + 8;
    if (y + h > innerHeight - 8) y = r.top - h - 8;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  var hideTip = () => tip.classList.remove("on");
  function init() {
    document.addEventListener("mouseover", (e) => {
      const el = e.target.closest(".sig");
      if (el) showTip(el);
    });
    document.addEventListener("mouseout", (e) => {
      if (e.target.closest(".sig")) hideTip();
    });
    document.addEventListener("focusin", (e) => {
      const el = e.target.closest(".sig");
      if (el) showTip(el);
    });
    document.addEventListener("focusout", hideTip);
    addEventListener("scroll", hideTip, { passive: true });
  }
