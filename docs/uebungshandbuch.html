<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übungshandbuch SPS-Technik</title>
<style>
@font-face{font-family:"Plex Sans";src:url("../web/src/lib/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Plex Sans";src:url("../web/src/lib/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Plex Sans";src:url("../web/src/lib/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2");font-weight:600}
@font-face{font-family:"Plex Cond";src:url("../web/src/lib/fonts/ibm-plex-sans-condensed-latin-500-normal.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Plex Cond";src:url("../web/src/lib/fonts/ibm-plex-sans-condensed-latin-600-normal.woff2") format("woff2");font-weight:600}
@font-face{font-family:"Plex Mono";src:url("../web/src/lib/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Plex Mono";src:url("../web/src/lib/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");font-weight:500}

:root{
  --paper:#ECEFED; --panel:#FFFFFF; --sunk:#F5F7F6; --ink:#17212B; --ink2:#52606D; --line:#D0D6D3; --line2:#E3E7E5;
  --blue:#0E4C92; --blue-soft:#E1EAF5; --yellow:#F2B705; --yellow-soft:#FDF3D3; --ok:#2E7D4F; --ok-soft:#E1F1E7; --bad:#B3261E; --bad-soft:#FBE4E2;
  --s1:#6C9BD0; --s2:#3A76B8; --s3:#0E4C92; --s4:#082E5A; --belt:#3B444C; --roll:#6A747C; --onblue:#fff;
  --sans:"Plex Sans",system-ui,"Segoe UI",sans-serif; --cond:"Plex Cond","Plex Sans",system-ui,sans-serif; --mono:"Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171D; --panel:#19212A; --sunk:#151C23; --ink:#E6EAED; --ink2:#9CA9B5; --line:#2F3A44; --line2:#25303A;
  --blue:#82B3E8; --blue-soft:#1B2C3F; --yellow:#F2C230; --yellow-soft:#3A3115; --ok:#6CC08F; --ok-soft:#173226; --bad:#F08A80; --bad-soft:#3A1D1B;
  --s1:#8FB6E0; --s2:#5F95CF; --s3:#3E7CC0; --s4:#2C5E98; --belt:#0B0F13; --roll:#3A444D; --onblue:#0B1620;
}}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--cond);font-weight:600;line-height:1.2;margin:0}
code{font-family:var(--mono);font-size:.88em}
p{margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line2)}
th{font-family:var(--cond);font-weight:600;font-size:13.5px;color:var(--ink2);border-bottom:1.5px solid var(--line)}
.tw{overflow-x:auto}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 14.5px var(--sans);padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.small{font-size:13px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.55}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--ok);cursor:pointer;flex:none;margin:2px 0 0}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Kopfleiste ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:9px 20px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand{font:600 17px var(--cond);color:var(--ink);text-decoration:none;margin-right:14px;white-space:nowrap;line-height:1.1}
.top .brand small{display:block;font:500 9.5px var(--sans,sans-serif);letter-spacing:.04em;color:var(--muted,#7a8691)}
.credit{max-width:1180px;margin:28px auto 18px;padding:0 20px;font-size:11px;letter-spacing:.03em;color:var(--muted,#7a8691);text-align:right}
.top nav{display:flex;gap:2px;overflow-x:auto}
.top nav a{padding:6px 11px;border-radius:6px;color:var(--ink2);text-decoration:none;font-size:14.5px;white-space:nowrap}
.top nav a:hover{background:var(--blue-soft);color:var(--ink)}
.top nav a[aria-current=page]{color:var(--blue);background:var(--blue-soft);font-weight:500}
.top .grow{flex:1}
main{max-width:1380px;margin:0 auto;padding:24px 20px 80px}

/* ---------- Start ---------- */
.home-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#0b1a2b;color:#fff;border-radius:12px;overflow:hidden;min-height:360px}
.home-hero .txt{padding:40px 44px;display:flex;flex-direction:column;justify-content:center}
.home-hero h1{font-size:clamp(34px,4.4vw,54px);line-height:1.02;letter-spacing:-.01em}
.home-hero p{color:#CFDCE8;font-size:17.5px;max-width:52ch;margin:16px 0 22px}
.home-hero .img{position:relative;background:#0b1a2b}
.home-hero .img img{width:100%;height:100%;object-fit:cover;display:block}
.home-hero .img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b1a2b 0,rgba(11,26,43,0) 30%);z-index:1}
.continue{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.continue .btn.primary{background:#fff;color:#0b1a2b;border-color:#fff;font-size:15.5px;padding:11px 18px}
.continue .meter{font-size:14px;color:#B9C9D8}
.continue .meter b{color:#fff;font:600 20px var(--cond);margin-right:4px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 30px;margin-top:20px}
.panel>h2{font-size:24px}
.panel .lead{color:var(--ink2);margin:6px 0 18px;max-width:72ch}

.belt{display:grid;grid-template-columns:var(--cols,4fr 5fr 7fr 8fr);gap:12px}
.seg{display:flex;flex-direction:column}
.seg .lbl{font:600 15px var(--cond)}
.seg .sub{font-size:12.5px;color:var(--ink2);margin-bottom:10px;flex:1}
.baskets{display:flex;gap:5px;align-items:flex-end;padding:0 4px}
.basket{flex:1;max-width:46px;aspect-ratio:1/1.05;border:2px solid var(--c);border-radius:3px 3px 1px 1px;background:repeating-linear-gradient(90deg,transparent 0 5px,color-mix(in srgb,var(--c) 28%,transparent) 5px 6px),repeating-linear-gradient(0deg,transparent 0 5px,color-mix(in srgb,var(--c) 28%,transparent) 5px 6px);display:grid;place-items:center;font:600 11.5px var(--mono);color:var(--ink);text-decoration:none;position:relative;overflow:hidden;transition:transform .15s}
.basket:hover{transform:translateY(-3px)}
.basket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--p,0%);background:var(--c);opacity:.85;transition:height .4s}
.basket span{position:relative;z-index:1}
.basket.full span{color:#fff}
.basket.next{outline:2px dashed var(--c);outline-offset:3px}
.track{height:14px;margin-top:3px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--roll) 0 3px,var(--belt) 3px 14px)}

.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;border-top:5px solid var(--c)}
.stage header{padding:18px 22px 10px}
.stage h3{font-size:20px}
.stage header p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.exrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 22px;border-top:1px solid var(--line2);color:var(--ink);text-decoration:none}
.exrow:hover{background:var(--sunk)}
.exrow .code{font:600 20px var(--cond);color:var(--c)}
.exrow .t{font-weight:500;line-height:1.3}
.exrow .s{font-size:13px;color:var(--ink2)}
.segs{display:flex;gap:3px;align-items:center}
.segs i{width:9px;height:9px;border-radius:2px;background:var(--line2)}
.segs i.on{background:var(--ok)}
.segs .ue{font-size:12.5px;color:var(--ink2);margin-right:8px;white-space:nowrap}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.quick a{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;text-decoration:none;color:var(--ink)}
.quick a:hover{border-color:var(--blue)}
.quick b{display:block;font:600 17px var(--cond);margin-bottom:4px}
.quick span{font-size:14px;color:var(--ink2)}

/* ---------- Übung ---------- */
.exhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:18px 24px}
.exhead .code{font:600 48px/1 var(--cond);color:var(--c);letter-spacing:-.02em}
.exhead h1{font-size:28px}
.exhead .sub{color:var(--ink2);margin-top:3px}
.exhead .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin-top:8px}
.exhead .meta b{color:var(--ink);font-weight:500}
.exhead .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.timer{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:4px 6px 4px 12px;font-size:13.5px}
.timer .tv{font:500 15px var(--mono);min-width:64px}
.timer .plan{color:var(--ink2);font-size:12.5px}

.exgrid{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:20px;margin-top:20px;align-items:start}
.exgrid>*{min-width:0}
.stepper{position:sticky;top:76px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stepper ol{list-style:none;margin:0;padding:0}
.stepper a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);position:relative}
.stepper li:not(:last-child) a::after{content:"";position:absolute;left:24px;top:38px;height:14px;width:2px;background:var(--line)}
.stepper a:hover{background:var(--sunk)}
.stepper a[aria-current=step]{background:var(--blue-soft)}
.stepper .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--cond);border:2px solid var(--line);color:var(--ink2);background:var(--panel)}
.stepper a[aria-current=step] .n{border-color:var(--c);color:var(--c)}
.stepper .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .pt{font:600 15.5px var(--cond)}
.stepper .ps{font-size:12px;color:var(--ink2);grid-column:2}
.stepper .exnav{display:flex;justify-content:space-between;border-top:1px solid var(--line2);margin-top:10px;padding-top:10px}

.work{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 34px 22px;min-height:520px}
.work>h2{font-size:26px;display:flex;align-items:baseline;gap:12px}
.work>h2 .pn{color:var(--c);font-size:22px}
.work .intro{color:var(--ink2);margin:6px 0 22px;max-width:70ch}
.work h3{font-size:18px;margin:26px 0 10px}
.work .prose{max-width:72ch}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line2);margin-top:30px;padding-top:18px}
.ctx{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
.ctx .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.ctx h4{font-size:14px;color:var(--ink2);margin-bottom:8px}
.ctx figure{margin:0}
.ctx figure img{width:100%;border-radius:7px;display:block;cursor:zoom-in;border:1px solid var(--line)}
.ctx figcaption{font-size:12.5px;color:var(--ink2);margin-top:6px}
.goals{margin:0;padding-left:18px;font-size:14px}
.goals li{margin:3px 0}

.callout{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);padding:14px 18px;border-radius:0 8px 8px 0;margin:0 0 18px}
.callout.warn{--c:var(--yellow)}
.beschr{margin:0 0 18px}.beschr p{margin:0 0 10px}.beschr ul,.beschr ol{margin:0 0 10px;padding-left:22px}
.fw{display:grid;gap:8px;margin:0 0 20px}
.fw details{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.fw summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
.fw summary::-webkit-details-marker{display:none}
.fw summary::before{content:"›";font-size:18px;line-height:1;transition:transform .15s;color:var(--blue)}
.fw details[open] summary::before{transform:rotate(90deg)}
.fw details>.prose{padding:0 16px 12px}.fw .prose p{margin:0 0 8px}.fw table{margin:6px 0 10px}
.confirm{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:9px;cursor:pointer;margin:10px 0}
.confirm:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}

.siglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sigcard{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.35;cursor:pointer}
.sigcard:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.sigcard b{font:500 13px var(--mono);display:block}
.sigcard .ad{font:500 12px var(--mono);color:var(--blue)}

.quiz{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.quiz .qq{font-weight:500;margin-bottom:10px}
.quiz .opts{display:grid;gap:7px}
.quiz button.opt{text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:15px}
.quiz button.opt:hover:not(:disabled){border-color:var(--blue)}
.quiz button.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz button.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz button.opt:disabled{cursor:default}
.quiz .fb{margin-top:10px;font-size:14.5px}
.quiz .fb b.ok{color:var(--ok)} .quiz .fb b.no{color:var(--bad)}

.qa{margin:0 0 20px}
.qa label{display:block;font-weight:500;margin-bottom:7px}
.qa .state{font-size:12.5px;color:var(--ok);margin-left:8px;font-weight:400}

.sketches{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sk{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.sk .th{background:#fff;aspect-ratio:1000/707;border-bottom:1px solid var(--line);cursor:pointer}
.sk .th svg{width:100%;height:100%;display:block}
.sk .nm{padding:8px 12px 4px;font-weight:500;font-size:14.5px}
.sk .st{padding:0 12px;font-size:12.5px;color:var(--ink2)}
.sk .act{display:flex;gap:6px;padding:8px 10px 10px;margin-top:auto}

.vars td{padding:4px 6px;vertical-align:middle}
.vars input{padding:5px 7px;font-size:14px;border-radius:5px}
.vars .del{border:0;background:none;cursor:pointer;color:var(--ink2);padding:4px}
.vars .del:hover{color:var(--bad)}

.tasks{list-style:none;padding:0;margin:0;counter-reset:t}
.tasks li{counter-increment:t;display:grid;grid-template-columns:34px 26px minmax(0,1fr);gap:6px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line2)}
.tasks li::before{content:counter(t);font:600 18px var(--cond);color:var(--c);line-height:1.4}
.tasks li:has(input:checked) .tx{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--line)}
.tasks .tx{line-height:1.55}

.checks{display:grid;gap:10px}
.case{border:1px solid var(--line);border-radius:10px;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.case.ok{border-color:var(--ok);background:var(--ok-soft)}
.case.bad{border-color:var(--bad);background:var(--bad-soft)}
.case .ct{font-weight:500}
.case .obs{grid-column:1/-1}
.case .obs input{font-size:14px;padding:6px 9px;background:transparent}
.segbtn{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.segbtn button{border:0;background:none;padding:6px 11px;font-size:13.5px;cursor:pointer;border-right:1px solid var(--line)}
.segbtn button:last-child{border-right:0}
.segbtn button[aria-pressed=true][data-val=ok]{background:var(--ok);color:#fff}
.segbtn button[aria-pressed=true][data-val=bad]{background:var(--bad);color:#fff}
.summary{display:flex;gap:18px;font-size:14px;color:var(--ink2);margin:0 0 14px}
.summary b{font:600 22px var(--cond);color:var(--ink);margin-right:4px}

.rate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.rate .scale{display:flex;gap:5px}
.rate .scale button{width:38px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;font-weight:500}
.rate .scale button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.plus{border:1px dashed var(--c);border-radius:10px;padding:14px 18px;margin-top:20px}
.plus b{font-family:var(--cond);font-size:16px}
.finish{display:flex;align-items:center;gap:16px;margin-top:24px;padding:18px 20px;border-radius:10px;background:var(--sunk)}
.finish.done{background:var(--ok-soft)}

.tplt input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 2px;background:transparent}
.zt{display:inline-block;font:500 11.5px var(--sans);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.quelle{font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2);padding-top:6px;margin-top:8px}
.case .fa{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:4px;border-top:1px dashed var(--bad)}
.case .fa b{grid-column:1/-1;color:var(--bad)}
.case .fa label{display:block;color:var(--ink2)}.case .fa input{font-size:14px;padding:6px 9px;margin-top:2px}
.case:not(.bad) .fa{display:none}
.hilfe{grid-column:3;display:grid;gap:6px;justify-items:start;margin-top:6px}
.hilfe details{width:100%;border:1px solid var(--line);border-left:3px solid var(--yellow);border-radius:7px;background:var(--yellow-soft);font-size:14.5px}
.hilfe summary{cursor:pointer;padding:6px 10px;font-weight:500}
.hilfe .prose{padding:0 12px 8px}
ul.erg{list-style:none;padding:0;margin:8px 0 4px;display:grid;gap:6px}
ul.erg li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}
.art{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:600 12.5px var(--cond);color:#fff;background:var(--ink2);cursor:help}
.art-N{background:var(--blue);color:var(--onblue)}.art-E{background:var(--ok)}.art-U{background:var(--yellow);color:#17212B}.art-Ü{background:transparent;color:var(--ink2);border:1.5px solid var(--ink2)}
.ergmx th.vx{writing-mode:vertical-rl;transform:rotate(180deg);font:600 13px var(--cond);padding:6px 2px;text-align:left}
.ergmx td,.ergmx th{text-align:center;padding:5px 4px}.ergmx td:first-child,.ergmx th:first-child{text-align:left;padding-left:10px}
.ergmx td.on{background:var(--sunk)}

/* ---------- Signal-Chips ---------- */
.sig{display:inline;font:500 .87em var(--mono);padding:0 4px;border-radius:4px;background:var(--blue-soft);color:var(--blue);border:0;cursor:help;white-space:nowrap}
.sig.nodata{cursor:default}

.txtin{position:absolute;z-index:5;font:500 15px/1.35 var(--sans);padding:3px 6px;border:2px solid var(--blue);border-radius:5px;width:260px;background:#fff;color:#111;resize:none;overflow:hidden}

.edbody{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0}

.palb{min-width:0;overflow:hidden}.palb>span{max-width:100%;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}.palb svg{max-width:100%;height:auto}

.props{border:1px solid var(--blue);border-radius:9px;padding:10px 11px;margin-bottom:14px;background:var(--blue-soft)}

 plus:"Ergänzen Sie für das HMI eine Seite Handbetrieb mit je zwei Schaltflächen und den Endlagen jeder Bewegung – die Befehle laufen über dieselben Variablen wie die Taster."},

 einst:"<i>Verzinnen: Portal = SPS</i> und <i>Band, Anschlag, Vereinzeler = SPS</i>, alles andere automatisch. So schaltet nur Ihr Programm den Anschlag −MM5 über −MB9; das Band bleibt stehen, solange Ihr Programm es nicht einschaltet – im Handbetrieb gewollt.",
 ziele:["Verriegelungen aus Kollisionsgefahren ableiten","Freigaben je Bewegung als eigene Bedingung programmieren","Verriegelungen systematisch prüfen und dokumentieren"],
 sig:"SA3 PF7 SF11 SF12 SF13 SF14 SF15 SF16 SF17 SF18 SF19 SF20 BG2 BG3 BG4 BG5 BG6 BG7 BG8 BG14 BG15 BG40",
 sit:"Nach einer Störung hängt der Korb über dem Bad. Der Instandhalter muss die Zylinder einzeln fahren können – ohne das Portal zu beschädigen. Ihr Handbetrieb aus L08 erlaubt bisher jede Bewegung in jeder Lage.",
 tab:{cap:"Mindest-Verriegelungen (vom Betreiber vorgegeben)", ...T(["Bewegung","Nur erlaubt, wenn"],[
  ["−MM3 zum Bad / zum Band","Korb angehoben (−BG3)"],["−MM2 senken","über dem Band (−BG5) oder über dem Bad bei offener Abdeckung (−BG6 und −BG7)"],["−MM1 lösen","abgesenkt (−BG4) und über dem Band (−BG5)"],["−MM4 abdecken","nicht, wenn der Korb über dem Bad hängt und nicht oben ist"]])},
 auf:["Erstellen Sie eine Gefährdungsmatrix: Welche Bewegung darf in welcher Lage nicht ausgeführt werden? Prüfen Sie jede Zeile am Zwilling.","Bilden Sie je Bewegung eine Freigabe, z. B. <code>#releaseToBath</code> := −BG3 – in einem eigenen Baustein <code>Interlock</code>, getrennt vom Handbetrieb.","Der Handbetrieb fährt nur noch, wenn Taster UND Freigabe anstehen. Fehlt die Freigabe, blinkt −PF7.","Ergänzen Sie die Verriegelungen, die in der Tabelle noch fehlen: Anschlag −MM5 und Anheben bzw. Absenken am Übergabeplatz."],
 lf:["Warum braucht −MM2 zum Absenken über dem Bad zwei Bedingungen, über dem Band nur eine?","Warum verriegeln Sie auf die gemeldete Endlage (z. B. −BG3) und nicht auf den zuletzt gegebenen Befehl „anheben“?","Welche Verriegelung fehlt in der Tabelle noch? (Tipp: Anschlag −MM5 und Anheben am Übergabeplatz)"],
 pr:["Jede Verriegelung einzeln geprüft: Taster in verbotener Lage → keine Bewegung","Freigabe fehlt → −PF7 blinkt","Sensor der Freigabe auf 0 forcen (z. B. −BG3) → zugehöriger Taster wirkungslos","Gefährdungsmatrix vollständig und von der Lehrkraft abgezeichnet"],
 plus:"Zeigen Sie auf dem HMI zu jeder gesperrten Bewegung, welche Bedingung fehlt – so findet der Instandhalter den Grund ohne Programmiergerät."},

{id:"L10", st:2, t:"Betriebsarten HAND und AUTO", sub:"Betriebsartenteil – umschalten, ohne dass sich etwas bewegt", ue:3, vor:"L09", repo:"3, 4", bild:["03-schaltschrank.jpg","Wahlschalter −SA3 Hand / Auto und Leuchte −PF7 an der Schaltschranktür"],
 einst:"<i>Verzinnen: Portal = SPS</i> und <i>Band, Anschlag, Vereinzeler = SPS</i>, alles andere automatisch. So schaltet nur Ihr Programm den Anschlag −MM5 über −MB9; das Band bleibt stehen, solange Ihr Programm es nicht einschaltet – im Handbetrieb gewollt.",
 ziele:["einen Betriebsartenteil mit sich gegenseitig ausschließenden Betriebsarten programmieren","Betriebsarten stoßfrei wechseln: der Wechsel selbst löst keine Bewegung aus","Bedingungen für AUTO festlegen: Grundstellung, Freigabe, kein Not-Halt"],
 sig:"SA3 PF7 PF1 SF1 SF2 KF2 BG2 BG4 BG5 BG8",
 sit:"Neben den Handbetrieb aus L08 kommt bald eine Automatik. Bevor der erste Automatikschritt programmiert wird, legen Sie fest, wer die Anlage wann führt: −SA3 an der Schaltschranktür wählt HAND oder AUTO. Es darf nie beides zugleich aktiv sein, und das Umschalten selbst darf nichts bewegen.",
 tab:{cap:"Betriebsarten der Verzinnungsanlage", ...T(["Betriebsart","aktiv, wenn","Wirkung"],[["HAND","−SA3 = 1 und −KF2 gibt frei","Handtaster wirken über die Verriegelungen, die Automatik ruht, −PF7 leuchtet"],["AUTO","−SA3 = 0 und −KF2 gibt frei","Automatik darf auf START hin arbeiten, Handtaster wirkungslos; ohne Grundstellung blinkt −PF1"],["keine","−KF2 = 0 (Not-Halt, Schutzfeld)","alle Befehle gelöscht; nach dem Quittieren bewegt sich nichts von selbst"]])},
 auf:["Legen Sie einen FB <code>ModeSelect</code> an, der <code>#statModeManual</code> und <code>#statModeAuto</code> bildet. Prüfen Sie im Programm, dass nie beide 1 sind.","Bei −KF2 = 0 sind beide Betriebsarten 0. Nach dem Quittieren wird die gewählte Betriebsart wieder aktiv, aber nichts bewegt sich selbstständig.","AUTO ist erst startbereit, wenn die Grundstellung aus L07 vorliegt. Sonst blinkt −PF1 mit 1 Hz.","Legen Sie fest, was mit der gespeicherten Handstellung des Anschlags −MM5 beim Wechsel nach AUTO geschieht. Fällt sie ab, schließt der Anschlag – eine Bewegung, die niemand befohlen hat. Entscheiden und begründen Sie.","Zeichnen Sie die Betriebsarten als Zustandsdiagramm mit allen Übergängen und Bedingungen."],
 lf:["Warum müssen sich Betriebsarten gegenseitig ausschließen? Was könnte sonst passieren?","Warum darf ein Betriebsartenwechsel keine Bewegung auslösen?","Warum gehört die Grundstellung in die Bedingung für AUTO, aber nicht für HAND?","Warum sitzt der Wahlschalter HAND / AUTO an der Schaltschranktür und nicht am Bedienpult?"],
 pr:["−SA3 auf HAND → #statModeManual = 1, #statModeAuto = 0, −PF7 an","Umschalten in jeder Lage → keine unbefohlene Bewegung (Verhalten von −MM5 wie festgelegt)","AUTO ohne Grundstellung → −PF1 blinkt, kein Start möglich","Not-Halt → beide Betriebsarten 0; nach dem Quittieren fährt nichts","Zustandsdiagramm stimmt mit dem Programm überein"],
 plus:"Zeigen Sie die aktive Betriebsart auf dem HMI und protokollieren Sie jeden Wechsel mit Uhrzeit in einer Ereignisliste."},

{id:"L11", st:2, t:"Befehlsausgabe", sub:"Hand und Automatik zusammenführen – jeder Ausgang genau einmal", ue:3, vor:"L10", repo:"4", bild:["03-schaltschrank.jpg","Ventilinsel und Ausgänge im Schaltschrank"],
 einst:"<i>Verzinnen: Portal = SPS</i> und <i>Band, Anschlag, Vereinzeler = SPS</i>, alles andere automatisch. So schaltet nur Ihr Programm den Anschlag −MM5 über −MB9; das Band bleibt stehen, solange Ihr Programm es nicht einschaltet – im Handbetrieb gewollt.",
 ziele:["das Programm in Betriebsartenteil, Ablaufteil und Befehlsausgabe gliedern","jeden Ausgang an genau einer Stelle zuweisen und Doppelzuweisungen finden","Verriegelungen so anordnen, dass sie in jeder Betriebsart wirken"],
 sig:"MB1 MB2 MB3 MB4 MB5 MB6 MB7 MB8 MB9 SA3 PF7",
 sit:"Bisher schaltet Ihr Handbetrieb die Ventile selbst. Sobald in L12 die Schrittkette dazukommt, liegt es nahe, dieselben Ventile dort noch einmal zuzuweisen. Dann gewinnt die letzte Zuweisung im Zyklus, die erste ist wirkungslos – im Handbetrieb bewegt sich plötzlich nichts mehr, oder die Kette hängt. Deshalb bekommt die Anlage eine Befehlsausgabe: Sie ist die einzige Stelle, die Ventile schreibt.",
 tab:{cap:"Gliederung einer Ablaufsteuerung", ...T(["Teil","Baustein","liefert"],[["Betriebsartenteil","FB ModeSelect (L10)","#statModeManual, #statModeAuto"],["Handbetrieb","FB Manual (L08)","Handbefehl je Bewegung"],["Ablaufteil","FB Tinning (ab L12)","Auto-Befehl je Bewegung"],["Verriegelungen","Interlock (L09)","Freigabe je Bewegung"],["Befehlsausgabe","FB CommandOutput","einzige Zuweisung an −MB1 … −MB9"]])},
 auf:["Öffnen Sie in TIA die Querverweisliste der Ausgänge %Q0.0 bis %Q2.2 und notieren Sie jede Stelle, an der ein Ausgang geschrieben wird.","Ändern Sie den Handbetrieb: Er liefert nur noch Handbefehle (z. B. <code>#manLower</code>), keine Ausgänge.","Legen Sie einen FB <code>CommandOutput</code> an. Je Ventil genau eine Zuweisung: Ventil := ((Handbefehl UND HAND) ODER (Auto-Befehl UND AUTO)) UND Freigabe.","Verknüpfen Sie die Freigaben aus <code>Interlock</code> (L09) in der Befehlsausgabe statt im Handbetrieb. Damit gelten sie in HAND und AUTO.","Bistabile Ventile: Kommen Befehle für beide Spulen zugleich, wird keine Spule angesteuert.","Testen Sie die Auto-Seite schon jetzt ohne Kette: Setzen Sie die Auto-Befehle in einer Beobachtungstabelle."],
 lf:["Ein Ausgang wird in Netzwerk 3 auf 1 und in Netzwerk 12 auf 0 geschrieben. Was sieht das Ventil – und warum ist dieser Fehler so schwer zu finden?","Warum gehören Verriegelungen in die Befehlsausgabe und nicht in den Handbetrieb oder in die Schrittkette?","Welche Vorteile hat es für Diagnose, Erweiterung und Test, wenn Hand und Automatik nur Befehle liefern?"],
 pr:["Querverweisliste: jedes Ventil −MB1 bis −MB9 hat genau eine Schreibstelle","HAND: Auto-Befehl in der Beobachtungstabelle gesetzt → keine Bewegung","AUTO: Handtaster betätigt → keine Bewegung","AUTO: Auto-Befehl −MM3 zum Bad bei abgesenktem Korb → Verriegelung sperrt","Beide Spulen eines bistabilen Ventils nie gleichzeitig 1"],
 plus:"Kapseln Sie eine Bewegung als FB <code>Cylinder</code> (je Zylinder eine Multiinstanz) mit Befehlen, Freigaben, Endlagen und Ventilausgängen. In L17 kommt die Überwachungszeit dazu."},

{id:"L12", st:2, t:"Schrittkette Verzinnen", sub:"Automatik als GRAFCET entwerfen und umsetzen", ue:6, vor:"L11", repo:"2", bild:["04-zinnbad.jpg","Portal über dem Zinnbad mit −MM1 bis −MM4"],
 einst:"<i>Verzinnen: Portal = SPS</i>, alles andere automatisch (Band, Anschlag, Vereinzeler wieder <i>automatisch</i>). Den Anschlag −MM5 öffnet hier das Bandmodul; Ihr Befehl für −MB9 wirkt erst wieder ab L16.",
 ziele:["eine Ablaufsteuerung als GRAFCET nach DIN EN 60848 entwerfen","Schritte als statische Bool-Variablen im FB (Setzen/Rücksetzen) oder als CASE-Anweisung in SCL umsetzen","Schritt, Transition und Aktion unterscheiden"],
 sig:"SF1 SA3 KF2 MB1 MB2 MB3 MB4 MB5 MB6 MB7 MB8 BG1 BG2 BG3 BG4 BG5 BG6 BG7 BG8 BG15 BG40",
 sit:"Ein Korb liegt am Anschlag (−BG40). Das Portal soll ihn auf START einmal komplett verzinnen. Tauch- und Abtropfzeit betragen je 10 s; einstellbar sind sie unter <i>Prozess</i> von 2 bis 30 s.",
 tab:{cap:"Soll-Ablauf", ...T(["Schritt","Aktion","Ventil","Weiter, wenn"],[
  ["1","Initialschritt, warten","–","startbereit und START"],["2","Korb einhängen","−MB1","−BG1 und Anschlag offen −BG15"],["3","Anheben","−MB4","−BG3"],["4","Zum Zinnbad","−MB5","−BG6"],["5","Bad öffnen","−MB8","−BG7"],["6","Tauchen","−MB3","−BG4 und Tauchzeit abgelaufen"],["7","Anheben, abtropfen","−MB4","−BG3 und Abtropfzeit abgelaufen"],["8","Bad abdecken, zurück zum Band","−MB7 und −MB6","−BG8 und −BG5"],["9","Absenken","−MB3","−BG4"],["10","Korb lösen","−MB2","−BG2, zurück zu Schritt 1"]])},
 auf:["Zeichnen Sie den GRAFCET mit Schritten, Transitionen und Aktionen.","Programmieren Sie die Kette in einem FB <code>Tinning</code>. Variante A: je Schritt eine statische Bool-Variable mit Setzen/Rücksetzen in FUP. Variante B: <code>CASE #statStep OF</code> in SCL.","Die Aktionen setzen nur die Auto-Befehle der Befehlsausgabe aus L11 – kein Schritt schreibt selbst einen Ausgang. Die Kette läuft nur in AUTO.","Die Zeiten in Schritt 6 und 7 laufen erst ab Erreichen der Endlage (<code>TON</code> mit Eingang Schritt UND Endlage)."],
 lf:["Warum starten die Zeiten in Schritt 6 und 7 erst ab Endlage und nicht beim Schrittwechsel?","Warum darf in Schritt 8 gleichzeitig abgedeckt und zurückgefahren werden?","Was passiert mit dem Korb, wenn Sie in Schritt 2 einhängen und anheben, bevor −BG15 meldet?"],
 pr:["Ein Zyklus läuft vollständig, die Ereignisliste meldet keinen „Korb mangelhaft“","Weg-Zeit-Diagramm zeigt die Bewegungen in der Reihenfolge der Tabelle","Tauchzeit auf 5 s geändert → Programm hält sich daran (Sollwert als Variable)","−BG7 auf 0 forcen → Kette bleibt in Schritt 5 stehen","Querverweisliste: Ventile weiterhin nur in der Befehlsausgabe geschrieben"],
 plus:"Setzen Sie dieselbe Kette in S7-GRAPH um und vergleichen Sie die Diagnose im HMI."},

{id:"L13", st:2, t:"Dauer- und Einzelzyklus", sub:"Zyklusende abwarten, START als Flanke", ue:3, vor:"L12", repo:"3", bild:["02-bedienpult.jpg","Wahlschalter −SA1 Dauerbetrieb / Einzelzyklus am Bedienpult"],
 einst:"<i>Verzinnen: Portal = SPS</i>, alles andere automatisch.",
 ziele:["Dauer- und Einzelzyklus im Betriebsartenteil umsetzen","START als Flanke auswerten","„Zyklusende abwarten“ umsetzen"],
 sig:"SA1 SF1 SF2 PF1 KF2",
 sit:"Die Automatik aus L12 läuft genau einen Zyklus. Der Betreiber will in AUTO zwei Ablaufarten, gewählt mit −SA1 am Bedienpult. Dauerbetrieb: Zyklus um Zyklus, bis STOP gedrückt wird; der laufende Korb wird fertig. Einzelzyklus: genau ein Zyklus je START.",
 auf:["Erweitern Sie den Betriebsartenteil aus L10 um die statische Variable <code>#statContinuous</code>: setzen mit positiver Flanke START bei −SA1 = Dauerbetrieb, rücksetzen mit STOP, Wechsel auf Einzelzyklus, Wechsel auf HAND oder Not-Halt.","Die Transition 1 → 2 lautet: AUTO UND startbereit UND (<code>#statContinuous</code> ODER Flanke START im Einzelzyklus).","−PF1 leuchtet dauernd bei <code>#statContinuous</code> und blinkt wie in L10, solange die Grundstellung fehlt – weiterhin eine einzige Schreibstelle für −PF1."],
 lf:["Warum braucht START eine Flankenauswertung? Was passiert ohne, wenn jemand die Taste hält?","Wie verhält sich Ihre Anlage, wenn im laufenden Zyklus von Dauerbetrieb auf Einzelzyklus umgeschaltet wird?","Warum hält STOP die Kette erst am Zyklusende an und nicht sofort?"],
 pr:["Dauerbetrieb + START → mehrere Zyklen hintereinander, −PF1 an","STOP in Schritt 6 → Korb wird fertig, dann Halt in Schritt 1","Einzelzyklus, START gedrückt halten → nur ein Zyklus","Not-Halt während AUTO → nach Quittieren kein selbstständiger Wiederanlauf"],
 plus:"Programmieren Sie die Grundstellungsfahrt als eigene Schrittkette (anheben → zurück und abdecken → senken → lösen) mit den Schrittnummern 11 bis 14. Sie startet in AUTO, wenn die Anlage nicht in Grundstellung steht."},

 einst:"<i>Verzinnen: Portal = SPS</i>, alles andere automatisch. Alle fünf Not-Halt-Taster sind in der 3D-Ansicht unter <i>Ansicht → Steuerstellen</i> erreichbar.",
 ziele:["Sicherheitsfunktion und Diagnose trennen","eine Erstwertmeldung bilden","Blinkmelder ansteuern"],

 lf:["Warum werden die Meldekontakte nur gemeldet und nicht zum Abschalten benutzt?","Wie unterscheiden Sie Not-Halt und Lichtvorhang, obwohl beide über −KF2 abschalten? Bedenken Sie: Das Schutzfeld meldet nach dem Durchgriff sofort wieder frei."],

  var TEXTE = {"L01":{"beschr":"<p><b>Ausgangslage:</b> Die Verzinnungsanlage ist mechanisch aufgebaut und verdrahtet, ein Anwenderprogramm gibt es noch nicht. Bevor Sie eine Zeile programmieren, prüfen Sie jede Leitung vom Feldgerät bis zur Adresse in der CPU – den sogenannten Loop-Check. In dieser Übung programmieren Sie nichts: Sie betätigen, beobachten, forcen und dokumentieren. Alle Übungsumfänge stehen auf <i>automatisch</i>, die Anlage fährt also selbst. Für die Beobachtungstabelle in TIA muss der Zwilling über die Bridge mit PLCSIM Advanced gekoppelt sein; arbeiten Sie nur mit der Demo ohne SPS, lesen Sie die Pegel im Signalmonitor der Seitenleiste ab.</p><p><b>Was Sie tun sollen:</b></p><ol><li>Legen Sie in TIA eine Beobachtungstabelle für die 24 Eingänge %I0.0 bis %I2.7 an. Dazu gehören die Endlagen −BG1 bis −BG8, die Prozesssensoren −BG9 bis −BG11, die Taster und Wahlschalter am Bedienpult und an der Schaltschranktür, die Vor-Ort-Steuerstelle von Band 1 sowie −BG12, −BG13 und −FA1.</li><li>Ergänzen Sie für Ihre Pegeltabelle eigene Spalten: Pegel unbetätigt, Pegel betätigt, Kontaktart (Schließer/Öffner), Bemerkung.</li><li>Betätigen Sie jedes Bedienelement im 3D-Pult und in der Seitenleiste. Signale, die Sie nicht direkt betätigen können (Lichtschranken, Endlagen), beobachten Sie im laufenden Ablauf.</li><li>Lassen Sie die Demo die Grundstellung anfahren und halten Sie fest, welche Endlagensensoren dann 1 melden.</li><li>Forcen Sie −BG9 im Signalmonitor auf 0. Beobachten Sie über mindestens einen Zyklus, was die Demo-SPS nun nicht mehr tut und welche Meldeleuchte reagiert. Geben Sie das Signal danach mit <b>A</b> wieder ans Modell zurück.</li></ol><p><b>Randfälle, auf die Sie achten:</b></p><ul><li>Öffner wie STOP −SF2, Halt −SF7, Motorschutz −FA1 und die Rückmeldung −KF2 liefern im Ruhezustand 1 – das ist kein Fehler, sondern Absicht.</li><li>Während ein Zylinder fährt, melden kurz beide Endlagen 0.</li><li>Wahlschalter (−SA1, −SA3) und Schlüsselschalter (−SA2) rasten; Taster nicht.</li><li>Für die Leitfrage zu −BG39 (Kühlwassertank, %I11.6) schauen Sie zusätzlich außerhalb des Adressbereichs nach.</li></ul><p><b>Abzugeben:</b> die vollständige Pegeltabelle aller 24 Eingänge, ein kurzes Protokoll zur Grundstellung und zum Versuch mit −BG9 (Beobachtung, Begründung) sowie die Antworten auf die Leitfragen.</p><p><b>Erfolg</b> heißt: Jeder Eingang ist mit Adresse, Gerät, Ruhe- und Arbeitspegel eindeutig beschrieben, die Grundstellung ist richtig erkannt, und Sie können die Wirkung von −BG9 = 0 begründen. Am Ende ist kein Signal mehr geforct.</p>","wissen":[{"t":"Loop-Check: Warum erst prüfen, dann programmieren","h":"<p>Beim Loop-Check wird jede Signalleitung einzeln vom Feldgerät bis zur Variable in der CPU geprüft: Sensor betätigen, Pegel in der Beobachtungstabelle ablesen, mit Schaltplan und Signalliste vergleichen. Typische Fehler sind vertauschte Adern, ein Gerät auf der falschen Klemme, eine falsche Adresse in der Variablentabelle oder ein Sensor, der als Schließer statt als Öffner geliefert wurde.</p><p>Wer diese Prüfung überspringt, sucht später im Programm nach Fehlern, die in der Verdrahtung liegen – das kostet bei der Inbetriebnahme oft Stunden. Die DIN EN 60204-1 fordert vor der Inbetriebnahme Prüfungen der elektrischen Ausrüstung, dazu gehören Funktionsprüfungen. Das Ergebnis wird protokolliert, damit es nachvollziehbar bleibt.</p>"},{"t":"Adressen und Prozessabbild","h":"<p>Eine Eingangsadresse wie %I1.0 bedeutet: Eingang (I), Byte 1, Bit 0. Ein Byte hat acht Bits, %I0.0 bis %I2.7 sind also drei Bytes mit 24 Eingängen. Die CPU liest zu Beginn jedes Zyklus alle Eingänge in das Prozessabbild der Eingänge ein; das Programm arbeitet dann mit diesem Abbild, nicht mit der Klemme direkt. Ein Signal muss deshalb mindestens einen Zyklus lang anstehen, um sicher erkannt zu werden.</p><p>Im Programm verwenden Sie nicht die Adresse, sondern den symbolischen Namen aus der Variablentabelle (z. B. <code>BG9_Temperatur</code>). Ändert sich die Verdrahtung, passen Sie nur die Tabelle an, nicht das Programm.</p>"},{"t":"Schließer und Öffner","h":"<p>Ein <b>Schließer</b> (NO) ist im Ruhezustand offen, der Eingang sieht 0; betätigt wird er 1. Ein <b>Öffner</b> (NC) ist im Ruhezustand geschlossen, der Eingang sieht 1; betätigt wird er 0. Welche Kontaktart ein Gerät hat, erkennen Sie nur am Pegel im unbetätigten Zustand – deshalb gehören beide Pegel in Ihre Tabelle.</p><p>Wichtig für die nächsten Übungen: Die Kontaktart ist eine Eigenschaft der Hardware. Wie Sie den Eingang im Programm abfragen (auf 1 oder auf 0), ist eine zweite, davon unabhängige Entscheidung.</p>"},{"t":"Drahtbruchsicherheit (Ruhestromprinzip)","h":"<p>Eine Leitung kann reißen, ein Stecker sich lösen, eine Sicherung auslösen. Der Eingang sieht dann immer 0. Drahtbruchsicher ist eine Schaltung, wenn dieses 0 zum sicheren Zustand führt. Deshalb werden Befehle, die etwas <b>beenden</b> oder <b>sperren</b> (STOP, Halt, Motorschutz, Freigabe des Sicherheitsrelais), als Öffner verdrahtet: Ein Drahtbruch wirkt wie ein betätigter STOP, die Anlage bleibt stehen. Befehle, die etwas <b>starten</b>, sind Schließer: Ein Drahtbruch verhindert nur das Einschalten.</p><p>Das Prinzip gilt auch für Sensoren: Man legt fest, welcher Pegel „Gefahr oder unbekannt“ bedeutet, und wählt die Wirkrichtung so, dass ein Leitungsfehler dort landet. Übertragen Sie diesen Gedanken selbst auf −BG39 am Kühlwassertank. Die DIN EN 60204-1 verlangt, dass Fehler in der Steuerung keine gefährlichen Zustände auslösen; das Ruhestromprinzip ist die einfachste Maßnahme dafür.</p>"},{"t":"Forcen im Zwilling und in TIA","h":"<p><b>Forcen im Signalmonitor</b> des Zwillings überschreibt das Signal auf der Feldseite: Die SPS bekommt den geforcten Wert, als käme er vom Sensor, und zwar dauerhaft, bis Sie es mit <b>A</b> zurückgeben. So simulieren Sie Sensorfehler, Drahtbrüche oder Zustände, die die Anlage gerade nicht hat.</p><p>In TIA gibt es zwei Werkzeuge: <b>Steuern</b> in der Beobachtungstabelle schreibt einen Wert einmalig in den Speicher der CPU; <b>Forcen</b> in der Forcetabelle (S7-1500) hält einen Wert an der Peripherie fest, die CPU zeigt das mit einer Force-LED an. Überlegen Sie, was beim Steuern eines Eingangs im nächsten Zyklus passiert.</p><p>Praxisregel: Ein vergessener Force ist eine gefährliche Fehlerquelle. Vor dem Verlassen der Anlage wird jeder Force zurückgenommen und im Protokoll vermerkt.</p>"},{"t":"Grundstellung","h":"<p>Die Grundstellung ist der definierte Ausgangszustand, aus dem ein Automatikzyklus starten darf: Alle Antriebe stehen in einer festgelegten Endlage, kein Korb hängt halb im Haken, das Bad ist abgedeckt. Sie wird über Endlagensensoren abgefragt, nicht über die zuletzt ausgegebenen Befehle – nur der Sensor zeigt, wo der Zylinder wirklich steht. Welche Sensoren dazu gehören, ermitteln Sie in dieser Übung selbst; in L07 wird daraus die Startfreigabe.</p>"}]},"L02":{"beschr":"<p><b>Ausgangslage:</b> Der Zwilling steht auf <i>Verzinnen: Portal = SPS</i>, alle übrigen Bereiche laufen automatisch. Weil Ihr Programm die Ventile −MB1 bis −MB8 noch nicht schaltet, bleibt das Portal stehen; Band, Zinnbad und Anschlag arbeiten selbstständig. Ihr Programm schaltet ausschließlich die Meldeleuchten −PF1 bis −PF4 am Bedienpult und bildet eine interne Variable zur Plausibilität des Anschlags −MM5.</p><p><b>Soll-Verhalten:</b></p><ul><li>−PF2 „Bad bereit“ leuchtet nur, wenn Temperatur −BG9 und Füllhöhe −BG10 beide in Ordnung melden.</li><li>−PF3 „Füllhöhe unterschritten“ leuchtet, solange −BG10 nicht meldet.</li><li>−PF4 „Korb vorhanden“ folgt dem Sensor −BG40 am Anschlag.</li><li>Lampentest: Solange −SF4 gedrückt ist, leuchten −PF1 bis −PF4 zusätzlich zu ihrer eigentlichen Bedingung. Nach dem Loslassen zeigt jede Leuchte wieder ihren echten Zustand.</li><li><code>#stopperPlausible</code> ist 1, wenn genau eine der beiden Endlagen −BG14 (zu) und −BG15 (offen) meldet.</li></ul><p><b>Vorgaben:</b> Legen Sie die Verknüpfungen in einem eigenen Baustein ab (z. B. FC <code>Indication</code> mit Bausteinkopf und Beschreibung) und rufen Sie ihn im OB1 auf. Jede Meldeleuchte bekommt genau <b>eine</b> Zuweisung im Programm – der Lampentest wird in diese eine Zuweisung eingebaut, nicht als zweite Zuweisung dahinter geschrieben. Programmieren Sie jede Verknüpfung einmal in FUP und einmal in KOP.</p><p><b>Randfälle und Fehlerfälle:</b></p><ul><li>Fällt −BG9 oder −BG10 weg, muss −PF2 sofort erlöschen.</li><li>Der Lampentest darf keine echte Meldung überdecken oder verfälschen, sobald er endet.</li><li>−SF4 ist zugleich Quittiertaster des Sicherheitsrelais −KF2. Prüfen Sie, ob der Lampentest ohne anstehenden Not-Halt Nebenwirkungen hat.</li><li>Melden −BG14 und −BG15 gleichzeitig 1, ist das physikalisch unmöglich – ein Hinweis auf einen Sensor- oder Verdrahtungsfehler.</li></ul><p><b>Abzugeben:</b> das Programm in FUP und KOP, die ausgefüllte Funktionstabelle zur XOR-Plausibilität, ein Prüfprotokoll zu den Prüfpunkten (was geforct, was beobachtet) und Ihre Antworten auf die Leitfragen mit einem kurzen Vergleich FUP gegen KOP.</p><p><b>Erfolg</b> heißt: Alle Prüfpunkte lassen sich durch Forcen im Signalmonitor reproduzierbar zeigen, jede Leuchte hat genau eine Schreibstelle, und Sie können begründen, warum Sie Negation und Öffner nicht verwechselt haben. Die Erweiterung der Plausibilität um eine Zeit folgt in L04.</p>","wissen":[{"t":"Grundverknüpfungen und Funktionstabelle","h":"<p>Jede binäre Steuerungsaufgabe lässt sich aus wenigen Grundverknüpfungen aufbauen: <b>UND</b> (alle Bedingungen erfüllt), <b>ODER</b> (mindestens eine erfüllt), <b>NICHT</b> (Umkehrung) und <b>XOR</b> (Exklusiv-ODER, genau eine von zwei erfüllt). Die Funktionstabelle listet alle Eingangskombinationen und das gewünschte Ergebnis – bei n Eingängen sind es 2ⁿ Zeilen, bei zwei Eingängen also vier.</p><p>Die Tabelle ist die Spezifikation: Sie füllen sie <b>vor</b> dem Programmieren aus und prüfen danach am Zwilling Zeile für Zeile. So fällt auf, wenn eine Kombination vergessen wurde.</p>"},{"t":"FUP und KOP nach DIN EN 61131-3","h":"<p>Die DIN EN 61131-3 definiert die Programmiersprachen der SPS. <b>KOP</b> (Kontaktplan) stammt vom Stromlaufplan: Kontakte liegen in Strompfaden, am Ende steht eine Spule. <b>FUP</b> (Funktionsplan) stammt vom Logikplan: Verknüpfungsboxen mit Eingängen links und Ausgang rechts. Beide erzeugen dasselbe Programm, TIA kann zwischen ihnen umschalten.</p><p>KOP ist bei Elektrikern beliebt, weil es dem vertrauten Schaltplan gleicht; FUP ist bei vielen verschachtelten Verknüpfungen oft übersichtlicher. Leiten Sie selbst ab, welcher Verknüpfung Reihen- und Parallelschaltung von Kontakten entsprechen.</p>"},{"t":"Negation im Programm ist kein Öffner in der Hardware","h":"<p>Der KOP-Kontakt mit Schrägstrich heißt in TIA „Öffner“, bedeutet aber nur: <b>Abfrage auf 0</b>. Ob das Gerät im Feld ein Schließer oder ein Öffner ist, hat damit nichts zu tun. Es gibt also zwei Ebenen: die Kontaktart der Hardware (aus L01) und die Abfrage im Programm. Wer beides vermischt, programmiert schnell eine doppelte Verneinung oder schaltet eine Leuchte genau verkehrt.</p><p>Beschreiben Sie deshalb Bedingungen fachlich („Füllhöhe nicht in Ordnung“) und entscheiden Sie erst danach anhand des Signalpegels, ob die Abfrage auf 1 oder auf 0 lautet.</p>"},{"t":"Lampentest","h":"<p>Eine Meldeleuchte mit defektem Leuchtmittel sieht genauso aus wie „keine Meldung“. Bei einer Störmeldung ist das gefährlich: Der Bediener hält die Anlage für in Ordnung. Der Lampentest schaltet auf Tastendruck alle Leuchten ein, damit ein Ausfall sofort auffällt. In der Praxis wird er bei Schichtbeginn oder nach Wartungsarbeiten betätigt.</p><p>Der Lampentest wird mit ODER zur eigentlichen Bedingung hinzugefügt. Er überschreibt nichts dauerhaft: Nach dem Loslassen muss wieder der echte Zustand sichtbar sein.</p>"},{"t":"Eine Schreibstelle je Ausgang","h":"<p>Wird ein Ausgang an zwei Stellen im Programm zugewiesen, gewinnt die letzte Zuweisung im Zyklus; die erste ist wirkungslos. Das fällt oft erst auf, wenn eine Bedingung „manchmal nicht funktioniert“, und ist bei der Fehlersuche schwer zu finden, weil die Querverweisliste zwei Stellen zeigt. Der Siemens-Programmierleitfaden empfiehlt deshalb: jeder Ausgang genau eine Schreibstelle, alle Bedingungen dort zusammengefasst.</p><pre class=\"code\"><code>// Prinzip: eine Zuweisung, alle Gründe darin\n#outLamp := #condition OR #lampTest;</code></pre>"},{"t":"Endlagen-Plausibilität mit XOR","h":"<p>Ein Zylinder mit zwei Endlagensensoren kann nicht gleichzeitig in beiden Endlagen sein. Melden beide 1, ist ein Sensor verstellt, defekt oder falsch verdrahtet. Melden beide 0, steht der Zylinder entweder dazwischen – während der Bewegung normal – oder ein Sensor ist ausgefallen. Die beiden Signale sollen also <b>antivalent</b> sein, und genau das prüft XOR.</p><p>Eine Plausibilitätsprüfung erkennt Sensorfehler, bevor sie zu einer falschen Freigabe oder einer Kollision führen. Damit sie während der normalen Bewegung keinen Fehlalarm auslöst, braucht sie eine zeitliche Toleranz – die ergänzen Sie in L04.</p>"}]},"L03":{"beschr":"<p><b>Ausgangslage:</b> Der Zwilling steht auf <i>Verzinnen: Portal = SPS</i>, alles andere läuft automatisch. Ihr Programm schaltet weiterhin nur Meldeleuchten. Neu ist, dass sich das Programm etwas <b>merken</b> muss: Der Bediener tippt START −SF1 nur kurz an, die Betriebsbereitschaft −PF1 soll aber bestehen bleiben. Und eine Verletzung des Lichtvorhangs −BG20 dauert oft nur eine Sekunde, die Meldung dazu soll aber stehen bleiben, bis jemand sie bewusst quittiert.</p><p><b>Vorgaben:</b> Ein FB <code>Operation</code> mit Instanz-DB und Bausteinkopf. Zustände liegen als statische Variablen im FB (<code>#statReady</code>, <code>#statMsgLightCurtain</code>), Flankenauswertungen als Multiinstanzen (z. B. <code>#instStartTrig</code>). Globale Merker verwenden Sie nicht.</p><p><b>Soll-Verhalten Betriebsbereitschaft:</b></p><ol><li>Eine steigende Flanke an −SF1 setzt <code>#statReady</code>; −PF1 zeigt den Zustand.</li><li>STOP −SF2 (Öffner), fehlende Freigabe −KF2 oder eine anstehende Meldung setzen zurück. Zurücksetzen hat Vorrang vor Setzen.</li><li>Wiederanlaufsperre: Wer nach einem Not-Halt START gedrückt hält und dann quittiert, darf die Anlage nicht einschalten. Erst ein neuer Tastendruck schaltet ein.</li></ol><p><b>Soll-Verhalten Meldung Lichtvorhang:</b></p><ol><li>Fällt −BG20 „Schutzfeld frei“ ab (fallende Flanke), wird <code>#statMsgLightCurtain</code> gesetzt, der Leuchttaster −PF5 leuchtet als Quittieraufforderung (blinken lassen Sie ihn in L04).</li><li>Die Meldung bleibt, auch wenn das Schutzfeld wieder frei ist.</li><li>Zurückgesetzt wird nur durch eine steigende Flanke an −SF4 <b>und</b> bei freiem Schutzfeld. Quittieren bei noch unterbrochenem Feld bleibt wirkungslos.</li></ol><p>Beachten Sie: Ein Eingriff in −BG20 schaltet über −KF2 ohnehin hart ab. Ihre Meldung ist reine Diagnose – sie sagt dem Bediener, <b>warum</b> die Anlage stand. Für das Blinken genügt vorerst eine einfache Lösung im FB; einen Taktmerker der CPU verwenden Sie nicht. Den sauberen Taktgeber-FB <code>Clock</code> bauen Sie in L04.</p><p><b>Zum Vergleich</b> bauen Sie die Betriebsbereitschaft einmal als klassische Selbsthaltung in KOP mit Parallelkontakt am Ausgang. Der Vergleich ist Teil der Abgabe; im FB bleibt nur eine Lösung aktiv, damit −PF1 genau eine Schreibstelle hat.</p><p><b>Abzugeben:</b> FB <code>Operation</code>, die KOP-Selbsthaltung als Vergleich, ein Prüfprotokoll zu allen sechs Prüfpunkten und Ihre Antworten auf die Leitfragen. <b>Erfolg</b> heißt: Alle Prüfpunkte gelingen reproduzierbar, insbesondere Wiederanlaufsperre und Drahtbruch an −SF2, und Sie können für jede Entscheidung (Flanke, Dominanz, Öffner) den Grund nennen.</p>","wissen":[{"t":"Warum speichern – und wo","h":"<p>Ein Taster liefert nur so lange 1, wie er gedrückt wird. Soll ein Zustand länger dauern als der Tastendruck, muss das Programm ihn speichern: Der Wert muss von einem Zyklus in den nächsten überleben. Temporäre Variablen (<code>#temp…</code>) können das nicht, ihr Inhalt ist zu Beginn jedes Aufrufs undefiniert.</p><p>Der Siemens-Programmierleitfaden empfiehlt statische Variablen im FB statt globaler Merker. Gründe: Der FB ist mehrfach verwendbar (jede Instanz hat eigene Daten), niemand anderes kann den Zustand versehentlich überschreiben, und in der Querverweisliste bleibt klar, wer den Wert setzt. Ein Merker gehört dagegen allen – und wird deshalb früher oder später von zwei Stellen beschrieben.</p>"},{"t":"Setz- und rücksetzdominant – und die Namensfalle","h":"<p>Kommen Setz- und Rücksetzbedingung im selben Zyklus, muss feststehen, welche gewinnt. Bei Maschinen ist das fast immer das <b>Rücksetzen</b>: Wer gleichzeitig START und STOP drückt oder wenn bei einem START eine Störung ansteht, muss die Anlage aus bleiben. Ein setzdominanter Speicher würde in dieser Lage einschalten – ein Sicherheitsrisiko.</p><p><b>Achtung:</b> Die Bezeichnungen RS und SR sind nicht einheitlich. In den Funktionsbausteinen der DIN EN 61131-3 ist RS rücksetz- und SR setzdominant. Die KOP/FUP-Boxen in TIA folgen der alten STEP-7-Konvention: Dort trägt der dominante Eingang die 1 (<code>R1</code> bzw. <code>S1</code>) und steht unten in der Box. Verlassen Sie sich deshalb nicht auf den Namen, sondern prüfen Sie in der Online-Hilfe und im Test, welcher Eingang Vorrang hat.</p>"},{"t":"Selbsthaltung","h":"<p>Die Selbsthaltung stammt aus der Schütztechnik: Ein Hilfskontakt des Schützes liegt parallel zum START-Taster und hält die Spule nach dem Loslassen selbst. Der STOP-Kontakt liegt in Reihe davor und unterbricht den ganzen Pfad. Weil STOP vor der Parallelschaltung sitzt, ist die Selbsthaltung von Natur aus rücksetzdominant.</p><p>In KOP lässt sich das eins zu eins nachbilden. Im FB mit statischen Variablen ist der Speicher aber meist klarer zu lesen, und Flanken lassen sich sauber davor schalten.</p>"},{"t":"Flanken: R_TRIG und F_TRIG","h":"<p>Eine Flanke ist der Wechsel eines Signals: steigend von 0 auf 1, fallend von 1 auf 0. R_TRIG und F_TRIG liefern dafür genau einen Zyklus lang 1. Dazu merken sie sich den Signalzustand des letzten Zyklus in ihrer Instanz – deshalb gehören sie als Multiinstanz in den FB und müssen in jedem Zyklus aufgerufen werden.</p><pre class=\"code\"><code>#instStartTrig(CLK := #startButton);\nIF #instStartTrig.Q THEN\n  // genau ein Zyklus pro Tastendruck\nEND_IF;</code></pre><p>Mit Flanken werden Befehle ausgewertet, die genau einmal wirken sollen: START, Quittieren, „Korb kommt an“. Ein gedrückt gehaltener Taster erzeugt keine neue Flanke – das ist die Grundlage der Wiederanlaufsperre.</p>"},{"t":"Wiederanlaufsperre","h":"<p>Nach einem Not-Halt, einem Schutzfeldeingriff oder einem Spannungsausfall darf eine Maschine nicht von selbst wieder anlaufen. Die DIN EN ISO 13850 fordert, dass das Rücksetzen des Not-Halts allein keinen Wiederanlauf auslöst; die DIN EN 60204-1 verlangt Schutz gegen unerwarteten Anlauf. Es braucht also einen <b>neuen, bewussten</b> Startbefehl.</p><p>Würde das Programm den Pegel von START auswerten, liefe die Anlage an, sobald −KF2 nach dem Quittieren wieder frei meldet – während der Bediener noch START drückt oder der Taster klemmt. Die harte Abschaltung macht −KF2; die Wiederanlaufsperre im Programm sorgt dafür, dass die Anlage danach nicht überraschend weiterfährt.</p>"},{"t":"Meldung mit Quittierpflicht und Öffner am Rücksetzen","h":"<p>Viele Störungen sind flüchtig: Der Arm ist nach einer Sekunde aus dem Lichtvorhang, der Sensor flackert nur kurz. Eine Meldung, die mit der Ursache verschwindet, sieht niemand. Deshalb wird sie gespeichert und muss quittiert werden. Gängige Konvention: <b>blinkend</b> = neu und nicht quittiert, <b>dauernd</b> = quittiert, Ursache steht noch an. Quittieren wirkt nur auf die Flanke, damit ein klemmender Taster nicht jede neue Meldung sofort löscht, und nur bei beseitigter Ursache.</p><p>STOP −SF2 ist ein Öffner: unbetätigt 1, betätigt oder bei Drahtbruch 0. Der Rücksetzeingang eines Speichers braucht aber 1, um zurückzusetzen. Überlegen Sie, wie die Abfrage am Rücksetzeingang lauten muss und wie sie sich von der Abfrage in einer Selbsthaltung (STOP in Reihe) unterscheidet – und prüfen Sie beides mit −SF2 = 0 im Signalmonitor.</p>"}]},"L04":{"beschr":"<p><b>Ausgangslage:</b> Der Zwilling steht auf <i>Verzinnen: Portal = SPS</i>, alles andere läuft automatisch: Körbe kommen am Anschlag an und fahren wieder ab, das Zinnbad wird auf Temperatur gehalten, der Anschlag −MM5 öffnet und schließt selbst. Ihr Programm wertet diese Signale aus und schaltet Meldeleuchten – jetzt mit Zeitverhalten. Zeiten sind die Grundlage jeder Ablaufsteuerung: Tauchzeit, Abtropfzeit und Überwachungszeiten in späteren Übungen arbeiten genau so.</p><p><b>Vorgaben:</b> Alle Zeiten sind IEC-Zeiten (TON, TOF, TP) als Multiinstanz in Ihrem FB (z. B. <code>#instBathReadyDelay</code>). Der Blinker wird ein eigener FB <code>Clock</code> mit dem Eingang <code>frequency</code>, der intern mit zwei TON arbeitet. Der Lampentest aus L02 bleibt erhalten.</p><p><b>Soll-Verhalten:</b></p><ol><li>−PF2 „Bad bereit“ geht erst an, wenn −BG9 und −BG10 seit 3 s ununterbrochen anstehen. Fällt eines davon weg, geht −PF2 sofort aus, und die 3 s beginnen von vorn.</li><li>−PF4 leuchtet nach dem Abtransport des Korbs (−BG40 fällt ab) noch 5 s nach.</li><li>Der Lampentest aus L02 wird zum Impuls: Ein Druck auf −SF4 lässt alle Meldeleuchten genau 2 s leuchten, gleich wie lange der Taster gehalten wird.</li><li>−PF3 blinkt bei fehlender Füllhöhe gleichmäßig 0,5 s an / 0,5 s aus.</li><li>Endlagen-Plausibilität −MM5 aus L02: Meldet keine Endlage länger als 2 s, wird eine Störung gespeichert. Beide Endlagen gleichzeitig sind sofort unplausibel.</li></ol><p><b>Randfälle:</b> Ein Flackern von −BG9 unter 3 s darf −PF2 nicht einschalten. Kommt während des Nachleuchtens von −PF4 ein neuer Korb, bleibt die Leuchte durchgehend an. Ein zweiter Druck auf −SF4 während des laufenden Impulses verlängert ihn nicht. Jede Meldeleuchte behält dabei genau eine Schreibstelle: Der Impuls wird in die vorhandene Zuweisung ODER-verknüpft, nicht in einem zweiten Netzwerk zugewiesen.</p><p><b>Abzugeben:</b> FB mit allen Zeiten, FB <code>Clock</code>, je ein Impulsdiagramm für TON, TOF und TP (Vorlage <i>Trend</i> unter <i>Planen</i>) mit eingetragenem PT, ein Prüfprotokoll zu den Prüfpunkten und Ihre Antworten auf die Leitfragen.</p><p><b>Erfolg</b> heißt: Jeder Prüfpunkt lässt sich durch Forcen im Signalmonitor zeigen, die gemessenen Zeiten stimmen mit den Vorgaben überein, und Ihre Impulsdiagramme passen zu dem, was Sie am Zwilling beobachten. Die Störung der −MM5-Plausibilität erscheint erst nach Ablauf der Toleranzzeit, nicht während einer normalen Bewegung.</p>","wissen":[{"t":"IEC-Zeiten als Multiinstanz","h":"<p>Eine IEC-Zeit ist ein Funktionsbaustein mit den Eingängen <code>IN</code> (Start) und <code>PT</code> (Vorgabezeit, Datentyp Time, z. B. <code>T#3S</code>) sowie den Ausgängen <code>Q</code> und <code>ET</code> (abgelaufene Zeit). Sie braucht eigene Daten, um sich Startzeitpunkt und Zustand zu merken. Als Multiinstanz liegen diese Daten im Instanz-DB Ihres FB – der FB bleibt in sich geschlossen und mehrfach verwendbar, es entstehen keine verstreuten Einzel-DBs.</p><pre class=\"code\"><code>#instDelay(IN := #condition, PT := T#3S);\n#delayedCondition := #instDelay.Q;</code></pre><p>Wichtig: Eine Zeit aktualisiert sich nur, wenn sie aufgerufen wird. Rufen Sie sie deshalb in jedem Zyklus auf, nicht innerhalb einer IF-Bedingung – sonst „friert“ sie ein und läuft nie ab.</p>"},{"t":"TON zum Entprellen und Beruhigen","h":"<p>Sensoren melden nicht immer sauber: Mechanische Kontakte prellen im Millisekundenbereich, eine Niveauelektrode flackert bei Wellen auf der Badoberfläche, ein Temperaturschalter schaltet an der Grenze mehrfach hin und her. Ein TON lässt das Signal erst durch, wenn es die Vorgabezeit ununterbrochen ansteht; jede Unterbrechung startet die Zeit neu.</p><p>Der TON verzögert nur das Einschalten, das Ausschalten geht sofort durch. Das ist bewusst die sichere Richtung: „Bad bereit“ wird vorsichtig gemeldet, aber sofort zurückgenommen. Die Zeit wählen Sie so lang, dass Störungen sicher unterdrückt werden, und so kurz, dass der Ablauf nicht unnötig wartet.</p>"},{"t":"TOF und TP","h":"<p>Der <b>TOF</b> (Ausschaltverzögerung) setzt Q sofort mit IN und hält Q nach der fallenden Flanke von IN noch PT lang. Typisch: Nachlauf eines Bandes, Nachleuchten einer Anzeige, Überbrücken einer Lücke zwischen zwei Lichtschranken. Kommt IN während der Nachlaufzeit wieder, bleibt Q durchgehend 1.</p><p>Der <b>TP</b> (Impuls) erzeugt ab der steigenden Flanke einen Impuls fester Länge, unabhängig davon, wie lange IN ansteht, und lässt sich während des Impulses nicht nachtriggern. Typisch: Auslöseimpuls für eine Kamera, Ausblasimpuls einer Düse – überall dort, wo die Dauer vom Prozess bestimmt wird, nicht vom Bediener.</p>"},{"t":"ET – die abgelaufene Zeit","h":"<p><code>ET</code> zeigt, wie lange die Zeit schon läuft. Beim TON bleibt ET bei PT stehen. Damit lassen sich Restzeiten am Bedienfeld anzeigen („noch 4 s tauchen“) und Dauern messen: Starten Sie einen TON mit großem PT, lesen Sie ET beim Abschalten ab. So messen Sie in L17 die Fahrzeiten der Zylinder, aus denen Sie die Überwachungszeiten ableiten. ET wird beim nächsten Start zurückgesetzt – wer den Wert behalten will, kopiert ihn vorher in eine statische Variable.</p>"},{"t":"Taktgeber-FB statt Taktmerker","h":"<p>Die CPU bietet in der Gerätekonfiguration ein Taktmerkerbyte mit festen Frequenzen. Der Siemens-Programmierleitfaden rät davon ab: Der Taktmerker ist ein globaler Merker, er läuft asynchron zum Programmzyklus (sein Wert kann sich mitten im Zyklus ändern, zwei Abfragen an verschiedenen Stellen können verschieden ausfallen), er hängt an einer Hardware-Einstellung, die beim Kopieren in ein anderes Projekt fehlen kann, und die Frequenzen sind fest.</p><p>Ein eigener FB <code>Clock</code> mit zwei Zeiten ist dagegen zyklussynchron, portabel und einstellbar. Das Prinzip: Die erste Zeit läuft, solange der Takt aus ist, und schaltet ihn ein; die zweite läuft, solange er an ist, und schaltet ihn wieder aus. Wie Sie aus <code>frequency</code> die Zeiten berechnen, legen Sie selbst fest.</p>"},{"t":"Impulsdiagramm","h":"<p>Ein Impulsdiagramm (Zeitablaufdiagramm) zeigt Eingang und Ausgang übereinander über einer gemeinsamen Zeitachse. Darin lässt sich ablesen, wann Q auf IN reagiert, wie lange PT dauert und was bei kurzen Unterbrechungen passiert. Zeichnen Sie es <b>vor</b> dem Programmieren als Spezifikation und vergleichen Sie es danach mit der Aufzeichnung am Zwilling. Abweichungen zeigen fast immer eine falsch gewählte Zeitart.</p>"}]},"L05":{"beschr":"<p><b>Ausgangslage:</b> Portal und Band laufen automatisch (siehe Einstellung). Körbe kommen auf Band 1 an, werden am Anschlag verzinnt und fahren über Rollenkurve und Band 2 zur Prüfstation, wo die Kamera jeden Kabelschuh als i.O. oder n.i.O. bewertet. Ihr Programm greift nicht in den Ablauf ein, es zählt nur mit – wie eine Betriebsdatenerfassung, die nachträglich an eine laufende Anlage angebaut wird.</p><p><b>Vorgaben:</b> Ein FB (z. B. <code>Counting</code>) mit IEC-Zählern und den nötigen Zeiten als Multiinstanzen. Den Taktgeber <code>Clock</code> und die Meldung mit Quittierung übernehmen Sie aus L03 und L04. Zählerstände beobachten Sie in einer Beobachtungstabelle.</p><p><b>Soll-Verhalten:</b></p><ol><li><b>Tageszähler (CTU):</b> Jeder neue Korb am Anschlag −BG40 zählt genau einmal. Zurückgesetzt wird nur, wenn −SF4 mindestens 3 s gehalten wird; ein kurzer Druck ändert nichts.</li><li><b>Wartungshinweis:</b> Nach je 10 Körben blinkt −PF3 „Zinnstand prüfen“, bis quittiert wird. Danach beginnt die Zählung bis zum nächsten Hinweis von vorn, der Tageszähler läuft unverändert weiter.</li><li><b>Pufferbelegung Band 1 (CTUD):</b> +1, wenn ein Korb −BG12 am Bandanfang erreicht, −1, wenn er −BG11 am Übergabeplatz erreicht. Der Wert ist die Zahl der wartenden Körbe.</li><li><b>Prüfstation:</b> i.O.-Teile (−BG28) und n.i.O.-Teile (−BG29) werden getrennt gezählt. Je Korb sind es 36 Teile.</li></ol><p><b>Randfälle und Fehlerfälle:</b></p><ul><li>−SF4 ist Quittier- und Rücksetztaste zugleich. Legen Sie eindeutig fest, wann ein Druck quittiert und wann er den Tageszähler zurücksetzt, und begründen Sie das.</li><li>Steht beim Start Ihres Programms schon ein Korb auf Band 1, stimmt die Pufferbelegung nicht. Die Belegung darf nie negativ angezeigt werden.</li><li>Die Kameraergebnisse stehen nur 0,3 s an. Prüfen Sie, ob Ihr Zähler jeden Impuls erfasst.</li><li>Nach STOP/RUN der CPU und nach erneutem Laden: Welche Zählerstände sollen erhalten bleiben, welche nicht?</li></ul><p><b>Abzugeben:</b> der FB, eine Beobachtungstabelle mit allen Zählerständen, ein Prüfprotokoll zu den Prüfpunkten (Zahl der durchgelaufenen Körbe gegen Zählerstand), eine kurze Begründung Ihrer Remanenz-Entscheidungen und die Antworten auf die Leitfragen.</p><p><b>Erfolg</b> heißt: Nach fünf durchgelaufenen Körben zeigt der Tageszähler 5, die Pufferbelegung stimmt mit der Zahl der Körbe auf Band 1 überein, i.O. und n.i.O. ergeben je Korb zusammen 36, und der Reset funktioniert nur mit langem Tastendruck.</p>","wissen":[{"t":"IEC-Zähler CTU, CTD und CTUD","h":"<p>Ein <b>CTU</b> zählt bei jeder steigenden Flanke an CU um eins hoch; <code>CV</code> ist der aktuelle Stand, <code>Q</code> wird 1, sobald CV ≥ PV. <code>R</code> setzt auf 0 zurück. Ein <b>CTD</b> zählt rückwärts, <code>LD</code> lädt PV als Startwert, Q meldet CV ≤ 0. Der <b>CTUD</b> kann beides und eignet sich für Bilanzen: hinein und heraus. Wie Zeiten sind Zähler Funktionsbausteine und gehören als Multiinstanz in den FB. Den Datentyp (z. B. Int oder DInt) wählen Sie nach dem größten zu erwartenden Zählerstand.</p>"},{"t":"Zählen braucht Flanken","h":"<p>Ein Signal steht viele Zyklen lang an: Ein Korb deckt eine Lichtschranke mehrere Sekunden ab, bei 10 ms Zykluszeit sind das Hunderte Zyklen. Wer pro Zyklus „+1“ rechnet, zählt also nicht Körbe, sondern Zyklen. Gezählt werden muss der <b>Wechsel</b> des Signals.</p><p>Die IEC-Zähler in TIA werten die Flanke an CU intern aus: Sie merken sich den Zustand des letzten Aufrufs. Das funktioniert nur, wenn der Zähler in jedem Zyklus aufgerufen wird. Wer dagegen selbst rechnet, braucht eine Flankenauswertung davor:</p><pre class=\"code\"><code>#instPartEdge(CLK := #partSignal);\nIF #instPartEdge.Q THEN\n  #statParts := #statParts + 1;\nEND_IF;</code></pre>"},{"t":"Kurze Impulse sicher erfassen","h":"<p>Die Kamera meldet ihr Ergebnis nur 0,3 s lang. Eine SPS sieht einen Eingang nur zu Beginn jedes Zyklus. Ist der Impuls kürzer als die Zykluszeit, kann er zwischen zwei Abfragen liegen und verloren gehen. Bei 10 ms Zykluszeit ist das hier unkritisch, bei langen Zyklen, Programmen mit Wartezeiten oder sehr kurzen Impulsen aber ein echtes Problem. Dann helfen Alarmeingänge, schnelle Zähler oder ein Taktsynchronbetrieb. Faustregel: Der Impuls sollte mindestens doppelt so lang sein wie die längste Zykluszeit.</p>"},{"t":"Remanenz und Neustart","h":"<p>Nach dem Wiederanlauf der CPU beginnen nicht remanente Variablen mit ihrem Startwert. Ein Tageszähler wäre nach jedem Spannungsausfall auf 0. In TIA markieren Sie Variablen in der Schnittstelle des FB als <i>Remanent</i> (bei Multiinstanzen auf Ebene des übergeordneten FB); remanente Daten überstehen Netz-Aus. Beim Laden mit Reinitialisierung werden aber auch sie zurückgesetzt.</p><p>Remanenz ist keine Pflicht, sondern eine fachliche Entscheidung: Ein Produktionszähler soll erhalten bleiben. Bei einer Belegung, die sich während der Stillstandszeit ändern kann (jemand nimmt einen Korb vom Band), ist ein alter Wert nach dem Neustart womöglich falscher als ein Neuanfang mit Abgleich.</p>"},{"t":"Bilanzzähler und Plausibilität","h":"<p>Eine Belegung aus „hinein minus heraus“ stimmt nur, solange kein Ereignis verloren geht. In der Praxis passiert das: Ein Korb wird von Hand entnommen, eine Lichtschranke flackert und liefert zwei Flanken, das Programm startet bei schon belegtem Band. Der Fehler bleibt dann für immer im Zählerstand. Deshalb begrenzt man Bilanzzähler auf sinnvolle Werte (nicht unter 0, nicht über die Platzzahl), entprellt die Sensoren (L04) und sieht einen Abgleich vor, z. B. „Band leer erkannt → Belegung 0“.</p>"},{"t":"Langer Tastendruck als Schutz","h":"<p>Ein Zählerstand, der versehentlich gelöscht wird, ist verloren. Wird für das Rücksetzen ein Taster mit anderer Hauptfunktion verwendet (hier Quittieren), verlangt man einen langen Druck: Ein normales Quittieren dauert weniger als eine Sekunde, wer 3 s hält, will bewusst etwas anderes. Umgesetzt wird das mit einem TON auf den Tasterpegel. Legen Sie dabei fest, ob die Funktion beim Erreichen der Zeit oder erst beim Loslassen auslöst und ob ein langer Druck zusätzlich als Quittieren zählt – beides muss im Bedienkonzept eindeutig sein.</p>"}]},"L06":{"beschr":"<p><b>Ausgangslage:</b> Der Zwilling steht auf <i>Verzinnen: Portal = SPS</i>, alles andere läuft automatisch; der Regler am Bad hält das Zinn auf Temperatur. Bisher kannten Sie nur den Schalter −BG9, der ab 250 °C meldet. Für die Qualität der Verzinnung zählt aber, ob das Zinn wirklich zwischen 270 und 290 °C liegt. Diese Information liefert nur der Analogwert −BT1 (%IW64): eine ganze Zahl von 0 bis 27648 für 0 bis 400 °C. Ebenso liefert −BL1 (%IW66) den Füllstand 0 bis 100 %. Ihr Programm rechnet beide Werte selbst um und vergleicht sie.</p><p><b>Vorgaben:</b> Ein FB (z. B. <code>BathMonitor</code>) mit Bausteinkopf. Variablen mit Präfix und sprechendem Namen, Konstanten wie 27648 und 400 als benannte Konstanten in GROSSBUCHSTABEN statt als Zahlen im Code. Den Korbzähler übernehmen Sie aus L05.</p><p><b>Soll-Verhalten:</b></p><ol><li>Der Rohwert von −BT1 wird in eine Int-Variable gelesen und beobachtet.</li><li>Die Umrechnung in °C erfolgt in drei Varianten: zuerst bewusst in Int, um den Fehler zu sehen, dann richtig in DInt und in Real. Alle drei Ergebnisse stehen nebeneinander in der Beobachtungstabelle.</li><li>−PF2 leuchtet nur, wenn 270 °C ≤ Temperatur ≤ 290 °C – mit IN_RANGE oder zwei Vergleichern.</li><li>−PF3 „Zinnstand niedrig“ leuchtet, wenn −BL1 unter 40 % liegt. Vergleichen Sie das Verhalten mit dem Schalter −BG10 und dokumentieren Sie Unterschiede.</li><li>Aus dem Korbzähler wird die Zahl der verzinnten Kabelschuhe berechnet (36 je Korb).</li></ol><p><b>Randfälle und Fehlerfälle:</b> Testen Sie mit geforcten Rohwerten, auch an den Grenzen genau bei 270 und 290 °C und knapp daneben. Überlegen Sie, was ein Rohwert über 27648 oder unter 0 bedeutet. Achten Sie darauf, dass −PF2 und −PF3 weiterhin nur eine Schreibstelle haben; die Bedingungen aus L02 und L04 ersetzen oder ergänzen Sie bewusst. Prüfen Sie, ob der Datentyp der Kabelschuhzahl auch nach vielen Tagen Produktion noch reicht.</p><p><b>Abzugeben:</b> der FB, eine Beobachtungstabelle mit Rohwert und den drei Umrechnungen, eine kurze Tabelle mit Ihren Testwerten (Rohwert, erwartete und angezeigte Temperatur), der dokumentierte Vergleich −BL1 gegen −BG10 und die Antworten auf die Leitfragen.</p><p><b>Erfolg</b> heißt: Ein geforcter Rohwert von 13824 ergibt 200 °C, die Int-Variante zeigt nachvollziehbar den Überlauf, DInt und Real rechnen richtig, −PF2 reagiert genau an den Bereichsgrenzen, und Sie können begründen, welchen Datentyp Sie für welche Größe gewählt haben.</p>","wissen":[{"t":"Analogwert 0 bis 27648","h":"<p>Eine Analogbaugruppe wandelt eine Spannung oder einen Strom (z. B. 4–20 mA vom Messumformer) in eine ganze Zahl um. Bei Siemens entspricht der Nennbereich 0 bis 27648. Der Rest bis 32767 bleibt bewusst frei: Werte bis 32511 zeigen einen Übersteuerungsbereich an (Messwert über dem Nennbereich, aber noch auswertbar), 32767 bedeutet Überlauf, bei 4–20 mA auch Drahtbruch. Negative Werte stehen für Untersteuerung. Ein Programm, das blind umrechnet, zeigt bei Drahtbruch eine plausible, aber falsche Temperatur – deshalb gehört eine Bereichsprüfung des Rohwerts zur Auswertung.</p><p>Die Umrechnung ist eine Geradengleichung: Rohwert 0 entspricht dem Messbereichsanfang, 27648 dem Messbereichsende.</p>"},{"t":"Datentypen und Wertebereiche","h":"<p><b>Int</b> hat 16 Bit (−32768 bis 32767), <b>DInt</b> 32 Bit (rund ± 2,1 Milliarden). <b>Real</b> ist eine 32-Bit-Gleitkommazahl nach IEEE 754 mit etwa sieben gültigen Stellen, <b>LReal</b> hat 64 Bit und etwa 15 Stellen. <b>Time</b> speichert eine Dauer in Millisekunden. Der Datentyp wird nach zwei Fragen gewählt: Wie groß kann der Wert werden – auch Zwischenergebnisse? Wie genau muss er sein? Größere Typen kosten Speicher und bei manchen CPUs Rechenzeit, sind aber bei der S7-1500 kaum spürbar. Ein zu kleiner Typ dagegen führt zu falschen Ergebnissen ohne Fehlermeldung.</p>"},{"t":"Überlauf und Ganzzahldivision","h":"<p>Überschreitet ein Ergebnis den Wertebereich, läuft es über: Die Zahl springt auf einen ganz anderen, oft negativen Wert. In FUP und KOP zeigt der Ausgang ENO = 0 den Fehler an, das Ergebnis wird trotzdem geschrieben. Bei der Ganzzahldivision wird außerdem der Rest abgeschnitten, nicht gerundet. Daraus folgt die Regel: erst multiplizieren, dann dividieren – sonst geht die Genauigkeit verloren. Dafür muss der Datentyp groß genug für das Zwischenergebnis sein. Den Typ wechseln Sie mit einer expliziten Konvertierung:</p><pre class=\"code\"><code>// Beispiel Bandweg: 24,5 mm je Geberimpuls\n#lengthMm := INT_TO_DINT(#pulses) * 245 / 10;</code></pre>"},{"t":"Real-Werte nie auf Gleichheit vergleichen","h":"<p>Gleitkommazahlen werden binär gespeichert. Viele Dezimalzahlen wie 0,1 lassen sich darin nicht exakt darstellen, jede Rechnung erzeugt kleine Rundungsfehler. Ein Ergebnis, das rechnerisch 280,0 sein müsste, kann 279,99998 sein – ein Vergleich auf Gleichheit schlägt dann fehl, obwohl der Wert fachlich stimmt. Real-Werte vergleicht man deshalb mit größer/kleiner, mit Bereichen oder mit einer Toleranz:</p><pre class=\"code\"><code>#isEqual := ABS(#valueA - #valueB) &lt; 0.01;</code></pre>"},{"t":"Festkomma oder Gleitkomma","h":"<p>Statt in Real kann man in einer kleineren Einheit ganzzahlig rechnen, z. B. Temperatur in Zehntelgrad als DInt (2817 statt 281,7 °C). Vorteile: exakte Vergleiche, keine Rundungsfehler bei Summen, gleiches Verhalten auf allen Steuerungen. Nachteile: Die Einheit muss überall bekannt sein, und Division sowie Skalierung erfordern Sorgfalt. Real ist bequemer, wenn mit Faktoren, Regelalgorithmen oder Bausteinen wie <code>SCALE_X</code> und <code>PID_Compact</code> gerechnet wird, die Real erwarten. Entscheidend ist eine bewusste Wahl, die im Variablennamen oder Kommentar dokumentiert ist.</p>"},{"t":"Bereichsvergleich, Grenzwerte und Plausibilität","h":"<p><code>IN_RANGE</code> prüft MIN ≤ VAL ≤ MAX, die Grenzen gehören also dazu. Ein Analogwert schwankt leicht; liegt er genau an einer Grenze, flackert die Meldung. Abhilfe schafft eine Hysterese (verschiedene Ein- und Ausschaltgrenzen) oder eine Zeit wie in L04.</p><p>Ein Grenzschalter wie −BG9 oder −BG10 und ein Analogwert messen dieselbe Größe auf verschiedene Weise. Das ist gewollt: Zwei unabhängige Messungen lassen sich gegeneinander prüfen. Widersprechen sie sich dauerhaft, ist eine der beiden gestört. Diese Diversität nutzen Sie in späteren Übungen zur Messwertüberwachung.</p>"}]},"L07":{"beschr":"<p>Bisher haben Sie einzelne Verknüpfungen, Speicher, Zeiten und Zähler geübt. Jetzt entsteht der erste Baustein, den die spätere Ablaufsteuerung wirklich braucht: ein FC <code>StartRelease</code>, der zwei Fragen beantwortet – „Steht das Portal in Grundstellung?“ und „Darf die Anlage überhaupt starten?“. Der Zwilling läuft mit <i>Verzinnen: Portal = SPS</i>. Ihr Programm schaltet in dieser Übung noch keine Ventile, es wertet nur Eingänge aus und steuert Meldeleuchten. Beide Ergebnisse brauchen Sie später wieder: in L10 als Bedingung für die Betriebsart AUTO und in L12 als Startbedingung des Initialschritts.</p><p>Am Ende soll Folgendes funktionieren:</p><ul><li><code>#homePosition</code> ist genau dann 1, wenn alle vier Portalzylinder ihre Grundstellung melden: −MM1 gelöst, −MM2 abgesenkt, −MM3 über dem Band, −MM4 Bad abgedeckt. Die zugehörigen Sensoren entnehmen Sie der Signalliste bzw. Ihren Notizen aus L01.</li><li><code>#readyToStart</code> fasst Grundstellung, Prozessbedingungen (Temperatur −BG9, Füllhöhe −BG10) und die Freigabe des Sicherheitsrelais −KF2 zusammen. Fällt eine Bedingung weg, fällt der Ausgang im selben Zyklus weg – hier wird nichts gespeichert.</li><li>−PF2 zeigt „Temperatur ok“, −PF3 zeigt „Füllhöhe <b>unterschritten</b>“ (Negation des Sensors), −PF4 zeigt „Korb vorhanden“ über −BG40.</li></ul><p>Denken Sie an die Randfälle: Ein Zylinder, der gerade fährt, meldet keine seiner Endlagen. Ein defekter Sensor kann dauerhaft 0 liefern. Das Sicherheitsrelais kann jederzeit abfallen. In allen Fällen muss die Freigabe auf der sicheren Seite liegen, also 0 sein. Überlegen Sie außerdem, ob −BG40 in die Freigabe gehört oder nur in die Startbedingung des ersten Schritts (Leitfrage 2) – und notieren Sie Ihre Begründung.</p><p>Zum Testen: Der Handbetrieb kommt erst in L08. Statt die Zylinder zu fahren, forcen Sie im Signalmonitor des Zwillings jede Grundstellungs-Endlage einzeln auf 0 – so simulieren Sie einen Zylinder, der nicht in Grundstellung steht. Prüfen Sie jede Bedingung einzeln: Immer nur eine Bedingung wegnehmen, Wirkung beobachten, zurücksetzen.</p><p>Abzugeben sind:</p><ul><li>das Programm: FC mit Bausteinkopf (Zweck, Autor, Version), Netzwerke mit Titel und Kommentar, ausschließlich symbolische Zugriffe,</li><li>die Funktionstabelle der Freigabe (sinnvoll verkürzt) und die Verknüpfung als FUP-Skizze,</li><li>ein kurzes Testprotokoll zu allen Prüfpunkten mit Ihrem beobachteten Ergebnis.</li></ul><p>Erfolgreich ist die Übung, wenn jeder Prüfpunkt am Zwilling nachvollziehbar erfüllt ist und Sie die Leitfragen fachlich begründen können – nicht nur „es funktioniert“, sondern „warum es so richtig ist“.</p>","wissen":[{"t":"Grundstellung – warum ein definierter Ausgangszustand","h":"<p>Die Grundstellung ist die Lage aller Antriebe, aus der ein Automatikablauf sicher beginnen kann. Eine Schrittkette geht davon aus, dass ihr erster Schritt eine bekannte Lage vorfindet; steht ein Zylinder woanders, passen die Weiterschaltbedingungen nicht mehr zur Wirklichkeit, und der Ablauf hängt oder fährt in eine Kollision.</p><p>Die Grundstellung wird immer über die <b>gemeldeten Endlagen</b> geprüft, nicht über den zuletzt gegebenen Befehl. Nur der Sensor bestätigt, dass der Zylinder tatsächlich angekommen ist – ein Befehl sagt nur, was gewollt war. Nicht jeder Antrieb hat eine feste Grundstellung: Der Anschlag −MM5 steht je nach Korblage offen oder geschlossen und gehört deshalb nicht in <code>#homePosition</code>.</p>"},{"t":"Freigabe und Startbedingung – zwei verschiedene Dinge","h":"<p>Eine <b>Freigabe</b> ist eine Dauervoraussetzung: Solange sie fehlt, darf die Anlage nicht arbeiten, und fällt sie im Betrieb weg, muss das Programm reagieren. Typisch sind Sicherheitsrelais, Temperatur und Füllhöhe.</p><p>Eine <b>Startbedingung</b> wird nur einmal geprüft – beim Übergang aus dem Initialschritt in den ersten Arbeitsschritt (GRAFCET-Transition, L12). Wer eine Startbedingung in die Freigabe packt, erzeugt Fehler, die erst im Ablauf auffallen: Ein Signal, das sich während des Zyklus planmäßig ändert, würde die Anlage mitten im Ablauf stoppen. Prüfen Sie für jedes Signal: Muss es während des ganzen Zyklus anstehen oder nur beim Start?</p>"},{"t":"Drahtbruchsichere Sensoren und Negation bei Meldeleuchten","h":"<p>−BG9 und −BG10 melden 1, wenn alles in Ordnung ist. Das ist Absicht: Bricht ein Draht oder fällt der Sensor aus, liest die SPS 0 – und
