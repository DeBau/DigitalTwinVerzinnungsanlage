 Korb, der bewusst an −BG24 wartet, ist keine Störung.</p>"},{"t":"Motorschutz und Stau vermeiden","h":"<p>Der Motorschutzschalter schützt den Motor gegen Überlast und Kurzschluss (DIN EN 60204-1 fordert Überlastschutz für Motoren). Sein Hilfskontakt meldet <b>1 = OK</b>: Ein Drahtbruch in der Meldeleitung erscheint damit als Auslösung und nicht als „alles in Ordnung“.</p><p>Fällt ein Förderer aus, reicht es nicht, nur ihn abzuschalten. Der vorgelagerte Förderer würde sonst weiter Körbe anliefern, die sich an der Stoßstelle stauen, aufeinander schieben oder halb auf zwei Förderern liegen bleiben. Jeder Förderer gibt deshalb nur ab, wenn der nachfolgende „bereit zur Übernahme“ meldet. Im Stau stehen die Körbe mit 150 mm Teilung; diesen Abstand darf Ihre Steuerung nicht unterschreiten.</p>"},{"t":"Ein FB je Förderer","h":"<p>Band 1, Kurve, Band 2 und Muldenrollen verhalten sich an ihren Übergaben gleich: Korb übernehmen, transportieren, abgeben. Ein FB mit festgelegter Schnittstelle (Eingänge: Sensoren, Motorschutz, Freigabe des Nachfolgers; Ausgänge: Fahranforderung, „bereit“, Störung) wird viermal als Multiinstanz aufgerufen. Fehler korrigieren Sie an einer Stelle, und der Datenaustausch läuft nur über die Schnittstelle – nicht über globale Querzugriffe. Das entspricht dem Siemens-Programmierleitfaden: gekapselte, wiederverwendbare Bausteine ohne Merker, Zustände als #stat-Variablen.</p>"}]},"L19":{"beschr":"<p><b>Ausgangslage:</b> Bisher hält Band 2 den Korb am Kühlplatz an, sobald die Lichtschranke −BG22 belegt ist. Wo der Korb danach tatsächlich steht, hängt vom Schaltpunkt der Lichtschranke, von der Zykluszeit und vom Nachlauf des Bandes ab. Für das Abschrecken (L20) und das Pyrometer −BT2 soll er reproduzierbar in der Mitte des Kühlplatzes stehen. Band 1 und Band 2 tragen dafür je einen Inkrementalgeber an einer Trommel: −BG18 an Band 1, −BG27 an Band 2, jeweils mit Spur A, Spur B und Nullimpuls N. Der Zwilling läuft wie in L18 (<i>Portal = automatisch</i>, <i>Band = SPS steuert</i>); Ihr Handshake aus L18 bleibt unverändert in Betrieb.</p><p><b>Was am Ende funktionieren soll:</b></p><ol><li><b>Zählen:</b> Ein Zähler (DINT, statische Variable) erhöht sich bei jeder steigenden Flanke von Spur A um 1, wenn das Band vorwärts läuft, und verringert sich um 1 bei Rückwärtslauf. Die Richtung entnehmen Sie ausschließlich Spur B, nicht dem Schützbefehl.</li><li><b>Umrechnen:</b> Aus dem Zählerstand berechnen Sie die Bandposition in mm als REAL (Geberdaten siehe Tabelle).</li><li><b>Referenzieren:</b> Beim Nullimpuls korrigieren Sie die Position auf das nächstliegende Vielfache des Bandwegs je Umdrehung. Zählfehler sammeln sich so nicht an.</li><li><b>Positionieren:</b> Erfassen Sie den Korb an einer Lichtschranke vor dem Kühlplatz (z. B. bei der Übernahme an −BG21) als Bezugspunkt, merken Sie sich die Geberposition und halten Sie Band 2 nach einem festgelegten Weg an. Den Sollweg ermitteln Sie aus der Lage der Lichtschranken in der Anlagenbeschreibung oder durch eine eigene Messung. −BG22 bleibt als Kontrolle und Rückfallebene erhalten.</li><li><b>Vergleichen:</b> Positionieren Sie mindestens zehn Körbe einmal über −BG22 und einmal über den Geber und dokumentieren Sie die Haltepositionen.</li></ol><p><b>Randfälle, die Ihr Programm beherrschen muss:</b> Band läuft rückwärts (Zähler muss fallen), Band steht genau auf einer Flanke, Zählerstand nach langem Betrieb (Überlauf des Datentyps), Neustart der SPS (Position unbekannt, bis referenziert ist), mehrere Körbe gleichzeitig auf Band 2 (jeder hat seinen eigenen Bezugspunkt).</p><p><b>Abzugeben:</b> das Programm (Geberauswertung als eigener FB, z. B. „Encoder“, als Multiinstanz je Band), eine kurze Rechnung zu Auflösung und Nachlaufweg (Leitfragen) sowie ein Messprotokoll mit den Haltepositionen beider Verfahren: Mittelwert, größte Abweichung, Ihre Bewertung.</p><p><b>Erfolg:</b> Der Zählerstand steigt vorwärts und fällt rückwärts, 1 m Bandweg ergibt rund 41 Impulse, und der Positionierfehler am Kühlplatz ist gemessen, dokumentiert und begründet.</p>","wissen":[{"t":"Inkrementalgeber: Spur A, Spur B, Nullimpuls","h":"<p>Ein <b>Inkrementalgeber</b> liefert keine Position, sondern nur Schritte (Inkremente): Bei jeder Teilung der Geberscheibe entsteht ein Impuls. Die Position entsteht erst in der Steuerung durch Zählen. Wird nicht gezählt – SPS aus, Impuls verpasst –, ist die Position verloren. Das unterscheidet ihn vom <b>Absolutwertgeber</b>, der jede Stellung eindeutig codiert und auch nach dem Einschalten kennt.</p><p>Die zweite Spur B ist um 90° (eine Viertelperiode) gegen A versetzt. Daraus ergibt sich die Drehrichtung: Vorwärts ist B bei der steigenden Flanke von A schon 1, rückwärts noch 0. Mit nur einer Spur könnte die Steuerung Vor- und Rückwärtslauf nicht unterscheiden. Der <b>Nullimpuls</b> N kommt einmal je Umdrehung an derselben Stelle und dient als Bezugsmarke.</p>"},{"t":"Auflösung und Umrechnung in Weg","h":"<p>Die <b>Auflösung</b> ist der kleinste Weg, den die Auswertung unterscheiden kann. Bei 10 Impulsen je Umdrehung und 245 mm Bandweg je Umdrehung sind das 24,5 mm, wenn nur die steigenden Flanken von A gezählt werden. Werten Sie beide Flanken beider Spuren aus (<b>Vierfachauswertung</b>), vervierfacht sich die Auflösung – so arbeiten Zählerbaugruppen in der Praxis.</p><p>Rechnen Sie die Position immer aus dem ganzzahligen Zählerstand neu, statt einen REAL-Wert bei jedem Impuls zu erhöhen. Wiederholtes Addieren von Gleitkommazahlen summiert Rundungsfehler auf. Der Zählerstand selbst gehört in einen ganzzahligen Typ mit ausreichendem Wertebereich (DINT); ein INT liefe schon nach rund 800 m Bandweg über.</p><pre class=\"code\"><code>// Prinzip: Position immer aus dem Zählerstand berechnen\n#statPositionMm := DINT_TO_REAL(#statCount) * #MM_PER_PULSE;</code></pre>"},{"t":"Zykluszeit, Abtastung und schnelles Zählen","h":"<p>Die SPS liest Eingänge einmal je Zyklus ins Prozessabbild. Ein Impuls wird nur erkannt, wenn sein 1- und sein 0-Zustand jeweils mindestens einen Zyklus lang anstehen. Faustregel: Die Zykluszeit (einschließlich ihrer Schwankung) muss deutlich kleiner sein als die kürzeste Impuls- oder Pausendauer. Zusätzlich verzögern die Eingangsfilter digitaler Baugruppen das Signal um einige Millisekunden.</p><p>Bei wenigen Impulsen pro Sekunde reicht die Auswertung im zyklischen Programm. Bei höheren Frequenzen verwendet man einen <b>Hochgeschwindigkeitszähler (HSC)</b>, z. B. die Zählfunktion einer Kompakt-CPU oder eine Technologiebaugruppe (TM Count, TM PosInput): Er zählt in Hardware unabhängig vom Programmzyklus. Ein <b>Weckalarm-OB</b> (z. B. OB30) ruft die Auswertung in festem Zeitraster auf und macht sie unabhängig von der schwankenden OB1-Zykluszeit. Welche Lösung bei welcher Frequenz nötig ist, schätzen Sie in der Leitfrage selbst ab.</p>"},{"t":"Referenzieren mit dem Nullimpuls – und was er nicht kann","h":"<p><b>Referenzieren</b> heißt, die gezählte Position mit einer bekannten Stelle der Mechanik abzugleichen. Der Nullimpuls erscheint immer an derselben Trommelstellung; dort muss die Position ein ganzzahliges Vielfaches des Wegs je Umdrehung sein. Weicht sie ab, wurden Impulse verpasst oder doppelt gezählt, und Sie korrigieren.</p><p>Wichtig: Der Geber misst die <b>Trommel</b>, nicht den Korb. Rutscht der Gurt auf der Trommel (Schlupf) oder der Korb auf dem Gurt, sieht der Geber das nicht. Deshalb braucht jeder Korb zusätzlich einen eigenen Bezugspunkt an einer Lichtschranke, ab dem sein Weg gemessen wird. In der Praxis kombiniert man oft beides: Lichtschranke für den Korbbezug, Geber für den Weg danach.</p>"},{"t":"Nachlauf und Positioniergenauigkeit","h":"<p>Zwischen „Position erreicht“ und „Band steht“ vergeht Zeit: bis der Zyklus die Bedingung erkennt, bis die Schützspule abfällt, bis der Motor ausgelaufen ist. In dieser Zeit fährt der Korb weiter – das ist der <b>Nachlaufweg</b>. Am Schütz gibt es keine Bremsrampe; der Nachlauf hängt von Last, Reibung und Geschwindigkeit ab.</p><p>Man unterscheidet zwei Fehlerarten: Der <b>systematische Fehler</b> ist bei jedem Korb gleich (z. B. immer 15 mm zu weit). Er lässt sich durch einen Vorhalt ausgleichen, indem früher abgeschaltet wird. Die <b>Streuung</b> schwankt von Korb zu Korb (Zyklus, Auflösung, Last); sie lässt sich nur durch bessere Auflösung, schnellere Auswertung oder einen geregelten Antrieb mit Rampe verkleinern (Umrichter, L27). Deshalb messen Sie mehrere Körbe und geben Mittelwert und größte Abweichung an, nicht einen Einzelwert.</p>"}]},"L20":{"beschr":"<p><b>Ausgangslage:</b> Ein Korb verlässt das Zinnbad mit über 200 °C. Auf Band 2 fährt er durch den Sprühtunnel zum Kühlplatz (−BG22) und darf erst weiter, wenn er unter 60 °C abgekühlt ist. An Luft dauert das rund 3 Minuten, im Sprühwasser wenige Sekunden. Das Sprühwasser kommt aus dem Kühlwassertank: Die Umwälzpumpe −MA3 (Schütz −QA7) baut den Druck auf, das Ventil −MB13 gibt das Wasser auf die Sprührohre frei – es wirkt nur bei laufender Pumpe. Das Pyrometer −BT2 misst die Korbtemperatur berührungslos am Kühlplatz. Am Tunnelauslauf bläst der Luftmesser −MB14 das Wasser vom Korb ab. Der Zwilling läuft wie in L18 (<i>Band = SPS steuert</i>); Ihr Handshake aus L18 und gegebenenfalls die Geberpositionierung aus L19 bleiben in Betrieb.</p><p><b>Soll-Verhalten:</b></p><ol><li>Erreicht ein Korb den Kühlplatz, hält Band 2 an. Der Kühlplatz meldet dem Band-FB „Halt“ über die Schnittstelle – er schaltet −QA5 nicht selbst ab.</li><li>Zum Abschrecken läuft zuerst die Pumpe an; erst danach öffnet −MB13. Beim Beenden kehrt sich die Reihenfolge um. Legen Sie fest und begründen Sie, ob die Pumpe zwischen zwei Körben weiterläuft.</li><li>Band 2 fährt erst weiter, wenn −BT2 eine Temperatur unter 60 °C meldet <i>und</i> diese Messung zu einem Korb am Kühlplatz gehört.</li><li>Der Luftmesser −MB14 bläst nur, solange sich ein Korb im Auslaufbereich hinter dem Kühlplatz befindet. Dafür gibt es keinen eigenen Sensor: Bestimmen Sie den Bereich über Weg (Geber, L19) oder Fahrzeit ab dem Verlassen von −BG22.</li><li>Skalieren Sie −BT2 mit <code>NORM_X</code> und <code>SCALE_X</code> in °C (REAL).</li></ol><p><b>Fehlerfälle:</b> Die Temperatur sinkt nicht in angemessener Zeit (Pumpe gestört, Tank leer, Ventil klemmt) → Überwachungszeit wie in L17, Störmeldung, Korb bleibt stehen. Der Rohwert von −BT2 liegt außerhalb des Nennbereichs → Messung ungültig, Korb wird nicht freigegeben, Meldung. Kein Korb am Kühlplatz → weder Pumpe noch Ventil oder Luftmesser laufen „auf Verdacht“.</p><p><b>Vorgaben:</b> Ventil, Pumpe und Luftmesser schreibt nur die Befehlsausgabe (L11); die Verriegelung „−MB13 nur bei laufender Pumpe“ gehört dorthin. Grenzwerte (60 °C, Überwachungszeit, Länge des Auslaufbereichs) als Konstanten oder Parameter, nicht als Zahlen im Code verstreut. Empfohlen: ein eigener FB für den Kühlplatz, z. B. „Quench“.</p><p><b>Abzugeben:</b> Programm, ein Ablaufplan oder GRAFCET des Kühlplatzes, ein Skalierungstest an drei Punkten (Rohwert → °C, gerechnet und im Zwilling abgelesen) und ein Messprotokoll: Abkühldauer eines Korbs an Luft und im Sprühwasser.</p><p><b>Erfolg:</b> Kein Korb verlässt den Kühlplatz über 60 °C (die Ereignisliste meldet sonst am Kipper die Temperatur), kein Korb kommt nass zur Prüfung, und der Luftmesser läuft nie ohne Korb.</p>","wissen":[{"t":"Analogwert und Skalierung","h":"<p>Ein Messumformer liefert ein Normsignal (z. B. 4 bis 20 mA), die Analogeingabebaugruppe wandelt es in eine ganze Zahl. Bei S7-1200/1500 entspricht der <b>Nennbereich</b> den Werten 0 bis 27648. Die krumme Zahl ist Absicht: Oberhalb bleibt Platz für den <b>Übersteuerungsbereich</b> (bis 32511), in dem ein leicht zu großer Messwert noch korrekt dargestellt wird. 32767 bedeutet Überlauf, bei 4-bis-20-mA-Eingängen mit aktivierter Diagnose auch Drahtbruch.</p><p>Die Umrechnung in eine physikalische Größe erfolgt in zwei Schritten: <code>NORM_X</code> bildet den Rohwert auf 0,0 bis 1,0 ab, <code>SCALE_X</code> bildet diesen Bruchteil auf den Messbereich des Sensors ab. Ergebnis ist ein REAL. Beispiel mit einem Füllstand 0 bis 100 %:</p><pre class=\"code\"><code>#tempNorm  := NORM_X(MIN := 0, VALUE := #inRaw, MAX := 27648);\n#tempLevel := SCALE_X(MIN := 0.0, VALUE := #tempNorm, MAX := 100.0);</code></pre>"},{"t":"Gültigkeit einer Messung","h":"<p>Ein Analogwert ist eine Zahl – ob sie etwas Sinnvolles bedeutet, muss das Programm prüfen. Zwei Fragen gehören zu jeder analogen Wartebedingung:</p><ul><li><b>Liegt der Rohwert im Nennbereich?</b> Werte über 27648 oder der Überlaufwert deuten auf Sensorfehler, Drahtbruch oder falsche Parametrierung. Ein ungültiger Wert darf nie als „Bedingung erfüllt“ gewertet werden.</li><li><b>Misst der Sensor das Richtige?</b> Das Pyrometer misst, was gerade in seinem Messfleck ist. Steht kein Korb am Kühlplatz, sieht es die Umgebung und meldet etwa Raumtemperatur – also „unter 60 °C“, obwohl gar kein Korb abgekühlt wurde.</li></ul><p>Deshalb verknüpft man den Analogwert mit einer Bedingung, die seine Gültigkeit belegt, und überwacht die Wartezeit. Nahe am Grenzwert schwankt ein Messwert leicht; eine kleine Hysterese oder eine kurze Mindestdauer unterhalb der Grenze verhindert, dass die Bedingung im Zyklustakt flattert.</p>"},{"t":"Aggregate in fester Reihenfolge: Pumpe vor Ventil","h":"<p>Eine Kreiselpumpe braucht nach dem Einschalten einen Moment, bis Drehzahl und Druck stehen. Öffnet das Ventil gleichzeitig oder früher, tropft das Wasser drucklos aus den Düsen, das Sprühbild fehlt, und der Korb wird ungleichmäßig gekühlt. Umgekehrt sollte die Pumpe nicht lange gegen ein geschlossenes Ventil arbeiten: Das Wasser in der Pumpe erwärmt sich, Dichtungen und Lager leiden.</p><p>Solche <b>Folgeschaltungen</b> sind typisch für Hilfsaggregate (Hydraulik, Kühlung, Absaugung): Einschalten von der Quelle zum Verbraucher, Ausschalten in umgekehrter Reihenfolge. Da −QA7 keine Rückmeldung „Pumpe läuft“ hat, ersetzt man sie durch den Schützbefehl plus eine Anlaufzeit (TON als Multiinstanz). Die Verriegelung „Ventil nur bei laufender Pumpe“ steht in der Befehlsausgabe, damit sie auch im Handbetrieb gilt. Der Trockenlaufschutz über den Tankfüllstand folgt in L22.</p>"},{"t":"Abschrecken: warum es so schnell geht","h":"<p>Ein heißer Körper gibt Wärme umso schneller ab, je größer der Temperaturunterschied zur Umgebung und je besser der Wärmeübergang ist. Die Temperatur fällt deshalb nicht linear, sondern anfangs schnell und dann immer langsamer (Exponentialverlauf). Luft nimmt Wärme schlecht auf; Wasser nimmt sie sehr gut auf und verdampft zusätzlich an der heißen Oberfläche. Daher der Unterschied zwischen Minuten und Sekunden.</p><p>Die Wartezeit am Kühlplatz ist also keine feste Zahl: Sie hängt von der Einlauftemperatur, der Wassermenge und dem Füllgrad des Korbs ab. Genau deshalb wartet die Steuerung auf den <b>Messwert</b> und nicht auf eine Zeit. Die gemessenen Abkühldauern (Luft und Wasser) brauchen Sie für eine sinnvolle Überwachungszeit.</p>"},{"t":"Luftmesser: Druckluft nur bei Bedarf","h":"<p>Ein <b>Luftmesser</b> ist eine schmale Schlitzdüse, die einen flachen, schnellen Luftstrahl erzeugt und Wasser von der Oberfläche abstreift. Bleibt Wasser am Korb, trocknet es zu Flecken ein – an der Kamera der Prüfstation führt das zu n.i.O.-Bewertungen guter Teile.</p><p>Druckluft ist eine der teuersten Energieformen im Betrieb: Der Kompressor setzt nur einen kleinen Teil der elektrischen Energie in nutzbare Druckluftenergie um. Ein Luftmesser im Dauerbetrieb verbraucht deshalb unnötig viel Energie und erzeugt Lärm. Er bläst nur, solange ein Korb im Wirkbereich ist. Ohne eigenen Sensor bestimmen Sie diesen Bereich über Weg oder Zeit ab einem bekannten Punkt – derselbe Gedanke wie bei der Teileverfolgung in L21.</p>"}]},"L21":{"beschr":"<p><b>Ausgangslage:</b> Nach dem Abschrecken (L20) läuft der Korb über die Muldenrollen bis an den Endanschlag der Kippmulde (−BG33). Der Korbkipper −MM8 (Ventil −MB15, 5/2 monostabil, Endlagen −BG30 unten und −BG31 gekippt) schüttet die 36 Teile über die Schurre in den Trichter. Die Vibrorinne −MA4 (−QA8) vereinzelt sie auf das Prüfband −MA5 (−QA9). Am Kameraplatz meldet die Lichtschranke −BG32 jedes Teil; die Kamera −KF10 wird über einen Triggerausgang ausgelöst und liefert nach kurzer Auswertezeit ihr Ergebnis: −BG28 i.O. oder −BG29 n.i.O., jeweils nur 0,3 s lang. 200 mm hinter der Kamera sitzt die Ausblasdüse −MB16, die n.i.O.-Teile in den roten Ausschussbehälter bläst. i.O.-Teile fallen am Bandende in den blauen KLT; −BG34 meldet „KLT voll“. Der Zwilling läuft wie in L18.</p><p><b>Soll-Verhalten:</b></p><ol><li><b>Kippen:</b> nur bei Korb am Endanschlag (−BG33) und in der Mulde (−BG37), Kipper in Grundstellung (−BG30). Nach Erreichen von −BG31 und einer Entleerzeit schwenkt der Kipper zurück. Erst nach dem Kippen starten Vibrorinne und Prüfband. Wann die Prüfung eines Korbs beendet ist, legen Sie fest und begründen es (z. B. Teilezählung oder Leerlaufzeit).</li><li><b>Prüfen:</b> Jede steigende Flanke an −BG32 erzeugt einen Triggerimpuls an −KF10. Das Ergebnis wird innerhalb seines Gültigkeitsfensters übernommen und dem Teil zugeordnet. Kommt kein Ergebnis, gilt das Teil als n.i.O. und wird gemeldet.</li><li><b>Ausblasen:</b> Aus dem Abstand Kamera–Düse und der Bandgeschwindigkeit berechnen Sie die Laufzeit. Die Bandgeschwindigkeit entnehmen Sie der Dokumentation und bestätigen sie durch eine Messung. Ausgeblasen werden nur n.i.O.-Teile, und zwar genau dann, wenn sie vor der Düse sind.</li><li><b>Mehrere Teile unterwegs:</b> Zwischen Kamera und Düse können mehrere Teile liegen. Speichern Sie je n.i.O.-Teil den Ausblaszeitpunkt in einem Array, das als FIFO arbeitet. Überlegen Sie, was geschieht, wenn das Prüfband anhält, während Teile unterwegs sind.</li><li><b>KLT voll:</b> Bei −BG34 hält die Vibrorinne an, es kommen keine neuen Teile nach; eine Meldung fordert den KLT-Wechsel. Nach dem Wechsel läuft die Rinne wieder an.</li></ol><p><b>Vorgaben:</b> eigener FB für die Prüfstation (z. B. „Inspection“), Kipper, Rinne, Band, Trigger und Düse nur über die Befehlsausgabe (L11), keine Merker, Zeiten als Multiinstanz, Array-Größe und Ventilvorhalt als Konstanten.</p><p><b>Abzugeben:</b> Programm, ein Zeitdiagramm (−BG32, −KF10, −BG28/−BG29, −MB16) für zwei kurz hintereinander laufende Teile, die Laufzeitrechnung und ein Prüfprotokoll über mindestens drei Körbe mit Auszug aus der Ereignisliste.</p><p><b>Erfolg:</b> Die Ereignisliste meldet weder „Gutteil ausgeblasen“ noch „n.i.O.-Teil im i.O.-KLT“; bei vollem KLT steht die Rinne mit Meldung; der Kipper kippt nie ohne Korb am Endanschlag.</p>","wissen":[{"t":"Teileverfolgung: Erkennen und Handeln an verschiedenen Orten","h":"<p>Die Kamera erkennt den Fehler, die Düse beseitigt ihn – 200 mm später. Dazwischen weiß die Anlage nicht mehr, welches Teil welches ist; nur das Programm kann es wissen. Dieses Mitführen von Information zu einem Teil entlang der Strecke heißt <b>Teileverfolgung</b> (Tracking). Sie ist in der Fördertechnik allgegenwärtig: Ausschleusen, Sortieren, Etikettieren, Rückverfolgbarkeit.</p><p>Man verfolgt entweder <b>zeitbasiert</b> (Laufzeit = Weg geteilt durch Geschwindigkeit) oder <b>wegbasiert</b> (Geberimpulse wie in L19). Zeitbasiert ist einfach, solange die Geschwindigkeit konstant ist und das Band nicht anhält. Ändert sich die Geschwindigkeit (Umrichter, L29) oder steht das Band, stimmt die Zeit nicht mehr zum Ort – dann ist die wegbasierte Verfolgung robuster.</p>"},{"t":"Kurzzeitig gültige Signale übernehmen","h":"<p>Die Kamera hält ihr Ergebnis nur 0,3 s an, danach ist sie bereit für das nächste Teil. Ein solches Signal muss das Programm in dem Zyklus, in dem es ansteht, in eine eigene Variable übernehmen (speichern). Wer es erst später abfragt – etwa wenn die Düse erreicht ist –, findet nur noch 0 vor.</p><p>Für die Zuordnung gilt: Das Ergebnis gehört zum zuletzt getriggerten Teil. Fehlt es innerhalb des erwarteten Fensters, ist das ein Fehler, den man sicher behandelt. In der Qualitätssicherung gilt der Grundsatz: <b>Im Zweifel ausschleusen.</b> Ein fälschlich ausgeblasenes Gutteil kostet wenig, ein n.i.O.-Teil beim Kunden kostet viel. Auch der Trigger ist ein Impuls: Die Kamera reagiert auf die Flanke, der Ausgang muss also wieder abfallen, bevor das nächste Teil kommt.</p>"},{"t":"FIFO im Array (Ringpuffer)","h":"<p><b>FIFO</b> heißt „first in, first out“: Was zuerst eingetragen wurde, wird zuerst bearbeitet – genau wie die Teile auf dem Band, die sich nicht überholen. In der SPS bildet man einen FIFO meist als <b>Ringpuffer</b>: ein Array fester Größe, ein Schreibindex, ein Leseindex und ein Zähler der belegten Plätze. Am Ende des Arrays springt der Index wieder auf 0.</p><pre class=\"code\"><code>// Prinzip: Index am Array-Ende auf den Anfang zurückführen\n#statWriteIdx := (#statWriteIdx + 1) MOD #FIFO_SIZE;</code></pre><p>Die Array-Größe richtet sich nach der höchsten Zahl gleichzeitig unterwegs befindlicher Teile, mit Reserve. Ein voller FIFO darf keine Einträge überschreiben – sonst verliert die Steuerung ein n.i.O.-Teil. Er wird als Störung behandelt.</p>"},{"t":"Zeitbasis und warum ein einzelner Impulsgeber nicht reicht","h":"<p>Ein <code>TP</code> erzeugt nach einer Startflanke einen Impuls fester Länge. Während der Impuls läuft, reagiert er nicht auf eine neue Startflanke. Für ein einzelnes Teil passt das; für mehrere Teile mit unterschiedlichen Zeitpunkten braucht man eine Zeitbasis, gegen die man viele gespeicherte Zeitpunkte vergleichen kann.</p><p>Dafür eignet sich eine fortlaufende Zeit im Programm, z. B. die Anweisung <code>RUNTIME</code> oder ein eigener Zeitzähler, der in einem Weckalarm-OB mit festem Takt erhöht wird. Merker und Taktmerker sind nach dem Styleguide tabu. Vergleichen Sie immer über die <b>Differenz</b> „jetzt minus gespeicherter Zeitpunkt“, nicht über absolute Werte – so bleibt der Vergleich auch beim Überlauf des Zählers richtig.</p>"},{"t":"Laufzeit, Vorhalt und Blasdauer","h":"<p>Die reine Laufzeit von der Kamera zur Düse folgt aus Abstand und Bandgeschwindigkeit. Dazu kommen Verzögerungen: Auswertezeit der Kamera, Zykluszeit, Schaltzeit des Magnetventils (typisch einige Millisekunden) und der Weg der Luft bis zum Teil. Muss man früher schalten, um rechtzeitig zu treffen, spricht man von einem <b>Vorhalt</b>.</p><p>Die <b>Blasdauer</b> ist ein Kompromiss: lang genug, dass das Teil sicher vom Band geht, kurz genug, dass das nachfolgende Gutteil nicht mitgerissen wird. Wie dicht die Teile folgen, bestimmt die Vereinzelung durch die Vibrorinne. Prüfen Sie Ihre Einstellung immer mit kurz hintereinander laufenden Teilen.</p>"},{"t":"Kipper: Verriegelung und monostabiles Ventil","h":"<p>Gekippt wird nur, wenn der Korb ganz in der Mulde liegt und am Endanschlag anliegt. Liegt er noch halb auf Band 2, würde der schwenkende Kipper ihn aushebeln: Teile fallen neben den Trichter, Korb und Band werden beschädigt. Deshalb fragt die Verriegelung beide Sensoren ab – Endlagen statt Befehle.</p><p>−MB15 ist ein <b>5/2-Wegeventil, monostabil</b>: Nur solange die Spule bestromt ist, fährt der Zylinder in Kippstellung; fällt das Signal ab – auch bei Not-Halt oder Spannungsausfall –, stellt die Feder das Ventil zurück, und der Kipper fährt in die Grundstellung. Das Programm muss den Befehl also so lange halten, wie gekippt sein soll (vgl. Handbetrieb mit Selbsthaltung in L08).</p>"}]},"L22":{"beschr":"<p><b>Ausgangslage:</b> Der Kühlwassertank der Sprühkühlung (rund 17 l) verliert beim Abschrecken ständig Wasser: Sprühnebel und nasse Körbe tragen es aus, heiße Körbe verdampfen zusätzlich. Bisher speist ein eigener Niveauregler am Tank nach. Jetzt übernimmt Ihr Programm diese Aufgabe – vorerst nur mit den beiden Grenzschaltern: −BG38 meldet „Wasser über Minimum“ (1 = Gabel bedeckt, über 25 %), −BG39 meldet „Wasser unter Maximum“ (1 = Gabel frei, unter 90 %; 0 = voll <i>oder</i> Drahtbruch). Nachgespeist wird über das Magnetventil −MB17 (stromlos zu) und das Regelventil −MB18 in Reihe. Stellen Sie den Zwilling auf <i>Kühlwassertank: Nachspeisung = SPS regelt</i>; den Ablasshahn nutzen Sie als Störgröße, damit Ihre Steuerung auch ohne laufende Produktion zu tun hat.</p><p><b>Soll-Verhalten:</b></p><ol><li>Fällt −BG38 ab (Pegel unter Minimum), öffnet −MB17. Fällt −BG39 ab (Pegel erreicht Maximum), schließt −MB17. Dazwischen behält das Ventil seinen Zustand – der Pegel pendelt zwischen den beiden Schaltpunkten.</li><li>−MB18 steht fest auf 100 % (Rohwert 27648 auf den Analogausgang). Beachten Sie die Stellzeit des Regelventils von 8 s: Ein offenes −MB17 bei geschlossenem −MB18 liefert kein Wasser, und der Zwilling meldet das.</li><li><b>Trockenlaufschutz:</b> Die Pumpe −QA7 darf nur laufen, solange −BG38 meldet, dass Wasser über dem Minimum steht. Diese Freigabe wirkt als Verriegelung in der Befehlsausgabe (L11) und gilt damit für jeden Pumpenbefehl, auch für den aus dem Abschrecken (L20). Hinweis zum Zwilling: Läuft die Förderstrecke im Übungsumfang <i>automatisch</i>, schaltet das Bandmodul die Pumpe selbst; Ihre Freigabe wird erst wirksam, wenn auch Band 2 und Kühlung aus Ihrem Programm kommen (<i>Band = SPS steuert</i>, wie ab L18).</li><li><b>Drahtbruch:</b> Forcen Sie −BG39 im Signalmonitor auf 0. Ihr Programm darf dann nicht mehr nachspeisen – das ergibt sich aus Schritt 1 von selbst. Zusätzlich soll es den Zustand als Störung erkennen und melden. Überlegen Sie, an welcher Signalkombination oder an welchem zeitlichen Verlauf Sie „voll“ von „Drahtbruch“ unterscheiden können, ohne den Analogwert −BL2 zu verwenden (der folgt in L23).</li><li>Die Störmeldung wird mit −SF4 als Flanke quittiert; solange die Ursache besteht, bleibt die Nachspeisung gesperrt.</li></ol><p><b>Vorgaben:</b> eigener FB, z. B. „TankLevel“, Ventilzustand als statische Variable, keine Merker, Ausgänge nur über die Befehlsausgabe. Not-Halt schließt −MB17 hart über −KF2; Ihr Programm muss danach sauber wieder anlaufen.</p><p><b>Abzugeben:</b> Programm, eine Skizze des Tanks mit Schaltpunkten und Ventilzustand, ein Pegelverlauf über mindestens zwei Nachspeisezyklen (mit offenem Ablasshahn) und das Testprotokoll zum Drahtbruch.</p><p><b>Erfolg:</b> Der Pegel pendelt zwischen 25 und 90 %, die Ereignisliste meldet weder „Kühlwassertank läuft über“ noch „Pumpe läuft trocken“, und der Drahtbruch an −BG39 wird erkannt und gemeldet.</p>","wissen":[{"t":"Zweipunktsteuerung mit zwei Grenzschaltern","h":"<p>Eine <b>Zweipunktsteuerung</b> kennt für das Stellglied nur zwei Zustände: Ventil auf oder zu. Mit nur einem Schaltpunkt würde das Ventil bei jeder kleinen Welle im Tank auf- und zuschalten (Flattern), was Spule und Dichtung verschleißt und Druckstöße in der Leitung erzeugt. Zwei getrennte Schaltpunkte – „ein“ unten, „aus“ oben – erzeugen eine große <b>Schaltdifferenz</b> (Hysterese) und damit wenige, lange Nachspeisezyklen.</p><p>Der Zustand „Ventil offen“ muss gespeichert werden, denn zwischen den Schaltpunkten sagen beide Grenzschalter dasselbe, egal ob der Pegel gerade steigt oder fällt. Das ist der Speicher aus L03, rücksetzdominant: Meldet −BG39 „voll“, muss das Ventil schließen, auch wenn gleichzeitig eine Einschaltbedingung anstünde. Zur Größenordnung: Bei vollem Zulauf (rund 1,5 %/s) dauert ein Füllvorgang von 25 auf 90 % ohne Verbrauch etwa 45 s.</p>"},{"t":"Vibrations-Grenzschalter: MIN- und MAX-Sicherheit","h":"<p>Der Liquiphant ist ein <b>Vibrations-Grenzschalter</b>: Eine Schwinggabel wird in ihrer Eigenfrequenz angeregt. Taucht sie in Flüssigkeit ein, sinkt die Frequenz, und die Elektronik schaltet. Er hat keine beweglichen Teile und ist unempfindlich gegen Schaum, Strömung und Ablagerungen in üblichem Maß.</p><p>Bei solchen Geräten stellt man ein, in welchem Zustand der Ausgang Strom führt. <b>MIN-Sicherheit</b> heißt: Ausgang 1, solange die Gabel bedeckt ist – also solange genug Wasser da ist. <b>MAX-Sicherheit</b> heißt: Ausgang 1, solange die Gabel frei ist – also solange der Tank nicht voll ist. In beiden Fällen ist 1 der Gutzustand, und 0 bedeutet „Grenzwert erreicht“.</p>"},{"t":"Ruhestromprinzip und sichere Seite","h":"<p>Beim <b>Ruhestromprinzip</b> fließt im Gutzustand Strom, das Signal ist 1. Jede Unterbrechung – Drahtbruch, abgezogener Stecker, ausgefallene Versorgung, defekter Sensor – erzeugt 0 und damit dieselbe Meldung wie der Gefahrzustand. Die Steuerung reagiert also in jedem Fall so, wie sie bei echter Gefahr reagieren würde: Sie fällt auf die <b>sichere Seite</b>.</p><p>Dasselbe Prinzip kennen Sie von STOP- und Not-Halt-Tastern als Öffner (L03, L14) und vom Motorschutz-Hilfskontakt (L15). Übertragen Sie es auf −BG38 und −BG39: Welche Anlagenreaktion löst eine 0 jeweils aus, und warum ist genau diese Reaktion bei einem Kabelfehler ungefährlich? Der Preis des Prinzips: Ein Drahtbruch sieht zunächst genauso aus wie der echte Grenzzustand. Erkennen lässt er sich nur durch Plausibilitätsprüfung – etwa an Zuständen, die physikalisch nicht gleichzeitig auftreten können, oder an einem Signalwechsel, den der Prozess so nicht hervorbringen kann.</p>"},{"t":"Trockenlaufschutz der Pumpe","h":"<p>Kreiselpumpen werden durch das Fördermedium gekühlt und geschmiert, vor allem die <b>Gleitringdichtung</b> an der Welle. Läuft die Pumpe ohne Wasser, erhitzt sich die Dichtung innerhalb kurzer Zeit und wird zerstört; danach tritt Wasser an der Welle aus, im ungünstigen Fall in den Motor. Saugt die Pumpe ein Luft-Wasser-Gemisch an, bricht zudem der Druck ein – im Zwilling gibt es dann kein Sprühwasser mehr, und der Korb wird nicht abgeschreckt.</p><p>Der MIN-Grenzschalter sitzt deshalb deutlich über dem Saugstutzen, damit nach dem Abschalten noch Reserve bleibt. Die Pumpenfreigabe gehört in die Befehlsausgabe als Verriegelung: So wirkt sie unabhängig davon, ob die Pumpe aus der Automatik, aus dem Handbetrieb oder aus einer späteren Programmerweiterung angefordert wird.</p>"},{"t":"Magnetventil und Regelventil in Reihe","h":"<p>−MB17 ist ein <b>Magnetventil</b> 2/2, stromlos geschlossen: Es kennt nur auf und zu und sperrt bei Spannungsausfall oder Not-Halt sicher ab. −MB18 ist ein <b>Regelventil</b> mit Stellantrieb: Es stellt die Durchflussmenge stetig zwischen 0 und 100 % ein, braucht dafür aber Zeit (hier 8 s für den vollen Hub) und schließt bei Spannungsausfall nicht von selbst. Deshalb sitzen beide in Reihe: Das Magnetventil ist die Absperrung, das Regelventil die Mengeneinstellung.</p><p>Für die Zweipunktsteuerung genügt das Magnetventil; das Regelventil steht fest offen. In L25 übernimmt dann <code>PID_Compact</code> das Regelventil, und −MB17 wird zur Freigabe.</p>"}]},"L23":{"beschr":"<p><b>Ausgangslage:</b> In L22 haben Sie den Kühlwassertank allein mit den beiden Liquiphant-Grenzschaltern −BG38 (Min, 25 %) und −BG39 (Max, 90 %) nachgespeist. Das funktioniert, nutzt aber fast den ganzen Tankinhalt als Schaltspiel: Der Pegel pendelt zwischen 25 und 90 %, und jedes Mal, wenn −BG38 abfällt, steht die Pumpe −QA7 bereits an ihrem Trockenlaufschutz. Der Radarsensor −BL2 im Tankdeckel misst den Füllstand dagegen stetig (%IW72, 0…27648 = 0…100 %). Mit ihm sollen Sie den Pegel in einem engeren Band halten. Die Grenzschalter bleiben als unabhängige zweite Ebene erhalten.</p><p><b>Soll-Verhalten:</b></p><ol><li>Der Rohwert von −BL2 wird mit <code>NORM_X</code> und <code>SCALE_X</code> in einen REAL-Wert in Prozent umgerechnet. Legen Sie fest, wie Ihr Programm mit Werten außerhalb des Nennbereichs umgeht.</li><li>Ein Zweipunktregler mit Hysterese öffnet −MB17, sobald der Pegel unter 60 % sinkt, und schließt es, sobald er 80 % überschreitet. Dazwischen bleibt der zuletzt gültige Zustand erhalten. −MB18 steht wie in L22 fest auf 100 %.</li><li>Die Logik aus L22 bleibt als Sicherheitsebene darüber: Meldet −BG39 „voll“ (oder Drahtbruch), wird unabhängig vom Analogwert nicht nachgespeist. −QA7 läuft nur bei bedecktem −BG38.</li><li>Plausibilitätsprüfung: Zeigt −BL2 über 95 %, obwohl −BG39 noch „frei“ meldet, oder unter 20 %, obwohl −BG38 bedeckt ist, widersprechen sich die Messungen. Steht dieser Widerspruch länger als eine von Ihnen begründete Verzögerungszeit an, meldet das Programm „Messung gestört“. Legen Sie fest, wie die Nachspeisung im Fehlerfall weiterarbeitet (z. B. Rückfall auf die reine Grenzschalter-Logik aus L22) und wie die Meldung mit einer Flanke von −SF4 quittiert wird.</li></ol><p><b>Randfälle, die Sie bedenken sollen:</b> Anlauf der CPU, wenn der Pegel gerade zwischen 60 und 80 % steht; offener Ablasshahn, bei dem Zulauf und Abfluss fast gleich groß sind; ein Widerspruch, der nur kurz ansteht.</p><p><b>Vorgaben:</b> Kapseln Sie die Funktion in einem FB (z. B. <code>CoolingTank</code>) mit Bausteinkopf. Den Reglerzustand halten Sie in einer statischen Variable (#stat…), Zeiten als Multiinstanz (#inst…). Die Ausgänge −MB17, −MB18 und −QA7 werden an genau einer Stelle geschrieben. Merker sind nicht zulässig.</p><p><b>Test:</b> Den Pegel bewegen Sie mit dem Ablasshahn (Seitenleiste <i>Prozess</i>) und dem Verbrauch der Sprühkühlung. Der Signalmonitor des Zwillings kann nur digitale Eingänge forcen. Den Grenzschalter-Teil der Plausibilität prüfen Sie daher durch Forcen von −BG38 bzw. −BG39. Einen falschen Analogwert erzeugen Sie z. B. über eine Testumschaltung in Ihrem FB, die statt des Rohwerts einen vorgebbaren Testwert verwendet.</p><p><b>Abgabe:</b> Programm, Trendaufzeichnung von Pegel und −MB17 über mehrere Schaltspiele, Begründung der gewählten Verzögerungszeit, Antworten auf die Leitfragen. <b>Erfolgreich</b> ist die Lösung, wenn die Schaltpunkte 60 % und 80 % im Trend nachweisbar sind, die Ereignisliste weder „Tank läuft über“ noch „Pumpe läuft trocken“ zeigt und eine gestörte Messung sicher erkannt wird, ohne dass im Normalbetrieb Fehlalarme auftreten.</p>","wissen":[{"t":"Analogwerte im S7-Format und ihre Normierung","h":"<p>Eine Analogeingangsbaugruppe der S7-1500 liefert den Messwert als INT. Der <b>Nennbereich</b> 0…100 % des Signals (hier 4…20 mA des Radars) wird auf 0…27648 abgebildet. Darüber liegt ein <b>Übersteuerungsbereich</b> bis 32511, der Wert 32767 steht für Überlauf – bei Stromsignalen mit lebendem Nullpunkt und aktivierter Diagnose auch für Drahtbruch. Die krumme Zahl 27648 lässt also bewusst Platz, um Messbereichsüberschreitungen und Fehler vom gültigen Messwert zu unterscheiden.</p><p><code>NORM_X</code> bildet einen Wert zwischen MIN und MAX auf 0,0…1,0 ab, <code>SCALE_X</code> bildet 0,0…1,0 auf einen physikalischen Bereich ab. Beide begrenzen <b>nicht</b>: Ein Rohwert über 27648 ergibt mehr als 100 %. Ob Sie begrenzen oder einen solchen Wert als Fehler werten, ist eine bewusste Entscheidung. Allgemeines Beispiel (Temperaturgeber 0…400 °C):</p><pre class=\"code\"><code>#tempNorm  := NORM_X(MIN := 0, VALUE := #rawValue, MAX := 27648);\n#statTemp  := SCALE_X(MIN := 0.0, VALUE := #tempNorm, MAX := 400.0);</code></pre>"},{"t":"Zweipunktregler und Hysterese","h":"<p>Ein <b>Zweipunktregler</b> kennt nur zwei Stellzustände: Ventil auf oder zu. Würde er an einer einzigen Schwelle schalten, genügte schon geringes Messrauschen oder eine kleine Welle an der Oberfläche, um ihn im Takt der Zyklen ein- und auszuschalten („Flattern“). Die Folgen sind hoher Verschleiß des Magnetventils, Druckstöße in der Leitung und eine unruhige Anlage.</p><p>Die <b>Hysterese</b> (Schaltdifferenz) trennt Einschalt- und Ausschaltpunkt. Zwischen den beiden Punkten behält der Regler seinen letzten Zustand – er braucht also ein Gedächtnis, im FB eine statische Variable. Eine kleine Hysterese ergibt einen ruhigen Pegel, aber viele Schaltspiele. Eine große Hysterese schont das Ventil, lässt den Pegel aber stärker schwanken. Die Schaltpunkte müssen außerdem mit Abstand innerhalb der Grenzschalter liegen, sonst greift die Sicherheitsebene im Normalbetrieb ein.</p>"},{"t":"Unabhängige Sicherheitsebene und Diversität","h":"<p>Der stetige Messwert ist bequem, aber ein einzelner Sensor kann unbemerkt falsch messen. Deshalb bleiben die Grenzschalter als <b>zweite, unabhängige Ebene</b> wirksam. Ihre Logik darf vom Analogwert nicht überstimmt werden: Meldet −BG39 „voll“, wird nicht nachgespeist, egal was −BL2 anzeigt.</p><p>Wichtig ist die <b>Diversität</b>: Radar (berührungslose Laufzeitmessung) und Vibronik (Schwinggabel) beruhen auf verschiedenen physikalischen Prinzipien. Ein gemeinsamer Fehler, etwa durch Schaum oder Ablagerungen, wirkt sich auf beide sehr unterschiedlich aus. Das Ruhestromprinzip aus L22 sorgt zusätzlich dafür, dass ein Drahtbruch an einem Grenzschalter immer zur sicheren Seite führt.</p>"},{"t":"Plausibilitätsprüfung und Ansprechverzögerung","h":"<p>Liegen für dieselbe Größe zwei Informationen vor, kann das Programm sie gegeneinander prüfen. Ein <b>Widerspruch</b> zeigt sicher, dass eine der beiden Messungen falsch ist – welche, weiß das Programm aber nicht. Deshalb gilt: melden und auf einen Zustand zurückfallen, der mit der vertrauenswürdigeren Information sicher ist.</p><p>Ein kurzer Widerspruch ist nicht automatisch ein Fehler. Die Messungen haben unterschiedliche Ansprechzeiten und Toleranzen, und die Oberfläche ist beim Nachspeisen und Sprühen nicht ruhig. Die Prüfung erhält daher eine <b>Ansprechverzögerung</b> (Einschaltverzögerung als Multiinstanz). Ist sie zu kurz, entstehen Fehlalarme. Ist sie zu lang, arbeitet die Anlage lange mit einem falschen Messwert. Die Zeit wird deshalb begründet und nicht geschätzt.</p>"},{"t":"Typische Fehler eines Füllstandsradars in der Praxis","h":"<p>Radarsensoren sind robust, aber nicht fehlerfrei. Häufige Ursachen für falsche Werte sind Kondensat oder Ablagerungen an der Antenne, Störechos von Einbauten (Rohre, Streben), Schaum auf der Oberfläche und ein „eingefrorener“ Messwert nach einem Gerätefehler. Ein eingefrorener Wert ist besonders tückisch, weil er im gültigen Bereich liegt und von einer reinen Bereichsprüfung nicht erkannt wird. Genau hier hilft der Vergleich mit den Grenzschaltern: Spätestens wenn der echte Pegel einen Grenzschalter erreicht, passt der Analogwert nicht mehr dazu.</p>"}]},"L24":{"beschr":"<p><b>Ausgangslage:</b> Bisher hat der Regler des Zwillings das Zinnbad selbst auf 280 °C gehalten. Mit der Einstellung <i>Zinnbad Temperatur/Füllstand = SPS regelt</i> übernimmt Ihr Programm diese Aufgabe: Es schaltet die Heizung −TB1 (Halbleiterrelais, %Q2.4) und die Nachfülleinrichtung −MB11 (%Q2.5). Als Istwerte stehen die Temperatur −BT1 (%IW64, 0…27648 = 0…400 °C) und der Füllstand −BL1 (%IW66, 0…100 %) zur Verfügung. Unter 250 °C fällt −BG9 ab, unter 40 % Füllhöhe −BG10 – dann darf kein Korb getaucht werden. Jedes Tauchen kühlt das Bad um 5 K und verbraucht 4 % Zinn. Das sind die Störgrößen, mit denen Ihre Regelung fertig werden muss.</p><p><b>Aufgabe:</b> Sie regeln dieselbe Strecke nacheinander mit drei Verfahren und vergleichen die Ergebnisse mit Messwerten.</p><ol><li><b>Variante A – Zweipunktregler:</b> Heizung ein unter 277 °C, aus über 283 °C.</li><li><b>Variante B – Impuls/PWM:</b> Die Heizung wird in einer festen Periode ein- und ausgeschaltet. Das Tastverhältnis (Einschaltanteil in %) berechnet ein P-Regler aus der Regelabweichung. Periodendauer und Verstärkung wählen Sie selbst und begründen sie.</li><li><b>Variante C – PID_Compact:</b> Der Ausgang <code>Output_PWM</code> steuert −TB1, die Parameter ermittelt die Selbstoptimierung.</li><li><b>Nachfüllen:</b> −MB11 öffnet unter 50 % und schließt bei 70 %. Begründen Sie diese Grenzen mit −BG10, dem Verbrauch je Tauchvorgang und der Nachfüllrate von ca. 2 %/s.</li></ol><p><b>Randfälle:</b> Aufheizen aus kaltem Zustand (das dauert bei dieser Strecke mehrere Minuten), mehrere Tauchvorgänge kurz hintereinander, Wechsel der Variante im laufenden Betrieb. Bei einem ungültigen Messwert von −BT1 (Überlauf, Drahtbruch) muss die Heizung ausgeschaltet bleiben – eine ungeregelte Heizung würde das Bad weit über den Sollwert treiben.</p><p><b>Vorgaben:</b> Ein FB (z. B. <code>TinBathControl</code>) mit Bausteinkopf. Die Auswahl der Variante erfolgt über einen Parameter und eine CASE-Anweisung mit ELSE-Zweig. Zeitkritische Teile (PWM, <code>PID_Compact</code>) laufen in einem Weckalarm-OB. −TB1 und −MB11 werden an genau einer Stelle geschrieben, Zustände liegen in statischen Variablen, Zeiten in Multiinstanzen. Merker sind nicht zulässig.</p><p><b>Messung:</b> Lassen Sie jede Variante im eingeschwungenen Zustand mindestens zehn Minuten mit laufender Produktion arbeiten. Zeichnen Sie Soll- und Istwert sowie −TB1 auf. Werten Sie Schwankungsbreite, Überschwingen nach dem Aufheizen und die Schaltspiele je Minute aus und tragen Sie die Werte in die Vergleichstabelle ein.</p><p><b>Abgabe:</b> Programm, drei Trendaufzeichnungen, ausgefüllte Vergleichstabelle, Begründung der Nachfüllgrenzen, Antworten auf die Leitfragen. <b>Erfolgreich</b> ist die Arbeit, wenn im Dauerbetrieb keine Meldung „Zinn nicht auf Temperatur“ auftritt und die Tabelle mit nachvollziehbar gemessenen Werten gefüllt ist.</p>","wissen":[{"t":"Regelstrecke mit Ausgleich und Verzögerung","h":"<p>Die Strecke besteht aus zwei hintereinander geschalteten <b>PT1-Gliedern</b>: dem Heizelement (Zeitkonstante 6 s) und dem Zinnbad (150 s). Ein PT1-Glied antwortet auf einen Sprung der Stellgröße nicht sofort, sondern nähert sich dem neuen Endwert exponentiell; nach einer Zeitkonstante sind rund 63 % erreicht. <b>Mit Ausgleich</b> heißt: Zu jeder konstanten Heizleistung gehört ein fester Beharrungswert der Temperatur (bei 100 % sind es 360 °C).</p><p>Weil zwei Speicher hintereinander liegen, wirkt jede Schalthandlung verzögert. Das Heizelement hat beim Abschalten noch Energie gespeichert und gibt sie an das Bad ab. Die Temperatur steigt also noch weiter, obwohl die Heizung schon aus ist. Diese Verzögerung bestimmt, wie gut sich die Strecke regeln lässt.</p>"},{"t":"Zweipunktregler an einer verzögerten Strecke","h":"<p>Der Zweipunktregler schaltet die volle Leistung ein oder aus. Die eingestellte Hysterese legt nur fest, <i>wann</i> geschaltet wird. Wie weit die Temperatur danach noch läuft, bestimmt die Strecke. Die tatsächliche Schwankungsbreite ist deshalb größer als die Hysterese. Wie groß sie wird, hängt davon ab, wie weit der Arbeitspunkt (hier ca. 76 % Leistung) von 0 % und 100 % entfernt ist: Je näher er an einer Grenze liegt, desto unsymmetrischer werden Aufheiz- und Abkühlphasen.</p><p>Der Zweipunktregler ist einfach, robust und braucht keine Parametrierung. Dafür erzeugt er eine dauernde Schwingung und viele Schaltspiele.</p>"},{"t":"Impulsbreitenmodulation (PWM) und Periodendauer","h":"<p>Bei der <b>PWM</b> wird die Heizung in einer festen Periode für einen Teil der Zeit eingeschaltet. Das <b>Tastverhältnis</b> (Einschaltzeit / Periodendauer) wirkt auf die träge Strecke wie eine stetige Leistung: 50 % Tastverhältnis entsprechen im Mittel 50 % Heizleistung. Aus einem schaltenden Stellglied wird so ein quasi-stetiges.</p><p>Die <b>Periodendauer</b> muss deutlich kleiner sein als die maßgebliche Zeitkonstante der Strecke, sonst sieht man die einzelnen Impulse als Welligkeit im Istwert. Sie darf aber nicht beliebig klein sein: Sehr kurze Impulse werden vom Stellglied nicht mehr sauber umgesetzt, und jeder Schaltvorgang belastet Stellglied und Netz. Ein Halbleiterrelais wie −TB1 hat keine Kontakte, die verschleißen, und ein nullpunktschaltendes Relais schaltet nahezu ohne Störspitzen. Ein Schütz dagegen verträgt nur eine begrenzte Zahl von Schaltspielen. Für das Netz gilt: Häufiges Schalten großer Lasten erzeugt Spannungsschwankungen (Flicker), die andere Verbraucher stören können.</p>"},{"t":"P-Regler, Arbeitspunkt und bleibende Regelabweichung","h":"<p>Ein <b>P-Regler</b> berechnet die Stellgröße proportional zur Regelabweichung: y = Kp · e. Ohne Abweichung ist die Stellgröße null – an einer Strecke mit Ausgleich braucht das Bad aber dauerhaft Leistung, um 280 °C zu halten. Ein reiner P-Regler stellt sich deshalb auf eine Temperatur unterhalb des Sollwerts ein, bei der die Abweichung gerade die nötige Leistung erzeugt: die <b>bleibende Regelabweichung</b>. Sie wird mit größerem Kp kleiner, aber ein zu großes Kp führt an der verzögerten Strecke zum Schwingen.</p><p>Praxisüblich ist ein <b>Arbeitspunkt</b> (Vorsteuerung): y = y0 + Kp · e, wobei y0 die Leistung im Sollzustand ist. Dann muss der P-Anteil nur noch die Abweichungen ausgleichen. Stimmt y0 nicht genau, bleibt eine kleinere Abweichung übrig.</p>"},{"t":"PID_Compact mit Output_PWM und Selbstoptimierung","h":"<p><code>PID_Compact</code> ist der universelle Regler der S7-1200/1500 mit drei Ausgängen: <code>Output</code> (REAL in %), <code>Output_PER</code> (Analogwert) und <code>Output_PWM</code> (BOOL, impulsbreitenmoduliert). Der Baustein muss in einem <b>Weckalarm-OB</b> aufgerufen werden, weil der I- und D-Anteil eine konstante Abtastzeit voraussetzen. Beim PWM-Ausgang entspricht die Periodendauer der Abtastzeit des PID-Algorithmus. Mit der minimalen Ein- und Ausschaltzeit (erweiterte Einstellungen) begrenzen Sie, wie kurz ein Impuls werden darf.</p><p>Die <b>Selbstoptimierung</b> hat zwei Stufen. Die <b>Voroptimierung</b> wertet die Sprungantwort aus und braucht einen ruhigen Istwert mit ausreichendem Abstand zum Sollwert, also am besten ein kaltes Bad. Die <b>Feinoptimierung</b> regt die Strecke um den Sollwert zu einer Schwingung an und berechnet daraus genauere Parameter. Bei 150 s Zeitkonstante dauert beides lange. Tauchvorgänge während der Optimierung verfälschen das Ergebnis.</p>"},{"t":"Nachfüllen: Grenzen mit Begründung","h":"<p>Auch das Nachfüllen ist ein Zweipunktverhalten mit Hysterese. Die untere Grenze muss so weit über der Freigabeschwelle von −BG10 liegen, dass auch einige Tauchvorgänge hintereinander die Füllhöhe nicht unter diese Schwelle bringen. Die obere Grenze begrenzt die Füllhöhe, damit beim Eintauchen des Korbs nichts überläuft. Der Abstand zwischen beiden Grenzen bestimmt, wie oft nachgefüllt wird.</p><p>In der Praxis kommt hinzu: Frisches Zinn ist kalt und senkt die Badtemperatur. Viele kleine Nachfüllmengen belasten die Temperaturregelung weniger als eine große.</p>"}]},"L25":{"beschr":"<p><b>Ausgangslage:</b> In L23 haben Sie den Kühlwassertank mit einem Zweipunktregler zwischen 60 und 80 % gehalten. Der Pegel pendelt dabei ständig, und −MB17 schaltet häufig. Jetzt soll der Füllstand ruhig auf <b>70 %</b> stehen. Dafür nutzen Sie das stetige Regelventil −MB18 (Stellwert %QW80, Stellzeit 8 s) und den Regler <code>PID_Compact</code>. Das Magnetventil −MB17 liegt in Reihe davor und dient nur noch als Absperrung. Wasser fließt also nur, wenn −MB17 offen ist; wie viel, bestimmt −MB18.</p><p><b>Soll-Verhalten:</b></p><ol><li><code>PID_Compact</code> läuft in einem Weckalarm-OB (z. B. OB30, 100 ms). Sollwert 70 %, Istwert ist −BL2 in Prozent (Normierung wie in L23), der Stellwert geht über <code>Output_PER</code> auf %QW80.</li><li>−MB17 ist die Freigabe der Nachspeisung. Es schließt, wenn −BG39 „voll“ bzw. Drahtbruch meldet (−BG39 = 0) oder der Not-Halt ausgelöst ist (−KF2 = 0). Überlegen Sie, wie sich der Regler verhalten soll, solange −MB17 zu ist, und wann −MB17 überhaupt offen sein muss. Die Ereignisliste meldet „−MB17 offen bei geschlossenem Regelventil“.</li><li>Der Trockenlaufschutz der Pumpe −QA7 über −BG38 aus L22 bleibt bestehen.</li></ol><p><b>Versuchsablauf:</b></p><ol><li>Betreiben Sie den Regler zunächst als reinen <b>P-Regler</b> (I- und D-Anteil abgeschaltet). Beobachten Sie den Pegel ohne Störgröße und dann mit offenem Ablasshahn. Messen Sie die bleibende Regelabweichung in Prozent.</li><li>Schalten Sie den <b>I-Anteil</b> zu und wiederholen Sie den Versuch. Öffnen und schließen Sie den Ablasshahn und beobachten Sie, wie der Regler zurückführt.</li><li>Führen Sie die <b>Selbstoptimierung</b> (Vor- und Feinoptimierung) durch, dokumentieren Sie die ermittelten Parameter und vergleichen Sie sie mit Ihren Handeinstellungen.</li></ol><p><b>Randfälle:</b> Not-Halt während der Regelung und Wiederanlauf; Anlauf mit fast leerem Tank; Ablasshahn offen und gleichzeitig Sprühkühlung aktiv – reicht der maximale Zulauf dann noch aus?</p><p><b>Vorgaben:</b> Die Regelung gehört in den FB aus L23 (oder einen eigenen FB mit Bausteinkopf), <code>PID_Compact</code> als Multiinstanz. %QW80 und −MB17 werden an genau einer Stelle geschrieben. Merker sind nicht zulässig.</p><p><b>Abgabe:</b> Programm, Trendaufzeichnungen von Soll-, Ist- und Stellwert für P und PI (jeweils mit Ablasshahn auf und zu), gemessene bleibende Regelabweichung, Parameter der Selbstoptimierung, Antworten auf die Leitfragen. <b>Erfolgreich</b> ist die Arbeit, wenn der PI-Regler den Pegel nach Öffnen und Schließen des Ablasshahns wieder auf 70 % zurückführt und die Ereignisliste dabei keine Meldung zum Tank zeigt.</p>","wissen":[{"t":"Integrierende Strecke (ohne Ausgleich)","h":"<p>Der Füllstand eines Tanks ist die aufsummierte Differenz aus Zulauf und Abfluss. Solange mehr hineinfließt als hinaus, steigt er; es gibt keinen Wert, bei dem er sich von selbst einpendelt. Eine solche Strecke heißt <b>integrierend</b> oder <b>ohne Ausgleich</b> (I-Strecke). Bei der Zinnbadtemperatur in L24 war das anders: Dort gehört zu jeder Heizleistung eine feste Endtemperatur.</p><p>Für die Regelung heißt das: Im Gleichgewicht muss der Zulauf genau dem Abfluss entsprechen. Überlegen Sie, welche Ventilstellung dazu jeweils ohne und mit Verbrauch nötig ist. Hinzu kommt die <b>Stellreserve</b>: Übersteigen Verbrauch und Störgröße zusammen den maximalen Zulauf, kann kein Regler den Pegel halten.</p>"},{"t":"P- und I-Anteil","h":"<p>Der <b>P-Anteil</b> reagiert sofort und proportional auf die Regelabweichung (y = Kp · e). Ohne Abweichung liefert er die Stellgröße null. Ob das ausreicht, hängt davon ab, welche Stellgröße die Strecke im Gleichgewicht braucht.</p><p>Der <b>I-Anteil</b> summiert die Regelabweichung über die Zeit auf. Solange eine Abweichung besteht, verändert er die Stellgröße weiter – er kommt erst zur Ruhe, wenn die Abweichung null ist. Damit beseitigt er bleibende Abweichungen. Die <b>Integrationszeit</b> Ti bestimmt, wie schnell er wirkt. Ein zu kleines Ti macht den Regelkreis unruhig, besonders an einer I-Strecke, weil dann zwei integrierende Glieder hintereinander liegen und der Kreis zum Schwingen neigt.</p><p>In <code>PID_Compact</code> schalten Sie den I-Anteil mit Integrationszeit = 0 ab, den D-Anteil mit Differenzierzeit = 0.</p>"},{"t":"PID_Compact richtig einbinden","h":"<ul><li><b>Weckalarm-OB:</b> I- und D-Anteil rechnen mit der Zeit zwischen zwei Aufrufen. Im zyklischen OB1 schwankt diese Zeit. Deshalb läuft der Regler in einem Weckalarm-OB mit festem Takt.</li><li><b>Input oder Input_PER:</b> <code>Input</code> erwartet einen bereits normierten REAL-Wert, <code>Input_PER</code> den Rohwert der Baugruppe. Im zweiten Fall erfolgt die Skalierung in der Konfiguration des Reglers.</li><li><b>Output_PER:</b> liefert den Stellwert im Analogformat 0…27648 und passt damit direkt zur Analogausgabe.</li><li><b>Regelsinn:</b> Mehr Stellwert ergibt hier mehr Füllstand, der Regelsinn ist also normal. Bei einem Kühlregler wäre er umgekehrt (Invertierung in der Konfiguration).</li><li><b>Betriebszustände:</b> Der Ausgang <code>State</code> zeigt unter anderem inaktiv, Vor- und Feinoptimierung, Automatik- und Handbetrieb.</li></ul>"},{"t":"Absperrventil in Reihe und Windup","h":"<p>−MB17 ist stromlos geschlossen und wird zusätzlich hart über −KF2 abgeschaltet. Ein Not-Halt sperrt den Zulauf also unabhängig vom Programm. Das Programm schließt −MB17 trotzdem selbst, damit Befehl und tatsächlicher Zustand übereinstimmen.</p><p>Für den Regler entsteht dadurch ein Problem: Er sieht nicht, dass sein Stellglied wirkungslos ist. Der Pegel sinkt, der I-Anteil summiert weiter, und der Stellwert läuft an den oberen Anschlag. Wird −MB17 wieder freigegeben, öffnet das Ventil voll, und der Pegel schießt über den Sollwert. Diesen Effekt nennt man <b>Windup</b>. Der eingebaute Anti-Windup von <code>PID_Compact</code> greift nur an den Grenzen des eigenen Stellwerts, nicht bei einer Sperre von außen. Deshalb müssen Sie festlegen, in welchem Betriebszustand der Regler arbeitet, solange die Freigabe fehlt.</p>"},{"t":"Selbstoptimierung und Parametersicherung","h":"<p>Die <b>Voroptimierung</b> gibt einen Stellgrößensprung aus und berechnet die Parameter aus dem Verlauf des Istwerts. Sie braucht einen ruhigen Istwert und einen ausreichenden Abstand zum Sollwert; die genauen Bedingungen nennt die Online-Hilfe. Die <b>Feinoptimierung</b> regt eine begrenzte Schwingung um den Sollwert an und verbessert die Parameter. Störgrößen während der Optimierung, etwa ein offener Ablasshahn, verfälschen das Ergebnis.</p><p>Die gefundenen Parameter stehen zunächst nur in der CPU. Übernehmen Sie sie im Inbetriebnahmefenster ins Projekt. Sonst überschreibt das nächste Laden des Instanz-DB sie mit den alten Werten. Prüfen Sie optimierte Parameter immer kritisch: Die Selbstoptimierung ist ein Startwert, keine Garantie für ein gutes Regelverhalten.</p>"}]},"L26":{"beschr":"<p><b>Ausgangslage:</b> Die PI-Regelung aus L25 hält den Kühlwassertank auf 70 %. Solange alles funktioniert, merkt niemand etwas von der Technik dahinter. Klemmt aber das Regelventil −MB18 oder ist die Frischwasserleitung abgesperrt (z. B. Kugelhahn zu, Filter verstopft, Netzdruck weg), regelt der Regler ins Leere: Er öffnet das Ventil immer weiter, der Pegel sinkt trotzdem. Bemerkt wird das bisher erst, wenn −BG38 abfällt und die Sprühkühlung stillsteht. Ihr Programm soll solche Störungen früher erkennen – aus dem Verhalten von Stellglied und Prozess.</p><p><b>Soll-Verhalten:</b></p><ol><li><b>Stellungsüberwachung −MB18:</b> Vergleichen Sie den ausgegebenen Stellwert (%QW80) mit der Stellungsrückmeldung (%IW74), beide in Prozent. Ist die Abweichung größer als 10 % und hält das länger als 15 s an, meldet das Programm „Regelventil klemmt“.</li><li><b>Zulaufüberwachung:</b> Ist −MB17 offen und steigt der Pegel −BL2 innerhalb von 20 s nicht um mindestens 1 %, meldet das Programm „Frischwasser fehlt“ und schaltet die Nachspeisung ab.</li><li><b>Begründung:</b> Leiten Sie die 15 s nachvollziehbar aus der Stellzeit des Ventils (8 s für 0…100 %) ab.</li></ol><p><b>Randfälle, die Sie klären müssen:</b></p><ul><li>Während das Ventil normal von 0 auf 100 % fährt, ist die Abweichung zwischen Stellwert und Rückmeldung zeitweise groß. Das darf keine Meldung auslösen.</li><li>Im eingeschwungenen Regelbetrieb steht der Pegel absichtlich still, obwohl −MB17 offen sein kann. Auch bei offenem Ablasshahn oder kleiner Ventilöffnung steigt er kaum. Legen Sie fest, unter welchen Bedingungen die Zulaufüberwachung überhaupt aktiv sein darf, damit sie nur echte Störungen erkennt.</li><li>Was geschieht nach dem Abschalten der Nachspeisung mit dem PID-Regler (Windup, vgl. L25), und wie wird nach Beheben der Ursache wieder angefahren?</li></ul><p><b>Vorgaben:</b> Die Überwachungen ergänzen den FB aus L25, Zeiten als Multiinstanz, Meldungen mit Selbsthaltung in statischen Variablen. Quittiert wird mit einer Flanke von −SF4, und zwar erst, wenn die Ursache behoben ist. Die Abschaltung wirkt über die einzige Schreibstelle von −MB17. Merker sind nicht zulässig.</p><p><b>Test:</b> Das Klemmen eines Ventils lässt sich im Signalmonitor nicht forcen, weil dort nur digitale Eingänge geforct werden können. Verwenden Sie z. B. eine Testumschaltung im FB, die statt %IW74 einen festen Wert verwendet. Das fehlende Frischwasser simulieren Sie entsprechend, z. B. mit einer Testumschaltung, die den Pegelwert von −BL2 einfriert.</p><p><b>Abgabe:</b> Programm, schriftliche Herleitung der 15 s, Testprotokoll mit beiden Störfällen und mit einer normalen Stellbewegung 0 → 100 %, Antwort auf die Leitfrage. <b>Erfolgreich</b> ist die Arbeit, wenn beide Störungen zuverlässig gemeldet werden und im Normalbetrieb – auch bei Sollwertsprüngen und offenem Ablasshahn – kein Fehlalarm auftritt.</p>","wissen":[{"t":"Stellungsrückmeldung und Soll-Ist-Vergleich am Stellglied","h":"<p>Ein Stellantrieb mit <b>Stellungsrückmeldung</b> meldet, wo das Ventil tatsächlich steht. Damit lässt sich prüfen, ob es den Befehl der Steuerung ausführt. Typische Ursachen für Abweichungen sind Kalk und Schmutz am Ventilsitz, ein festgefressener Spindelantrieb, ein defekter Motor oder eine unterbrochene Signalleitung.</p><p>Ohne diese Überwachung bleibt ein klemmendes Ventil im Regelkreis unbemerkt: Der Regler verstellt den Stellwert, das Ventil folgt nicht, der Istwert läuft davon. Erst die Folgestörung – hier der leere Tank und die stehende Pumpe – fällt auf. Die Überwachung verlegt die Erkennung an die Ursache und verkürzt die Fehlersuche erheblich.</p>"},{"t":"Toleranzband und Überwachungszeit aus der Stellzeit","h":"<p>Stellwert und Rückmeldung sind nie genau gleich: Der Antrieb braucht Zeit, und die Messung hat eine Toleranz. Die Überwachung arbeitet deshalb mit einem <b>Toleranzband</b> (hier 10 %) und einer <b>Überwachungszeit</b>.</p><p>Die Überwachungszeit richtet sich nach der längsten normalen Stellbewegung, also dem Weg von 0 auf 100 %. Wie in L17 wird diese Zeit nicht direkt übernommen, sondern um einen Faktor oder einen festen Zuschlag erhöht. Denn auch die Stellzeit eines realen Antriebs streut, etwa durch Temperatur, Verschleiß und Reibung. Ist die Zeit zu knapp, gibt es Fehlalarme bei jedem großen Sollwertsprung. Ist sie zu großzügig, läuft der Prozess lange mit einem defekten Stellglied. Bedenken Sie außerdem, ab welchem Zeitpunkt der Bewegung die Abweichung wieder unter das Toleranzband fällt.</p>"},{"t":"Prozessüberwachung über den Verlauf des Istwerts","h":"<p>Nicht jede Störung zeigt sich an einem einzelnen Signal. Eine abgesperrte Zuleitung sieht man weder am Magnetventil noch am Regelventil – beide melden, was sie sollen. Erkennbar ist sie nur an der <b>Wirkung</b>: Bei offenem Zulauf muss der Pegel steigen. Diese Art der Überwachung heißt Plausibilitäts- oder Gradientenüberwachung.</p><p>In der Praxis bewährt sich das <b>Fenster-Verfahren</b>: Zu Beginn wird der Istwert gespeichert, nach einer festen Zeit wird die Änderung mit einer Mindeständerung verglichen. Das ist robuster als die Ableitung von Zyklus zu Zyklus, die stark auf Messrauschen reagiert. Entscheidend ist die <b>Gültigkeitsbedingung</b>: Die Prüfung ist nur sinnvoll, wenn der Prozess tatsächlich einen deutlichen Anstieg erwarten lässt. Sonst meldet sie Störungen, die keine sind.</p>"},{"t":"Meldung, Selbsthaltung und Quittierung","h":"<p>Eine Störung wie „Frischwasser fehlt“ darf nicht verschwinden, nur weil die Bedingung kurzzeitig nicht mehr zutrifft. Sonst schaltet die Nachspeisung von selbst wieder ein, die Störung tritt erneut auf, und die Anlage pendelt zwischen Störung und Betrieb. Deshalb wird die Meldung <b>gespeichert</b> (statische Variable, rücksetzdominant) und erst durch eine bewusste <b>Quittierung</b> zurückgesetzt. Die Quittierung wirkt nur mit einer Flanke von −SF4: Ein klemmender oder dauerhaft gedrückter Taster darf keine Meldungen ständig zurücksetzen.</p><p>Zur Störungsreaktion gehört der <b>sichere Zustand</b>: Nachspeisung aus, Regler in einen definierten Zustand, Meldung an den Bediener. Der Wiederanlauf erfolgt erst nach Quittierung und behobener Ursache.</p>"}]},"L27":{"beschr":"<p><b>Ausgangslage:</b> Bisher laufen Band 1, die Rollenkurve und Band 2 an Wendeschützen mit fester Geschwindigkeit. Jedes Einschalten ist ein harter Ruck, die Körbe rutschen auf dem Gurt, und die Geschwindigkeit lässt sich nicht an den Prozess anpassen. Künftig werden die drei Förderer von Frequenzumrichtern SINAMICS G120 angetrieben: −TA2 (Band 1), −TA3 (Band 2) und −TA4 (Rollenkurve). Die Umrichter hängen über PROFINET an der CPU und werden mit dem Standardtelegramm 1 geführt. Der Übergabe-Handshake aus L18 bleibt fachlich unverändert. Er entscheidet weiterhin, <i>wann</i> ein Förderer läuft – nur <i>wie</i> der Antrieb angesteuert wird, ändert sich.</p><p><b>Aufgabe:</b></p><ol><li><b>Projektierung:</b> Fügen Sie die drei Umrichter in der Netzsicht ein, wählen Sie Telegramm 1 mit den Adressen aus der Tabelle und legen Sie je Antrieb ein <code>TO_SpeedAxis</code> an. Die Option Simulation / virtuelle Achse darf <b>nicht</b> aktiv sein, sonst schreibt das Technologieobjekt kein Telegramm, und der Zwilling bewegt nichts.</li><li><b>Antriebsdaten:</b> Bezugsdrehzahl 1500 1/min und Maximaldrehzahl 2250 1/min von Hand eintragen, weil es keinen echten Umrichter gibt, aus dem sie gelesen werden könnten.</li><li><b>Programm:</b> Ein FB je Förderer (z. B. <code>Conveyor</code>, dreimal als Multiinstanz) mit <code>MC_Power</code>, <code>MC_MoveVelocity</code>, <code>MC_Halt</code> und <code>MC_Reset</code>. Die Schnittstelle des FB legen Sie selbst fest: mindestens Freigabe, Geschwindigkeitssollwert mit Richtung, Quittierung sowie Rückmeldungen für Bereit, Läuft und Störung.</li><li><b>Geschwindigkeiten:</b> Stimmen Sie die Sollwerte so ab, dass an den Übergaben kein Korb hängen bleibt. Rückwärts fahren Sie über eine negative Geschwindigkeit. Tragen Sie die gewählten Werte in mm/s und 1/min in eine Tabelle ein und begründen Sie sie.</li><li><b>Rampen:</b> Prüfen Sie Hoch- und Rücklauf im Fenster <i>Umrichter → Rampen live</i>.</li></ol><p><b>Randfälle:</b> Not-Halt während der Fahrt (STO über −KF2), Wiederanlauf nach Quittieren, Richtungsumkehr bei laufendem Band, Störung eines einzelnen Antriebs, während die anderen noch einen Korb in der Übergabe haben.</p><p><b>Vorgaben:</b> Nur das Technologieobjekt schreibt das Telegramm. %QW256 bis %QW266 werden nicht zusätzlich direkt beschrieben. Befehle wie Start und Quittieren wirken mit Flanke. Zustände liegen in statischen Variablen, Merker sind nicht zulässig.</p><p><b>Abgabe:</b> TIA-Projekt, Geschwindigkeitstabelle mit Begründung, Bildschirmfoto der Rampen, Protokoll eines Not-Halt-Tests mit Wiederanlauf, Antworten auf die Leitfragen. <b>Erfolgreich</b> ist die Arbeit, wenn alle drei Achsen fahren und ihr Status im TO-DB plausibel ist, zehn Körbe ohne Meldung an einer Übergabe durchlaufen und die Förderer nach Not-Halt und Quittieren mit <code>MC_Reset</code> wieder anlaufen.</p>","wissen":[{"t":"Frequenzumrichter statt Wendeschütz","h":"<p>Am Wendeschütz läuft der Motor mit Netzfrequenz, also immer mit derselben Drehzahl. Beim Einschalten springt das Drehmoment, Gurt und Getriebe werden stoßartig belastet, und leichte Körbe rutschen. Ein <b>Frequenzumrichter</b> erzeugt eine Drehspannung mit veränderlicher Frequenz. Damit ist die Drehzahl stufenlos einstellbar, die Drehrichtung wechselt ohne Schütze, und <b>Rampen</b> sorgen für sanftes Anfahren und Bremsen. Die Schütze verschleißen nicht mehr, und der Antrieb liefert über das Telegramm Zustand, Istdrehzahl und Störungen an die Steuerung.</p>"},{"t":"PROFIdrive-Standardtelegramm 1 und Normierung","h":"<p>Das <b>Standardtelegramm 1</b> nach PROFIdrive überträgt je Richtung zwei Wörter: von der SPS das Steuerwort STW1 und den Drehzahlsollwert NSOLL_A, vom Umrichter das Zustandswort ZSW1 und den Drehzahlistwert NIST_A. STW1 enthält die Befehle (z. B. AUS1, Betrieb freigeben, Quittieren), ZSW1 die Zustände (z. B. Betriebsbereit, Störung, Einschaltsperre).</p><p>Drehzahlen werden normiert übertragen: <b>16#4000 (16384) entsprechen 100 % der Bezugsdrehzahl</b>, hier 1500 1/min. Der Zahlenbereich reicht damit bis knapp 200 %, sodass auch Drehzahlen über der Bezugsdrehzahl darstellbar sind. Die Maximaldrehzahl (2250 1/min = 150 %) begrenzt im Umrichter, was tatsächlich gefahren wird. Stimmen Bezugsdrehzahl im Technologieobjekt und im Antrieb nicht überein, fährt der Antrieb mit falscher Geschwindigkeit, ohne dass eine Fehlermeldung erscheint.</p>"},{"t":"Technologieobjekt TO_SpeedAxis","h":"<p>Ein <b>Technologieobjekt</b> kapselt die Ansteuerung eines Antriebs. <code>TO_SpeedAxis</code> bildet aus Ihren Befehlen das Telegramm, durchläuft die PROFIdrive-Zustandsmaschine selbstständig und rechnet Drehzahlen in normierte Werte um. Es läuft im Takt des OB MC-Servo, unabhängig vom OB1. Seinen Zustand finden Sie im Technologieobjekt-DB (<code>StatusWord</code>, <code>ErrorWord</code>, <code>ActualSpeed</code>) und in der Diagnose des TO.</p><p>Weil das TO das Telegramm schreibt, ist es die einzige Schreibstelle für STW1 und NSOLL_A. Eine zusätzliche direkte Zuweisung auf diese Adressen würde zwei Schreibstellen erzeugen und zu schwer erklärbarem Verhalten führen. Wie das Telegramm ohne TO von Hand gebildet wird, lernen Sie in L28.</p>"},{"t":"PLCopen-Bausteine MC_Power, MC_MoveVelocity, MC_Halt, MC_Reset","h":"<ul><li><b>MC_Power</b> gibt die Achse frei. <code>Enable</code> ist pegelgesteuert: Solange es 1 ist, bleibt die Achse eingeschaltet. Bei 0 wird sie stillgesetzt und gesperrt.</li><li><b>MC_MoveVelocity</b> fährt mit konstanter Geschwindigkeit. <code>Execute</code> wirkt auf die steigende Flanke: Der Auftrag wird einmal übernommen und läuft weiter, bis ein anderer ihn ablöst. Mit <code>Direction</code> = 0 bestimmt das Vorzeichen von <code>Velocity</code> die Drehrichtung. <code>InVelocity</code> meldet das Erreichen der Sollgeschwindigkeit.</li><li><b>MC_Halt</b> bremst mit der projektierten Verzögerung bis zum Stillstand und löst dabei den laufenden Bewegungsauftrag ab (<code>CommandAborted</code> am abgelösten Baustein).</li><li><b>MC_Reset</b> quittiert Fehler des Technologieobjekts, ebenfalls mit Flanke an <code>Execute</code>.</li></ul><p>Alle Bausteine melden über <code>Busy</code>, <code>Done</code> bzw. <code>InVelocity</code>, <code>Error</code> und <code>ErrorID</code>, was aus dem Auftrag geworden ist. Werten Sie diese Ausgänge aus, statt nur Befehle abzusetzen.</p>"},{"t":"Geschwindigkeiten an Übergaben","h":"<p>An einer Stoßstelle liegt der Korb gleichzeitig auf zwei Förderern. Er bewegt sich nur, wenn beide in dieselbe Richtung laufen, und dann nicht schneller als der langsamere. Der schnellere Förderer gleitet unter dem Korb durch. Das kostet Reibung, Verschleiß an Gurt und Korbkufen und kann den Korb verdrehen.</p><p>Die Umrechnung zwischen Bandgeschwindigkeit und Motordrehzahl hängt von Getriebe und Trommeldurchmesser ab. Sie ist deshalb für jeden Förderer anders: Bei 1500 1/min läuft Band 1 mit 100 mm/s, Band 2 mit 120 mm/s und die Rollenkurve mit 110 mm/s. Wer für alle Förderer dieselbe Drehzahl vorgibt, erhält also unterschiedliche Geschwindigkeiten.</p>"},{"t":"STO, Not-Halt und Wiederanlauf","h":"<p>Der Not-Halt wirkt hart über das Sicherheitsrelais −KF2 und wählt am Umrichter <b>STO</b> (Safe Torque Off) an: Die Impulse des Leistungsteils werden sofort gesperrt, der Motor erzeugt kein Drehmoment mehr und trudelt aus. Das entspricht der Stoppkategorie 0 nach DIN EN 60204-1. Das SPS-Programm schaltet dabei nichts ab, es erkennt den Zustand (−KF2, Status des TO) und meldet ihn.</p><p>Nach STO steht der Umrichter in der <b>Einschaltsperre</b>. Er läuft erst wieder an, wenn die Steuerung bewusst neu einschaltet. Das ist gewollt: Nach dem Entriegeln des Not-Halts darf eine Maschine nicht selbsttätig wieder anlaufen (DIN EN 60204-1, DIN EN ISO 13850). Der Wiederanlauf erfordert deshalb Quittieren an −KF2, das Zurücksetzen der Fehler im TO mit <code>MC_Reset</code> und eine erneute Freigabe.</p>"}]},"L28":{"beschr":"<p><b>Ausgangslage:</b> In L27 hat das Technologieobjekt <code>TO_SpeedAxis</code> den Umrichter −TA2 von Band 1 geführt. Sie haben nur <code>MC_Power</code> und <code>MC_MoveVelocity</code> aufgerufen, Steuerwort und Sollwert hat das Technologieobjekt im Hintergrund gebildet. In dieser Übung verzichten Sie auf das Technologieobjekt und sprechen −TA2 direkt über die vier Wörter des Standardtelegramms 1 an: Sie schreiben STW1 (%QW256) und NSOLL_A (%QW258) und lesen ZSW1 (%IW256) und NIST_A (%IW258). Genau dieses Wissen brauchen Sie im Feld, wenn ein Antrieb „nicht will“ und Sie im Telegramm nachsehen müssen, woran es liegt.</p><p><b>Soll-Verhalten Schritt für Schritt:</b></p><ol><li>Nach dem Einschalten und nach jedem Not-Halt steht −TA2 in der Einschaltsperre (S1, ZSW1.6 = 1). Ihr Programm erkennt das und gibt ein Steuerwort mit AUS1 = 0 aus.</li><li>Der Umrichter meldet „Einschaltbereit“ (S2). Erst danach darf AUS1 auf 1 gehen; der Antrieb durchläuft „Betriebsbereit“ (S3) und erreicht „Betrieb freigegeben“ (S4).</li><li>Eine Sollgeschwindigkeit in mm/s wird in NSOLL_A umgerechnet: vorwärts positiv, rückwärts negativ. NIST_A wird zurück in mm/s gerechnet und angezeigt.</li><li>Halten Sie das Band nacheinander mit AUS1, AUS2 und AUS3 an und beobachten Sie im Fenster <i>Umrichter → Rampen live</i>, wie unterschiedlich die Istdrehzahl abfällt.</li></ol><p><b>Randfälle, die Ihr Programm beherrschen soll:</b> Was geschieht, wenn sofort <code>16#047F</code> geschrieben wird, ohne die Einschaltsperre abzuwarten? Was, wenn am Bedienpanel HAND gewählt ist (ZSW1.9 = 0)? Welcher Sollwert ist höchstens zulässig (Maximaldrehzahl 2250 1/min)? Was zeigt ZSW1, wenn der Umrichter eine Störung hat (Vorgriff auf L30)?</p><p><b>Vorgaben:</b> Kapseln Sie den Antrieb in einem eigenen FB mit sprechender Schnittstelle (z. B. Einschalten, Richtung, Sollgeschwindigkeit hinein; Zustand, Bereit, Istgeschwindigkeit heraus). Zustände als #stat-Variablen, die Bitbedeutungen als benannte Konstanten oder Slices, keine Merker. Die Telegrammwörter haben genau eine Schreibstelle. Den Not-Halt schaltet −KF2 hart über STO ab; Ihr Programm wertet die Rückmeldung nur aus.</p><p><b>Abgabe:</b> das Programm (FB mit ausgefülltem Bausteinkopf), ein Protokoll, in dem Sie für jeden Zustand S1 bis S4 STW1 und ZSW1 als Hex-Wert und Bit für Bit festhalten und mit der Anzeige im Fenster <i>Umrichter</i> vergleichen, sowie eine kurze Gegenüberstellung der drei Haltearten (Zeit bis Stillstand, Verlauf der Kurve, Einsatzzweck).</p><p><b>Erfolg:</b> −TA2 fährt vorwärts und rückwärts mit der gewünschten Geschwindigkeit, der Weg durch die Zustandsmaschine ist im Protokoll lückenlos belegt, und Sie können AUS1, AUS2 und AUS3 an den Kurven unterscheiden und begründen, wann man welche Halteart wählt.</p>","wissen":[{"t":"Standardtelegramm 1 und PROFIdrive","h":"<p>PROFIdrive ist das herstellerübergreifende Antriebsprofil für PROFIBUS und PROFINET. Es legt fest, welche Bedeutung die zyklisch übertragenen Prozessdaten (PZD) haben, damit eine Steuerung jeden profilkonformen Antrieb gleich ansprechen kann. Das <b>Standardtelegramm 1</b> ist die kleinste Variante: zwei Wörter von der SPS zum Antrieb (STW1, NSOLL_A) und zwei zurück (ZSW1, NIST_A), daher „PZD-2/2“.</p><p>Die Wörter werden in jedem Buszyklus übertragen, unabhängig davon, ob Ihr Programm sie gerade ändert. Der Antrieb reagiert also immer auf den aktuellen Inhalt des Ausgangsabbilds. Geht die SPS in STOP, werden die Ausgänge 0 – und ein Steuerwort 0 bedeutet für den Antrieb „aus“. Das ist gewollt: Ein Kommunikationsausfall darf keinen Antrieb weiterlaufen lassen.</p>"},{"t":"Steuerwort STW1 Bit für Bit","h":"<table><thead><tr><th>Bit</th><th>Bedeutung bei 1</th></tr></thead><tbody><tr><td>0</td><td>EIN (AUS1 nicht aktiv)</td></tr><tr><td>1</td><td>kein AUS2 (Impulse nicht gesperrt)</td></tr><tr><td>2</td><td>kein AUS3 (kein Schnellhalt)</td></tr><tr><td>3</td><td>Betrieb freigeben</td></tr><tr><td>4</td><td>Hochlaufgeber freigeben</td></tr><tr><td>5</td><td>Hochlaufgeber fortsetzen</td></tr><tr><td>6</td><td>Drehzahlsollwert freigeben</td></tr><tr><td>7</td><td>Störung quittieren (Flanke 0 → 1)</td></tr><tr><td>10</td><td>Führung durch SPS</td></tr><tr><td>11</td><td>Sollwertinvertierung (Drehrichtung umkehren)</td></tr></tbody></table><p>Auffällig ist, dass AUS2 und AUS3 <b>nullaktiv</b> sind: Das Bit muss 1 sein, damit der Antrieb laufen darf. Der Grund ist derselbe wie beim Öffner am STOP-Taster: Fehlt das Signal (Wort 0, Busausfall), ist der sichere Zustand „aus“ automatisch erreicht. Ist Bit 10 = 0, ignoriert der Umrichter das gesamte Telegramm – ein häufiger Grund für „Antrieb reagiert nicht“, wenn man das Steuerwort Bit für Bit selbst zusammensetzt.</p>"},{"t":"Zustandsmaschine und Zustandswort ZSW1","h":"<p>Ein PROFIdrive-Antrieb kennt feste Zustände: <b>S1 Einschaltsperre</b>, <b>S2 Einschaltbereit</b>, <b>S3 Betriebsbereit</b>, <b>S4 Betrieb</b> (dazu Zwischenzustände beim Anhalten). Welcher Zustand gerade gilt, meldet das Zustandswort:</p><table><thead><tr><th>ZSW1</th><th>Bedeutung bei 1</th></tr></thead><tbody><tr><td>.0</td><td>einschaltbereit</td></tr><tr><td>.1</td><td>betriebsbereit</td></tr><tr><td>.2</td><td>Betrieb freigegeben</td></tr><tr><td>.3</td><td>Störung wirksam</td></tr><tr><td>.4 / .5</td><td>AUS2 / AUS3 nicht aktiv</td></tr><tr><td>.6</td><td>Einschaltsperre</td></tr><tr><td>.7</td><td>Warnung wirksam</td></tr><tr><td>.9</td><td>Führung durch SPS angefordert</td></tr></tbody></table><p>Die <b>Einschaltsperre</b> ist ein Wiederanlaufschutz. Nach Netz-Ein, nach AUS2, AUS3, STO oder einer quittierten Störung soll der Antrieb nicht einfach losfahren, nur weil im Steuerwort noch ein alter EIN-Befehl steht. DIN EN 60204-1 verlangt, dass ein unerwarteter Anlauf verhindert wird. Überlegen Sie, welche Bedingung der Umrichter deshalb an den EIN-Befehl stellt, bevor er S1 verlässt. Ihr Programm sollte nie „blind“ ein festes Steuerwort schreiben, sondern den Zustand aus ZSW1 lesen und danach handeln.</p>"},{"t":"AUS1, AUS2, AUS3 – drei Arten anzuhalten","h":"<ul><li><b>AUS1</b> (STW1.0 = 0): Der Antrieb bremst über die normale Rücklauframpe (im Zwilling 0,3 s) und sperrt im Stillstand die Impulse. Das ist das betriebsmäßige Anhalten.</li><li><b>AUS2</b> (STW1.1 = 0): Die Impulse werden sofort gesperrt, der Motor ist drehmomentfrei und trudelt aus. Die Auslaufzeit hängt dann allein von Masse und Reibung ab. Verwendet wird AUS2 z. B. bei Störungen im Leistungsteil oder wenn eine mechanische Bremse übernimmt.</li><li><b>AUS3</b> (STW1.2 = 0): Schnellhalt über eine eigene, steilere Rampe (im Zwilling 0,1 s). Gedacht für schnelles, aber geführtes Anhalten.</li></ul><p>Nach AUS2 und AUS3 geht der Antrieb in die Einschaltsperre. Im Fenster <i>Rampen live</i> sehen Sie den Unterschied direkt an der Istdrehzahl. Zur Einordnung: Die Stoppkategorien nach DIN EN 60204-1 (0 = sofortiges Abschalten der Energie, 1 = geführtes Stillsetzen, dann Abschalten) beschreiben ein ähnliches Prinzip – AUS1/AUS2/AUS3 sind aber <b>keine</b> Sicherheitsfunktionen. Sicher abgeschaltet wird nur über STO (−KF2).</p>"},{"t":"Normierung 16#4000 = 100 %","h":"<p>NSOLL_A und NIST_A sind vorzeichenbehaftete 16-Bit-Ganzzahlen. PROFIdrive legt 100 % der Bezugsgröße (hier Bezugsdrehzahl p2000 = 1500 1/min) auf <code>16#4000</code> = 16384, nicht auf den Höchstwert 32767. So bleibt Reserve bis knapp 200 %, etwa für Maximaldrehzahlen über der Bezugsdrehzahl (hier 2250 1/min = 150 %). Negative Werte bedeuten die Gegenrichtung.</p><p>Die Umrechnung von mm/s in das Telegrammwort ist ein einfacher Dreisatz über die Geschwindigkeit, die 100 % entspricht (−TA2: 100 mm/s). Zwei typische Fehler: Rechnen in INT, wobei Zwischenergebnisse überlaufen, und fehlende Begrenzung, sodass bei einem Eingabefehler ein Wert über 150 % oder ein Vorzeichenüberlauf ausgegeben wird. Rechnen Sie deshalb in REAL und begrenzen Sie vor der Wandlung, z. B. so:</p><pre class=\"code\"><code>#tempSpeed := LIMIT(MN := -SPEED_MAX, IN := #speedSetpoint, MX := SPEED_MAX);\n#tempWord := REAL_TO_INT(#tempSpeed * SCALE_100PCT / SPEED_100PCT);</code></pre>"},{"t":"Byte-Reihenfolge: warum Slice statt %I-Bit","h":"<p>S7-CPUs legen Wörter im Big-Endian-Format ab: Im Wort %IW256 ist %IB256 das <b>höherwertige</b> Byte, %IB257 das niederwertige. Bit 0 des Zustandsworts (einschaltbereit) liegt deshalb auf %I257.0, Bit 8 auf %I256.0. Wer die Bits über absolute Bitadressen liest, vertauscht leicht die Bytes und wertet das falsche Bit aus – das Programm läuft dann scheinbar, reagiert aber auf etwas anderes.</p><p>Ein <b>Slice</b> greift dagegen über die Bitnummer innerhalb des Worts zu, so wie sie in der Gerätedokumentation steht. Das ist eindeutig, lesbar und unabhängig von der Adresse:</p><pre class=\"code\"><code>#statReadyToSwitchOn := #zsw1.%X0;\n#statFault := #zsw1.%X3;</code></pre><p>Zugleich hält der Slice die Regel ein, im Baustein nur mit Schnittstellenvariablen statt absoluter Adressen zu arbeiten.</p>"}]},"L29":{"beschr":"<p><b>Ausgangslage:</b> Das Prüfband −MA5 läuft am Umrichter −TA5 (Standardtelegramm 1, %QW268/%QW270 und %IW268/%IW270). In L21 haben Sie die Ausschleusung programmiert: Die Kamera −KF10 prüft jedes Teil, −MB16 bläst n.i.O.-Teile 200 mm hinter der Kamera in den roten Behälter. Dort durften Sie mit einer festen Bandgeschwindigkeit rechnen. Jetzt soll der Werker für Probeläufe das Prüfband an der Vor-Ort-Steuerstelle −S50 langsamer stellen können – und die Ausschleusung muss trotzdem jedes n.i.O.-Teil treffen.</p><p><b>Soll-Verhalten:</b></p><ol><li>Mit dem Schlüsselschalter −SA7 übernimmt −S50 das Prüfband; −PF16 leuchtet. −S50 hat Vorrang vor −S40.</li><li>−SF45 schaltet das Prüfband ein, −SF46 (Öffner) schaltet es aus. Die Selbsthaltung ist rücksetzdominant; AUS wirkt immer, auch wenn beide Taster gleichzeitig betätigt sind.</li><li>Das Potentiometer −SF47 (%IW70, 0 bis 27648) gibt die Geschwindigkeit vor: 0 bis 100 % entsprechen 0 bis <code>16#4000</code> in NSOLL_A, also 0 bis 150 mm/s, nur vorwärts.</li><li>Die Zeit vom Kamerasignal bis zum Ausblasen wird aus der tatsächlichen Geschwindigkeit (NIST_A) berechnet, nicht als feste Zeit eingetragen.</li><li>Ist −SA7 aus, gilt wieder die Geschwindigkeit des Automatikbetriebs; legen Sie fest und begründen Sie, welche das ist.</li></ol><p><b>Randfälle:</b> Poti ganz auf 0 (Division durch null?), Werte über 27648 im Übersteuerungsbereich, ein zitternder Analogwert, Drehen am Poti, während Teile zwischen Kamera und Düse liegen, Umschalten von −SA7 bei laufendem Band. Entscheiden Sie, ob Sie eine Mindestgeschwindigkeit vorgeben, und begründen Sie das.</p><p><b>Vorgaben:</b> Die Antriebsansteuerung aus L28 (bzw. L27) und die Teileverfolgung aus L21 werden weiterverwendet und nur erweitert. Umrechnung und Laufzeitberechnung gehören in eigene, wiederverwendbare Bausteine oder klar getrennte Abschnitte eines FB; Zahlenwerte wie 200 mm, 27648 und 16384 stehen als benannte Konstanten im Baustein. Keine Merker, die Selbsthaltung als #stat-Variable.</p><p><b>Abgabe:</b> das erweiterte Programm, eine kurze Rechnung (Tabelle) mit Poti-Wert, NSOLL_A, erwarteter Geschwindigkeit und berechneter Laufzeit für 30 %, 60 % und 100 %, sowie ein Testprotokoll mit den Einträgen der Ereignisliste.</p><p><b>Erfolg:</b> Bei 30 %, 60 % und 100 % wird kein Gutteil ausgeblasen und kein n.i.O.-Teil landet im KLT. Die Ereignisliste des Zwillings ist dabei Ihr Schiedsrichter: Sie meldet „Gutteil ausgeblasen“ und „n.i.O.-Teil im KLT“ selbstständig.</p>","wissen":[{"t":"Analogwerte 0 bis 27648","h":"<p>Siemens-Analogbaugruppen bilden den <b>Nennbereich</b> eines Signals (hier 0 bis 10 V am Potentiometer) auf 0 bis 27648 ab, nicht auf 0 bis 32767. Darüber liegt ein <b>Übersteuerungsbereich</b> bis 32511, in dem der Wert noch gültig, aber außerhalb der Spezifikation ist; 32767 (<code>16#7FFF</code>) kennzeichnet Überlauf bzw. bei Strommessung 4 bis 20 mA einen Drahtbruch. Der Abstand zum Höchstwert ist Absicht: So lassen sich Grenzüberschreitungen erkennen, statt sie stillschweigend abzuschneiden.</p><p>Für Sie heißt das: Begrenzen Sie den Rohwert auf den Nennbereich, bevor Sie ihn weiterrechnen. Ein Poti am Anschlag kann durch Toleranzen leicht über 27648 liegen – ohne Begrenzung würde daraus eine Geschwindigkeit über 100 %.</p>"},{"t":"Wertebereiche sicher umrechnen","h":"<p>Die Umrechnung von 0…27648 auf 0…16384 ist eine lineare Abbildung. In TIA Portal gibt es dafür <code>NORM_X</code> (Rohwert → 0,0 bis 1,0) und <code>SCALE_X</code> (0,0 bis 1,0 → Zielbereich). Wer selbst rechnet, muss auf den Datentyp achten: Das Produkt 27648 × 16384 passt nicht in ein INT und lässt eine Rechnung in INT überlaufen. Rechnen Sie in REAL oder DINT und wan
